<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaradayAI Quản Lý Học Sinh &amp; Ngân Hàng Đề</title>
<!-- THÊM 1/10/2026 — favicon FaradayAI -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- KaTeX — THÊM 26/9/2026: dùng để render công thức toán ($...$) khi admin
     xuất PDF đề đã giao cho học sinh (xem exportAssignedExamPDF). admin.html
     tự thân không hiển thị công thức toán ở màn hình nào khác, chỉ cần
     window.katex sẵn có để render TRƯỚC thành HTML tĩnh rồi ghi vào tab in
     mới mở — nên chỉ cần nạp đúng 1 lần ở đây, không cần nạp lại trong tab đó. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="/tikz-lite.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg: #f5f6f1;
    --surface: #ffffff;
    --surface-2: #eceee5;
    --ink: #12161c;
    --ink-2: #4a5262;
    --muted: #868d7c;
    --line: #dde1d5;
    --accent: #a86a1c;
    --accent-strong: #8f5714;
    --accent-ink: #fffaf1;
    --navy: #10151d;
    --navy-2: #1a212c;
    --navy-line: #2c3542;
    --on-navy: #f3f4ee;
    --on-navy-2: #b7bfc9;
    --good: #0ca30c;
    --warning: #b8790a;
    --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(16,21,29,0.04), 0 8px 24px -12px rgba(16,21,29,0.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #14171a; --surface: #1c2024; --surface-2: #23272c;
      --ink: #f1f0ea; --ink-2: #c4c8c2; --muted: #8b9088; --line: #2d312e;
      --accent: #dba24f; --accent-strong: #eab868; --accent-ink: #1b1204;
      --navy: #0c0f13; --navy-2: #171c22; --navy-line: #2a3138;
      --on-navy: #f3f4ee; --on-navy-2: #9aa3ab;
      --good: #23b823; --warning: #e0a838; --critical: #e8615f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #14171a; --surface: #1c2024; --surface-2: #23272c;
    --ink: #f1f0ea; --ink-2: #c4c8c2; --muted: #8b9088; --line: #2d312e;
    --accent: #dba24f; --accent-strong: #eab868; --accent-ink: #1b1204;
    --navy: #0c0f13; --navy-2: #171c22; --navy-line: #2a3138;
    --on-navy: #f3f4ee; --on-navy-2: #9aa3ab;
    --good: #23b823; --warning: #e0a838; --critical: #e8615f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family:"Literata", Georgia, "Times New Roman", serif; font-weight:600; line-height:1.15; text-wrap:balance; margin:0; }
  p{ margin:0; }
  a{ color: inherit; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding-inline: 20px; }

  header.admin-top{
    background: var(--navy); color: var(--on-navy);
    padding-block: calc(18px + env(safe-area-inset-top, 0px)) 18px;
    border-bottom: 1px solid var(--navy-line);
  }
  header.admin-top .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-family:"Literata",serif; font-weight:700; font-size:1.2rem; }
  .brand-sub{ font-size:0.78rem; color: var(--on-navy-2); }
  .admin-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:0.74rem; color: var(--on-navy-2);
    border:1px solid var(--navy-line); padding:5px 11px 5px 9px; border-radius:999px;
  }
  .admin-chip .dot{ width:6px; height:6px; border-radius:50%; background: var(--accent-strong); }
  .user-chip{ display:flex; align-items:center; gap:10px; }
  .user-chip .ue{ font-size:0.78rem; color:var(--on-navy-2); }
  .signout-btn{ background:none; border:1px solid var(--navy-line); color:var(--on-navy); font-size:0.78rem; padding:6px 12px; border-radius:999px; cursor:pointer; font-family:inherit; }
  .signout-btn:hover{ border-color:var(--accent); }
  .signout-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  main{ padding-block:32px 64px; }

  .page-intro h1{ font-size: clamp(1.4rem, 2.6vw, 1.85rem); }
  .page-intro p{ color: var(--ink-2); margin-top:8px; max-width:64ch; line-height:1.6; font-size:0.95rem; }

  .card{ background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow: var(--shadow); margin-top:22px; }
  @media (max-width:560px){ .card{ padding:18px; } }

  .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:8px; font-weight:600; font-size:0.88rem; text-decoration:none; border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover{ background: var(--accent-strong); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-secondary{ background: var(--surface-2); color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover{ border-color: var(--ink-2); }
  .btn-danger{ background:transparent; color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, var(--line)); }
  .btn-danger:hover{ background: color-mix(in srgb, var(--critical) 8%, transparent); }
  .btn-success{ background:#16a34a; color:#fff; border-color:#16a34a; }
  .btn-success:hover{ background:#15803d; }
  .btn-success:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .banner{ display:flex; align-items:flex-start; gap:10px; padding:13px 16px; border-radius:12px; font-size:0.85rem; line-height:1.55; margin-top:18px; }
  .banner.warn{ background: color-mix(in srgb, var(--warning) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--warning) 35%, var(--line)); color: var(--ink); }
  .banner.info{ background: var(--surface-2); border:1px solid var(--line); color: var(--ink-2); }
  .banner b{ color: var(--ink); }

  /* tabs */
  .tab-row{ display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; }
  .tab-btn{ background:var(--surface); border:1px solid var(--line); color:var(--ink-2); font:600 0.86rem "Be Vietnam Pro",sans-serif; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .tab-btn:hover{ border-color:var(--ink-2); }
  .tab-btn.active{ background:var(--navy); color:var(--on-navy); border-color:var(--navy); }
  .tab-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* login screen */
  .login-wrap{ min-height:64vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:36px 32px; max-width:380px; width:100%; box-shadow:var(--shadow); text-align:center; }
  .login-card h2{ font-size:1.3rem; }
  .login-card p{ color:var(--ink-2); font-size:0.88rem; margin-top:10px; line-height:1.6; }
  .google-btn{ margin-top:24px; width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:11px 16px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 0.9rem "Be Vietnam Pro",sans-serif; cursor:pointer; }
  .google-btn:hover{ border-color:var(--ink-2); }
  .google-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .google-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .login-error{ margin-top:16px; padding:11px 14px; border-radius:10px; background:color-mix(in srgb, var(--critical) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--critical) 35%, var(--line)); color:var(--ink); font-size:0.84rem; line-height:1.55; text-align:left; }

  /* generic list toolbar/search (shared by students + exam bank) */
  .sm-toolbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .sm-toolbar h3{ font-family:"Be Vietnam Pro",sans-serif; font-size:1.1rem; font-weight:700; color:var(--ink); }
  .sm-toolbar .sm-sub{ font-size:0.84rem; color:var(--ink-2); margin-top:4px; max-width:52ch; line-height:1.55; }
  .sm-actions{ display:flex; gap:10px; flex-wrap:wrap; flex:none; }
  .sm-actions .btn{ font-size:0.85rem; padding:9px 16px; }

  .sm-search-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:22px; }
  .sm-search{ position:relative; max-width:340px; width:100%; }
  .sm-search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); pointer-events:none; }
  .sm-search input{ width:100%; padding:9px 14px 9px 34px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:0.86rem "Be Vietnam Pro",sans-serif; }
  .sm-search input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .sm-count{ font-size:0.82rem; color:var(--muted); flex:none; }
  .sm-count b{ color:var(--ink); font-weight:700; }

  .eb-filter-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .eb-select{ padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:0.85rem "Be Vietnam Pro",sans-serif; }
  .eb-select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .sm-table-wrap{ overflow-x:auto; margin-top:18px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
  table.sm-table{ width:100%; border-collapse:collapse; font-size:0.86rem; min-width:760px; }
  table.sm-table th{ text-align:left; padding:12px 16px; background:var(--surface-2); color:var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; font-weight:700; border-bottom:1px solid var(--line); }
  table.sm-table td{ padding:13px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.sm-table tbody tr:last-child td{ border-bottom:none; }
  table.sm-table tbody tr:hover{ background: color-mix(in srgb, var(--accent) 5%, transparent); }
  /* THÊM 28/9/2026 — công tắc bật/tắt chương (panel "Quản lý chương") */
  .cp-switch{ position:relative; display:inline-block; width:42px; height:24px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; padding:0; transition:background .15s; }
  .cp-switch::after{ content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform .15s, background .15s; }
  .cp-switch.on{ background: color-mix(in srgb, var(--good) 30%, var(--surface)); border-color: var(--good); }
  .cp-switch.on::after{ transform:translateX(18px); background:var(--good); }
  .cp-switch:disabled{ opacity:.5; cursor:wait; }
  .cp-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .cp-chapter-box{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface); min-width:200px; flex:1; }
  .cp-chapter-box h4{ font-size:0.9rem; margin:0 0 6px; }
  .cp-chapter-box .btn{ font-size:0.78rem; padding:6px 10px; margin-top:6px; margin-right:6px; }
  .cp-stem{ font-size:0.82rem; color:var(--ink-2); max-width:60ch; line-height:1.5; }
  .sm-student-cell{ display:flex; align-items:center; gap:11px; }
  .sm-avatar{ width:34px; height:34px; border-radius:50%; background:color-mix(in srgb, var(--accent) 18%, var(--surface-2)); color:var(--accent-strong); font-weight:700; font-size:0.85rem; display:flex; align-items:center; justify-content:center; flex:none; }
  .sm-student-name{ font-weight:600; color:var(--ink); display:flex; align-items:center; gap:7px; }
  .sm-student-email{ font-size:0.76rem; color:var(--muted); margin-top:2px; }
  .sm-num{ font-family:"IBM Plex Mono",monospace; font-variant-numeric: tabular-nums; }
  .sm-status-pill{ border:none; font:inherit; cursor:pointer; font-size:0.74rem; font-weight:700; padding:5px 11px; border-radius:999px; font-family:"Be Vietnam Pro",sans-serif; }
  .sm-status-pill:disabled{ cursor:not-allowed; opacity:0.6; }
  .sm-status-pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sm-status-pill.active{ background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .sm-status-pill.inactive{ background: var(--surface-2); color: var(--muted); }
  .sm-link-btn{ background:none; border:none; color:var(--accent-strong); font-weight:600; font-size:0.82rem; cursor:pointer; padding:5px 8px; border-radius:6px; font-family:inherit; }
  .sm-link-btn:hover{ background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .sm-link-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .eb-level{ display:inline-flex; align-items:center; font-size:0.72rem; font-weight:700; padding:4px 10px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .eb-level-1{ color:var(--ink-2); }
  .eb-level-2{ color:var(--accent-strong); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .eb-level-3{ color:var(--warning); border-color:color-mix(in srgb, var(--warning) 45%, var(--line)); background:color-mix(in srgb, var(--warning) 8%, transparent); }
  .eb-level-4{ color:var(--critical); border-color:color-mix(in srgb, var(--critical) 45%, var(--line)); background:color-mix(in srgb, var(--critical) 8%, transparent); }

  .sm-empty{ padding:36px 20px; text-align:center; color:var(--ink-2); }
  .sm-empty p{ font-size:0.9rem; line-height:1.6; max-width:44ch; margin:0 auto 16px; }

  /* Banner "Cảnh báo tự động" — StudentsPanel, học sinh tụt điểm gần đây
     hoặc có Tag kiến thức yếu kéo dài (rule-based, không gọi AI). */
  .sm-alert-banner{ margin:16px 0; border:1px solid color-mix(in srgb, var(--critical) 30%, var(--line)); background:color-mix(in srgb, var(--critical) 6%, var(--surface-2)); border-radius:12px; overflow:hidden; }
  .sm-alert-banner-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; cursor:pointer; flex-wrap:wrap; }
  .sm-alert-banner-title{ font-size:0.92rem; font-weight:700; color:var(--critical); }
  .sm-alert-banner-sub{ font-size:0.78rem; color:var(--ink-2); margin-top:2px; }
  .sm-alert-banner-toggle{ font-size:0.78rem; font-weight:700; color:var(--critical); white-space:nowrap; }
  .sm-alert-banner-list{ border-top:1px solid color-mix(in srgb, var(--critical) 22%, var(--line)); padding:6px 10px; display:flex; flex-direction:column; }
  .sm-alert-row{ display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:8px; cursor:pointer; transition:background .12s ease; }
  .sm-alert-row:hover{ background:color-mix(in srgb, var(--critical) 8%, transparent); }
  .sm-alert-row-name{ font-size:0.86rem; font-weight:700; color:var(--ink); }
  .sm-alert-row-reasons{ font-size:0.78rem; color:var(--ink-2); margin-top:1px; }

  /* Banner "Đăng ký chờ duyệt" — biến thể màu accent (thay vì critical/đỏ)
     của .sm-alert-banner, vì đây là tin tốt (lead mới) chứ không phải cảnh
     báo. THÊM 24/9/2026. */
  .sm-alert-banner.leads{ border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); }
  .sm-alert-banner.leads .sm-alert-banner-title{ color: var(--accent-strong); }
  .sm-alert-banner.leads .sm-alert-banner-list{ border-top-color: color-mix(in srgb, var(--accent) 25%, var(--line)); }
  .sm-reg-row{ display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:8px; flex-wrap:wrap; }
  .sm-reg-row + .sm-reg-row{ border-top:1px solid color-mix(in srgb, var(--accent) 15%, var(--line)); }

  .sm-overlay{ position:fixed; inset:0; background: color-mix(in srgb, var(--navy) 55%, transparent); backdrop-filter: blur(3px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:70; }
  .sm-modal{ background:var(--surface); border-radius:18px; max-width:440px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); padding:26px; }
  .sm-modal.sm-modal-wide{ max-width:560px; }
  .sm-modal-head{ display:flex; align-items:center; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .sm-modal-head h3{ font-family:"Be Vietnam Pro",sans-serif; font-size:1.05rem; font-weight:700; }
  .sm-modal-close{ background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:flex; border-radius:6px; }
  .sm-modal-close:hover{ color:var(--ink); }
  .sm-modal-close:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .sm-profile-head{ text-align:center; }
  .sm-profile-avatar{ width:60px; height:60px; border-radius:50%; background:color-mix(in srgb, var(--accent) 18%, var(--surface-2)); color:var(--accent-strong); font-weight:700; font-size:1.4rem; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .sm-profile-head h4{ font-family:"Literata",serif; font-size:1.2rem; font-weight:600; }
  .sm-profile-head p{ font-size:0.82rem; color:var(--muted); margin-top:4px; }

  .sm-stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:20px; padding:14px; background:var(--surface-2); border-radius:12px; text-align:center; }
  @media (max-width:520px){ .sm-stat-grid{ grid-template-columns:repeat(2,1fr); } }
  .sm-stat-grid .sm-stat-label{ font-size:0.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .sm-stat-grid .sm-stat-value{ font-family:"IBM Plex Mono",monospace; font-variant-numeric: tabular-nums; font-weight:700; font-size:1.05rem; margin-top:4px; }

  .sm-summary-card{ margin-top:18px; padding:16px 20px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); }
  .sm-summary-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .sm-summary-title{ font-family:"Be Vietnam Pro",sans-serif; font-size:0.88rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .sm-summary-badge{ font-size:0.72rem; font-weight:600; color:var(--muted); font-family:"IBM Plex Mono",monospace; background:var(--surface); border:1px solid var(--line); padding:2px 8px; border-radius:999px; }
  .sm-summary-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media (max-width:820px){ .sm-summary-grid{ grid-template-columns:repeat(2,1fr); gap:14px; } }
  @media (max-width:480px){ .sm-summary-grid{ grid-template-columns:1fr; gap:12px; } }
  .sm-summary-item{ display:flex; flex-direction:column; justify-content:space-between; }
  .sm-summary-label{ font-size:0.7rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px; }
  .sm-summary-val{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.45rem; font-weight:700; color:var(--ink); line-height:1.2; }
  .sm-summary-sub{ font-size:0.74rem; color:var(--ink-2); margin-top:4px; line-height:1.4; }

  var firebaseConfig = {
    apiKey: "AIzaSyDurMtOnC6ghLYFIRBteHL348i-D983oRk",
    authDomain: "opcluyenthivatli.firebaseapp.com",

    messagingSenderId: "90488773349",
    appId: "1:90488773349:web:4bd83994c72afe12dc920c",
    measurementId: "G-T3W59KBK01"
  };

  // ============================================================
  // 2) Danh sách email được phép đăng nhập admin. Đây chỉ là lớp tiện

  var ADMIN_EMAILS = ["vovanthai2018tv@gmail.com", "chinhphucvatliphothong@gmail.com"];

  var CONFIG_READY = !!(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("DÁN_") !== 0);

  var OPC = { ADMIN_EMAILS: ADMIN_EMAILS, configReady: CONFIG_READY, sdkError: null };

  if(CONFIG_READY){
   try{
    var appMod = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js");
    var authMod = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
    var fsMod = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");
    var stMod = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js");

    var initializeApp = appMod.initializeApp;
    var getAuth = authMod.getAuth, GoogleAuthProvider = authMod.GoogleAuthProvider,
        signInWithPopup = authMod.signInWithPopup, signOut = authMod.signOut,
        onAuthStateChanged = authMod.onAuthStateChanged;
    var getFirestore = fsMod.getFirestore, collection = fsMod.collection, doc = fsMod.doc,
        addDoc = fsMod.addDoc, setDoc = fsMod.setDoc, updateDoc = fsMod.updateDoc,
        deleteDoc = fsMod.deleteDoc, onSnapshot = fsMod.onSnapshot, query = fsMod.query,
        orderBy = fsMod.orderBy, serverTimestamp = fsMod.serverTimestamp, getDocs = fsMod.getDocs,
        limit = fsMod.limit, deleteField = fsMod.deleteField, getDoc = fsMod.getDoc;
    var getStorage = stMod.getStorage, ref = stMod.ref, uploadBytesResumable = stMod.uploadBytesResumable,
        getDownloadURL = stMod.getDownloadURL, deleteObject = stMod.deleteObject;

    // SỬA 2/10/2026 — TÁCH PHIÊN ĐĂNG NHẬP CỦA ADMIN KHỎI HỌC SINH: Firebase Auth lưu
    // phiên theo (apiKey + tên app) trong IndexedDB và ĐỒNG BỘ GIỮA CÁC TAB cùng
    // trình duyệt. Trước đây trang này dùng app mặc định, nên khi có em học sinh
    // đang đăng nhập (index.html) ở tab khác, đoạn onAuthStateChanged bên dưới
    // thấy "không phải admin" và gọi signOut -> em bị đăng xuất âm thầm, ghi bài
    // bị permission-denied. Đặt tên app riêng 'opc-admin' để hai phiên không đụng nhau.
    var app = initializeApp(firebaseConfig, 'opc-admin');
    var auth = getAuth(app);
    var db = getFirestore(app);
    var storage = getStorage(app);

    OPC.onAuthStateChanged = function(cb){ return onAuthStateChanged(auth, cb); };
    OPC.signInGoogle = function(){ return signInWithPopup(auth, new GoogleAuthProvider()); };
    OPC.signOutUser = function(){ return signOut(auth); };

    // Ghi/đồng bộ ánh xạ "usernames/{username} -> {studentId}" để trang học
    // sinh (index.html) tra được studentId từ username khi đăng nhập, mà
    // không cần mở quyền đọc (list) toàn bộ collection "students" cho công
    // khai (xem giải thích đầy đủ trong firestore.rules).
    function syncUsernameMapping(studentId, username){
      var uname = String(username || '').trim().toLowerCase();
      if(!uname) return Promise.resolve();
      return setDoc(doc(db, "usernames", uname), { studentId: studentId });
    }

    OPC.students = {
      subscribe: function(onNext, onErr){
        return onSnapshot(query(collection(db, "students"), orderBy("name")), onNext, onErr);
      },
      add: function(data){
        var ref = doc(collection(db, "students"));
        return setDoc(ref, data)
          .then(function(){ return syncUsernameMapping(ref.id, data.username); })
          .then(function(){ return ref; });
      },
      update: function(id, data){
        return updateDoc(doc(db, "students", id), data)
          .then(function(){ if(data && data.username) return syncUsernameMapping(id, data.username); });
      },
      remove: function(id){ return deleteDoc(doc(db, "students", id)); },
      // Quét lại toàn bộ học sinh hiện có và ghi lại ánh xạ đăng nhập cho
      // từng em — dùng khi mới bật tính năng này (học sinh đã thêm từ
      // trước chưa từng có ánh xạ), hoặc nghi ngờ ánh xạ bị lệch.
      syncAllLoginMappings: async function(){
        var snap = await getDocs(query(collection(db, "students"), orderBy("name")));
        var count = 0;
        for(var i = 0; i < snap.docs.length; i++){
          var d = snap.docs[i];
          var uname = (d.data() || {}).username;
          if(!uname) continue;
          await syncUsernameMapping(d.id, uname);
          count++;
        }
        return count;
      }
    };

    // Số liệu học tập THẬT của từng học sinh (mastery/điểm dự đoán/sổ câu
    // sai), do chính trang luyện tập (opc-live-data.js) tự ghi lại sau mỗi
    // lần nộp bài — xem match /student_stats/{id} trong firestore.rules.
    // Đọc TOÀN BỘ collection 1 lần (không phải N lần theo từng học sinh) để
    // trang "Giám sát thích ứng" hiển thị đúng số liệu thật, không còn hàng
    // demo giả lập khi chưa có dữ liệu.
    OPC.studentStats = {
      subscribe: function(onNext, onErr){
        return onSnapshot(collection(db, "student_stats"), onNext, onErr);
      },
      // THÊM 1/10/2026 — thầy bấm "Đã hỗ trợ" để gỡ 1 mục "cần thầy hỗ trợ"
      // (học sinh luyện tương tự 3 lượt vẫn chưa đạt — xem prepscholar-ui.js).
      clearHelp: function(studentId, key){
        var upd = {}; upd['helpNeeded.' + key] = deleteField();
        return updateDoc(doc(db, 'student_stats', studentId), upd);
      }
    };

    // SỬA 30/9/2026: đổi thành "nhà máy" makeExamBankApi(COL) để dùng CHUNG
    // toàn bộ quy trình nạp/sửa/xoá đề cho 3 ngân hàng TÁCH BIỆT:
    //   de_thi          — Luyện thi Vật lí 12 (như cũ)
    //   de_thi_hsg      — Đề HSG cấp tỉnh/thành phố
    //   de_thi_olympic  — Đề đội tuyển Olympic
    // Mỗi ngân hàng là 1 collection riêng nên câu HSG/Olympic không bao giờ
    // lẫn vào luyện tập/thi thử Vật lí 12 (trang học sinh chỉ đọc "de_thi").
    function makeExamBankApi(COL){
      return {
        subscribe: function(onNext, onErr){
          return onSnapshot(query(collection(db, COL), orderBy("createdAt", "desc")), onNext, onErr);
        },
        newRef: function(){ return doc(collection(db, COL)); },
        save: function(refDoc, data){
          return setDoc(refDoc, Object.assign({}, data, { createdAt: serverTimestamp() }));
        },
        // Lưu toàn bộ dữ liệu đề thi, nội dung .tex gốc và ảnh minh họa trực tiếp vào Firestore
        // Tự động phân tách sang subcollection nếu dữ liệu ảnh lớn để không bao giờ chạm trần 1MB của Firestore
        saveExamDoc: async function(refDoc, examData){
          var images = examData.images || [];
          var docToSave = Object.assign({}, examData, {
            createdAt: serverTimestamp()
          });
  
          var payloadSize = JSON.stringify(docToSave).length;
          // Nếu toàn bộ dữ liệu < 650KB, lưu trực tiếp vào document cha cho tốc độ tức thì
          if(payloadSize < 650000){
            return setDoc(refDoc, docToSave);
          }
  
          // Nếu ảnh nhiều hoặc dung lượng lớn, lưu ảnh vào subcollection "images" của đề thi
          docToSave.images = images.map(function(im, idx){
            return {
              name: im.name,
              size: im.size,
              width: im.width,
              height: im.height,
              subdocId: 'img_' + idx
            };
          });
  
          await setDoc(refDoc, docToSave);
          for(var i = 0; i < images.length; i++){
            var subRef = doc(collection(db, COL, refDoc.id, 'images'), 'img_' + i);
            await setDoc(subRef, images[i]);
          }
        },
        // THÊM 4/10/2026 — đọc 1 đề theo id (kèm ảnh) cho màn "Xem lại bài làm" của học sinh. null nếu đề đã bị xoá.
        getExam: async function(examId){
          var snap = await getDoc(doc(db, COL, examId));
          if(!snap.exists()) return null;
          var data = snap.data() || {};
          var images = data.images || [];
          if(images.length && !(images[0].url || images[0].dataUrl)){
            try{
              var isnap = await getDocs(collection(db, COL, examId, 'images'));
              var map = {};
              isnap.forEach(function(d){ map[d.id] = d.data(); });
              images = images.map(function(im, idx){ var full = map['img_' + idx] || map[im.subdocId]; return full ? Object.assign({}, im, full) : im; });
            }catch(e){ console.warn('Lỗi tải ảnh của đề:', e); }
          }
          return Object.assign({ id: examId }, data, { images: images });
        },
        loadExamImages: async function(examId, imagesMeta){
          if(!imagesMeta || !imagesMeta.length) return [];
          if(imagesMeta[0] && imagesMeta[0].url) return imagesMeta;
          try{
            var snap = await getDocs(collection(db, COL, examId, 'images'));
            var map = {};
            snap.forEach(function(d){ map[d.id] = d.data(); });
            return imagesMeta.map(function(im, idx){
              var full = map['img_' + idx] || map[im.subdocId];
              return full ? Object.assign({}, im, full) : im;
            });
          }catch(e){
            console.warn('Lỗi load subcollection images:', e);
            return imagesMeta;
          }
        },
        remove: async function(id){
          try{
            var snap = await getDocs(collection(db, COL, id, 'images')).catch(function(){ return {docs:[]}; });
            if(snap && snap.docs){
              for(var i = 0; i < snap.docs.length; i++){
                await deleteDoc(snap.docs[i].ref).catch(function(){});
              }
            }
          }catch(e){}
          return deleteDoc(doc(db, COL, id));
        },
        // Cập nhật lại mảng câu hỏi của 1 đề (VD sau khi thầy sửa đáp án đúng của
        // 1 câu vì phát hiện sai sót trong file gốc) — không đụng tới các trường
        // khác của đề (tex gốc, hình ảnh, thống kê...).
        updateQuestions: function(examId, questions){
          return updateDoc(doc(db, COL, examId), { questions: questions });
        },
        // THÊM 1/10/2026 — Video chữa đề: ghi { url, videoId, marks, updatedAt }
        // (hoặc null để gỡ) vào chính doc đề. Chỉ đụng đúng trường này.
        updateVideoWalkthrough: function(examId, vw){
          return updateDoc(doc(db, COL, examId), { videoWalkthrough: vw });
        },
        uploadFile: function(examId, file, kind, onProgress){
          return new Promise(function(resolve, reject){
            try{
              var safeName = file.name.replace(/[^\w.\-]+/g, "_");
              var path = "de-thi/" + examId + "/" + kind + "-" + Date.now() + "-" + safeName;
              var storageRef = ref(storage, path);
              var task = uploadBytesResumable(storageRef, file);
              var settled = false;
              var TIMEOUT_MS = 6000;
              var timer = setTimeout(function(){
                if(settled) return;
                settled = true;
                try{ task.cancel(); }catch(e){}
                // Không block mà trả về thông tin file cục bộ
                resolve({ url: '', path: path, name: file.name, size: file.size, localOnly: true });
              }, TIMEOUT_MS);
              task.on("state_changed", function(snap){
                if(settled) return;
                if(onProgress && snap.totalBytes) onProgress(snap.bytesTransferred / snap.totalBytes);
              }, function(err){
                if(settled) return;
                settled = true;
                clearTimeout(timer);
                resolve({ url: '', path: path, name: file.name, size: file.size, localOnly: true });
              }, function(){
                if(settled) return;
                settled = true;
                clearTimeout(timer);
                getDownloadURL(task.snapshot.ref).then(function(url){
                  resolve({ url: url, path: path, name: file.name, size: file.size });
                }).catch(function(){
                  resolve({ url: '', path: path, name: file.name, size: file.size, localOnly: true });
                });
              });
            }catch(e){
              resolve({ url: '', path: '', name: file.name, size: file.size, localOnly: true });
            }
          });
        },
        deleteStorageFile: function(path){
          if(!path) return Promise.resolve();
          try{ return deleteObject(ref(storage, path)).catch(function(){}); }catch(e){ return Promise.resolve(); }
        }
      };
    }
    OPC.examBank = makeExamBankApi('de_thi');
    OPC.hsgBank = makeExamBankApi('de_thi_hsg');
    OPC.olympicBank = makeExamBankApi('de_thi_olympic');

    // ================= Đề cá nhân hóa ĐÃ GIAO cho học sinh =================
    // Lưu dưới subcollection students/{studentId}/assignedExams — khi thầy
    // bấm "Giao đề cho học sinh" trong PersonalizedExamGeneratorPanel, đề
    // vừa tạo (đã CHUYỂN sang đúng hình dạng câu hỏi mà trang luyện tập học
    // sinh dùng — xem toStudentQuestionShape) được ghi vào đây để trang học
    // sinh (prepscholar-ui.js) đọc và cho làm bài trực tiếp trên web, không
    // cần tải file .tex về nữa. Ghi chú bảo mật: CHỈ admin được ghi (đúng ý
    // nghĩa thật — chỉ giáo viên mới giao đề), khác với "attempts"/
    // "student_stats" (học sinh tự ghi, không có Auth thật nên phải mở công
    // khai) — xem match /students/{id}/assignedExams/{id} trong firestore.rules.
    OPC.assignedExams = {
      subscribeForStudent: function(studentId, onNext, onErr){
        return onSnapshot(query(collection(db, 'students', studentId, 'assignedExams'), orderBy('createdAt', 'desc')), onNext, onErr);
      },
      // THÊM 26/9/2026: đếm số đề đã giao trước đó cho học sinh này, để đánh
      // số thứ tự "Đề số N" (seq) khi giao đề mới — xem handleAssignToStudent
      // trong PersonalizedExamGeneratorPanel. Đọc 1 lần (không subscribe) vì
      // chỉ cần đúng lúc bấm "Giao đề cho học sinh".
      countForStudent: async function(studentId){
        var snap = await getDocs(collection(db, 'students', studentId, 'assignedExams'));
        return snap.size;
      },
      save: async function(studentId, examData){
        var refDoc = doc(collection(db, 'students', studentId, 'assignedExams'));
        await setDoc(refDoc, Object.assign({}, examData, { createdAt: serverTimestamp() }));
        return refDoc;
      }
    };

    // ================= Lịch sử làm bài (attempts) — ĐỌC cho trang admin =====
    // THÊM 24/9/2026: trước đây admin.html chỉ đọc số liệu TỔNG HỢP qua
    // "student_stats" (xem OPC.studentStats bên dưới), không đọc trực tiếp
    // subcollection "attempts" của từng học sinh. Nay cần thêm để hiển thị
    // "Lịch sử làm bài" + biểu đồ điểm số + trạng thái từng đề được giao
    // trong hồ sơ 1 học sinh cụ thể (StudentsPanel) — chỉ đọc khi mở hồ sơ
    // học sinh đó (subscribeForStudent), KHÔNG đọc toàn lớp cùng lúc để
    // tránh tốn đọc Firestore không cần thiết. Đọc công khai, giống
    // "attempts" bên students/{id}/attempts trong firestore.rules.
    OPC.attempts = {
      subscribeForStudent: function(studentId, onNext, onErr){
        return onSnapshot(query(
          collection(db, 'students', studentId, 'attempts'),
          orderBy('createdAt', 'desc'),
          // SỬA 25/9/2026: 50 -> 100, khớp đúng mặc định loadAttempts(studentId,
          // max) bên opc-live-data.js (limit(max || 100)) mà app học sinh dùng.
          // Trước đây admin chỉ đọc 50 lượt gần nhất trong khi học sinh luyện
          // nhiều có thể đã tính Sổ tay câu sai/mastery từ tới 100 lượt — khiến
          // 2 bên hiển thị lệch nhau cho học sinh luyện tập nhiều.
          limit(100)
        ), onNext, onErr);
      },
      // THÊM 29/9/2026 — đọc 1 lần (không subscribe) 100 lượt gần nhất của 1
      // học sinh: dùng khi Giao Drill thích ứng (tránh câu em vừa làm đúng,
      // ưu tiên câu em làm sai) và khi soạn báo cáo phụ huynh (số bài/điểm
      // TRONG 7 NGÀY QUA, không phải số liệu cộng dồn từ đầu).
      loadForStudent: async function(studentId){
        var snap = await getDocs(query(collection(db, 'students', studentId, 'attempts'), orderBy('createdAt', 'desc'), limit(100)));
        return snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data() || {}); });
      }
    };

    // ================= Đăng ký lớp thử nghiệm — hàng chờ duyệt =============
    // THÊM 24/9/2026 — xem submitRegistration trong opc-live-data.js (nơi
    // học sinh ghi) và firestore.rules (collection "registrations": create
    // công khai giới hạn trường, read/update chỉ admin). StudentsPanel đọc
    // toàn bộ 1 lần (không nhiều, chỉ vài chục bản ghi đang chờ) rồi lọc
    // status ngay trên client, giống cách studentStats/assignedExams đang làm.
    OPC.registrations = {
      subscribe: function(onNext, onErr){
        return onSnapshot(query(collection(db, 'registrations'), orderBy('createdAt', 'desc')), onNext, onErr);
      },
      setStatus: function(id, patch){
        return updateDoc(doc(db, 'registrations', id), patch);
      }
    };

    // ================= Báo cáo phụ huynh (draft AI + đã gửi) =================
    // THÊM 24/9/2026 — subcollection students/{id}/parentReports, admin-only
    // (xem firestore.rules). save() dùng cho cả tạo mới (draft) lẫn cập nhật
    // (sửa tay/đánh dấu đã gửi) — luôn truyền đủ object, đơn giản hơn phân
    // biệt create/update vì panel chỉ có 1 bản nháp "đang mở" tại 1 thời điểm.
    OPC.parentReports = {
      subscribeForStudent: function(studentId, onNext, onErr){
        return onSnapshot(query(
          collection(db, 'students', studentId, 'parentReports'),
          orderBy('createdAt', 'desc'),
          limit(20)
        ), onNext, onErr);
      },
      save: function(studentId, reportId, data){
        var ref = reportId ? doc(db, 'students', studentId, 'parentReports', reportId) : doc(collection(db, 'students', studentId, 'parentReports'));
        return setDoc(ref, data, { merge: true }).then(function(){ return ref; });
      }
    };

    // ================= Mẫu tin nhắn Zalo báo cáo phụ huynh ==================
    // THÊM 29/9/2026 — doc đơn "settings/parent_report_template" { header,
    // footer }: phần mở đầu/kết thư cố định thầy soạn 1 lần, ghép quanh nội

      subscribe: function(onNext, onErr){

      },
      save: function(data){

      }
    };

    // ================= Gói dịch vụ (giá/tính năng/ẩn-hiện trang chủ) =======
    // THÊM 24/9/2026 — doc đơn "settings/pricing" (đọc công khai, ghi chỉ

    OPC.pricing = {
      subscribe: function(onNext, onErr){
        return onSnapshot(doc(db, 'settings', 'pricing'), function(snap){
          onNext(snap.exists() ? snap.data() : null);
        }, onErr);
      },
      save: function(data){
        return setDoc(doc(db, 'settings', 'pricing'), Object.assign({}, data, { updatedAt: serverTimestamp() }));

    // ================= Ưu đãi giới thiệu (settings/referral) ===================
    // THÊM 2/10/2026 — doc đơn { discountVnd, commissionVnd } (đọc công khai để trang
    // đăng ký hiện đúng mức giảm; ghi chỉ admin — xem firestore.rules "settings").
    //  - discountVnd: giảm học phí cho học sinh MỚI nhập mã giới thiệu hợp lệ.
    //  - commissionVnd: cộng vào "số dư hoa hồng" của NGƯỜI GIỚI THIỆU.
    OPC.referral = {
      subscribe: function(onNext, onErr){
        return onSnapshot(doc(db, 'settings', 'referral'), function(snap){
          onNext(snap.exists() ? snap.data() : null);

      },

    // THÊM 5/10/2026 — doc { items:[{id, baiKey, name}] }. Đọc công khai (trang học sinh cũng đọc), chỉ admin ghi.
    // Mục trùng id với nano có sẵn = đổi tên. Xem OPC_NANO.setExtra trong nano-map.js.
    OPC.nanoExtra = {
      subscribe: function(onNext, onErr){
        return onSnapshot(doc(db, 'settings', 'nanoExtra'), function(snap){
          onNext(snap.exists() ? snap.data() : null);
        }, onErr);
      },

    // khoá "khi-2.3" làm tên trường) để tránh rắc rối dấu chấm trong tên trường Firestore.
    OPC.nanoPrereq = {
      subscribe: function(onNext, onErr){
        return onSnapshot(doc(db, 'settings', 'nanoPrereq'), function(snap){
          onNext(snap.exists() ? snap.data() : null);

      },
      save: function(edits){

    // ================= Khoá/mở chương theo học sinh ============================
    // THÊM 28/9/2026 — doc đơn "settings/curriculum" { defaultUnlockedChapters }

    OPC.curriculum = {
      subscribe: function(onNext, onErr){
        return onSnapshot(doc(db, 'settings', 'curriculum'), function(snap){
          onNext(snap.exists() ? snap.data() : null);
        }, onErr);
      },
      saveDefault: function(chapters){
        return setDoc(doc(db, 'settings', 'curriculum'), { defaultUnlockedChapters: chapters, updatedAt: serverTimestamp() }, { merge: true });
      },
      setStudentChapters: function(studentId, chapters){
        return updateDoc(doc(db, 'students', studentId), { unlockedChapters: chapters });
      },
      // Bỏ danh sách riêng -> em đó quay về theo mặc định của lớp.
      resetStudentChapters: function(studentId){
        return updateDoc(doc(db, 'students', studentId), { unlockedChapters: deleteField() });
      }
    };
   }catch(err){
    OPC.configReady = false;
    OPC.sdkError = (err && err.message) ? err.message : String(err);
   }
  }

  window.OPC = OPC;
  window.OPCReady = Promise.resolve(OPC);
})();
</script>

<script>
(function(){
  if(!window.React || !window.ReactDOM){ return; }

    return (parts[parts.length-1] || '?').charAt(0).toUpperCase();
  }
  function fmtVND(n){ return (n||0).toLocaleString('vi-VN') + ' đ'; }
  // THÊM 2/10/2026 — mã giới thiệu: chuẩn hoá để so khớp (bỏ dấu, khoảng trắng, in hoa; mã cũ có thể
  // mang dấu như "TÚ123VLY") và sinh mã mới KHÔNG dấu để học sinh gõ được trên điện thoại.
  function normCode(v){

      .toUpperCase().replace(/[^A-Z0-9_-]/g, '');
  }
  function digitsOnly(v){ return String(v || '').replace(/\D/g, ''); }

  // THÊM 6/10/2026 — HÀNG NHẮC HỌC: học sinh đang học nhưng đã ≥ N ngày chưa làm bài -> kèm tin Zalo soạn sẵn cho phụ huynh.
  // "Lần hoạt động gần nhất" = thời điểm số liệu học tập (student_stats.updatedAt) được đồng bộ gần nhất — cập nhật mỗi
  // lần em nộp bài (hoặc bấm "Lưu lại" khi lỗi lưu), nên sát với lần làm bài cuối. Em chưa có số liệu mà đã có đề
  // làm (completedExamsCount > 0) thì BỎ QUA (không biết chắc) thay vì nhắc nhầm.

  // ============================================================================
  // THÊM 7/10/2026 — PHÒNG DẠY ONLINE (tab "🎓 Phòng dạy"): dạy nhóm nhỏ qua Google Meet + iPad.
  // Em làm bài ở máy mình (luyện thích ứng ⚡ 5 câu); trang này nghe trực tiếp lịch sử làm bài của các em được chọn
  // (nhờ mỗi câu chấm xong đều lưu bản "làm dở" — xem saveAdaptiveProgress trong prepscholar-ui.js) để thầy thấy: em nào đang ở
  // câu mấy, đúng/sai bao nhiêu, và gom CÂU SAI của cả nhóm thành hàng đợi để giảng từng câu, viết bút lên đề (InkBoard).
  // Chỉ ĐỌC dữ liệu — không ghi gì lên Firestore; lựa chọn của thầy (nhóm em, link Meet, giờ bắt đầu buổi) lưu trên chính máy này.
  // ============================================================================
  var ROOM_ACTIVE_MIN = 10;          // còn "Đang làm" nếu có hoạt động trong 10 phút gần nhất
  function attemptTimeMs(a){
    var t = a && (a.updatedAt || a.createdAt);
    var ms = t ? new Date(t).getTime() : NaN;
    return ms;
  }
  function startOfTodayMs(now){ var d = new Date(now); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  // Tóm tắt 1 em trong buổi dạy: các lượt có hoạt động từ sinceMs trở đi.
  function summarizeStudentRoom(attempts, sinceMs, nowMs){
    var inRoom = (attempts || []).filter(function(a){ var t = attemptTimeMs(a); return !isNaN(t) && t >= sinceMs; });
    if(!inRoom.length) return { status: 'idle', latest: null, attemptCount: 0, right: 0, wrong: 0, answered: 0, target: null, minutesAgo: null };
    var latest = inRoom.reduce(function(m, a){ return attemptTimeMs(a) > attemptTimeMs(m) ? a : m; });
    var right = (latest.rightQuestions || []).length, wrong = (latest.wrongQuestions || []).length;
    var minutesAgo = Math.max(0, Math.round((nowMs - attemptTimeMs(latest)) / 60000));
    var status = latest.partial ? (minutesAgo <= ROOM_ACTIVE_MIN ? 'doing' : 'paused') : 'done';
    return { status: status, latest: latest, attemptCount: inRoom.length, right: right, wrong: wrong,
             answered: latest.totalQuestions != null ? latest.totalQuestions : right + wrong,
             target: latest.targetCount || null, minutesAgo: minutesAgo };
  }
  // Hàng đợi câu sai của cả nhóm trong buổi: mỗi (em, câu) một dòng, theo thứ tự thời gian làm, không trùng.
  function collectRoomWrongQueue(attemptsByStudent, studentsById, sinceMs){
    var items = [], seen = {};
    Object.keys(attemptsByStudent || {}).forEach(function(sid){
      (attemptsByStudent[sid] || []).forEach(function(a){
        var t = attemptTimeMs(a);
        if(isNaN(t) || t < sinceMs) return;
        (a.wrongQuestions || []).forEach(function(w){
          if(!w || !w.qId) return;
          var key = sid + '|' + w.qId;
          if(seen[key]) return; seen[key] = true;
          items.push({ key: key, studentId: sid, studentName: (studentsById[sid] && studentsById[sid].name) || sid, attemptId: a.id,
                       qId: w.qId, nanoIds: (w.nanoIds && w.nanoIds.length) ? w.nanoIds : (w.nanoId ? [w.nanoId] : []), level: w.level || '', at: t });
        });
      });
    });
    items.sort(function(x, y){ return x.at - y.at; });
    return items;
  }

  var INACTIVE_DAYS = 3;
  function daysBetween(iso, now){
    var d = iso ? new Date(iso) : null;
    if(!d || isNaN(d.getTime())) return null;
    var a = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var b = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    return Math.max(0, Math.round((b - a) / 86400000));
  }
  function classifyInactive(students, now, minDays){
    now = now || new Date(); minDays = minDays || INACTIVE_DAYS;
    var out = [];
    (students || []).forEach(function(s){
      if(!s || s.status !== 'active') return;
      var days = daysBetween(s.lastActiveAt, now);
      if(days == null){
        if(!(Number(s.completedExamsCount) > 0)) out.push({ student: s, daysAgo: null, never: true });
        return;
      }
      if(days >= minDays) out.push({ student: s, daysAgo: days, never: false });
    });
    out.sort(function(a, b){ return (b.never ? 9999 : b.daysAgo) - (a.never ? 9999 : a.daysAgo); });
    return out;
  }
  function buildReminderMessage(item){
    var s = item.student, name = (s.name || 'em').trim();
    var link = 'https://faradayai.vn';
    if(item.never){
      return 'Chào anh/chị ạ. Em ' + name + ' chưa làm bài nào trên FaradayAI. Mỗi ngày em chỉ cần khoảng 15 phút: vào ' + link +
        ' → làm "Bài kiểm tra đầu vào" trước để hệ thống biết em đang vững/yếu chỗ nào ạ. Nhờ anh/chị nhắc em giúp. Cảm ơn anh/chị!';
    }
    var when = item.daysAgo >= 7 ? ('hơn ' + Math.floor(item.daysAgo / 7) + ' tuần') : (item.daysAgo + ' ngày');
    return 'Chào anh/chị ạ. Em ' + name + ' đã ' + when + ' chưa làm bài trên FaradayAI. Hôm nay em chỉ cần khoảng 15 phút: vào ' + link +
      ' → mục "Nhiệm vụ hôm nay" là xong ạ (ôn câu sai + vá lỗi + 5 câu luyện thích ứng). Nhờ anh/chị nhắc em giúp. Cảm ơn anh/chị!';
  }

  // THÊM 5/10/2026 — gợi ý nhanh nano-point cho 1 câu bằng bộ khớp từ khoá của nano-map.js (không gọi AI, tức thì).
  // Đọc đề + ngữ cảnh chùm + phương án + lời giải (lời giải thường nêu thẳng công thức/định luật đã dùng).
  function quickNanoSuggest(q){

    var text = [q.groupPassage || '', q.stem || '', (q.options || []).map(function(o){ return o && o.text ? o.text : ''; }).join(' '), q.loigiai || ''].join(' ');
    var r = window.OPC_NANO.suggestNanos(text, { dangBai: q.dangBai, max: 3 });
    return { ids: r.map(function(x){ return x.id; }), confidence: r.length ? r[0].confidence : 'thấp', all: r };
  }

  // THÊM 5/10/2026 — ĐỒNG BỘ NANO-POINT DO THẦY TỰ THÊM (settings/nanoExtra) vào OPC_NANO cho toàn trang admin.
  // Chỉ đăng ký 1 lần; mỗi lần Firestore đổi (kể cả khi thầy vừa bấm Lưu) gọi OPC_NANO.setExtra rồi báo các
  // component đang dùng hook render lại để tên nano-point mới hiện ngay.
  var nanoExtraStore = { started: false, listeners: [], loaded: false };
  function startNanoExtraSync(){
    if(nanoExtraStore.started) return;
    var OPCref = window.OPC;
    if(!OPCref || !OPCref.nanoExtra || !window.OPC_NANO) return;

    OPCref.nanoExtra.subscribe(function(data){
      window.OPC_NANO.setExtra((data && data.items) || []);
      nanoExtraStore.loaded = true; notify();
    }, function(err){ console.warn('Lỗi đồng bộ nano-point mở rộng:', err); nanoExtraStore.loaded = true; notify(); });
    // THÊM 6/10/2026 — quan hệ tiên quyết do thầy chỉnh
    if(OPCref.nanoPrereq){
      OPCref.nanoPrereq.subscribe(function(data){
        window.OPC_NANO.setPrereqEdits((data && data.edits) || []);
        notify();
      }, function(err){ console.warn('Lỗi đồng bộ quan hệ tiên quyết:', err); });
    }
  }
  function useNanoExtraSync(){
    var st = React.useState(0);

      startNanoExtraSync();
      var fn = function(){ st[1](function(v){ return v + 1; }); };
      nanoExtraStore.listeners.push(fn);
      return function(){ nanoExtraStore.listeners = nanoExtraStore.listeners.filter(function(x){ return x !== fn; }); };
    }, []);
    return st[0];
  }
  // Lưu danh sách nano-point thêm/đổi tên (ghi đè cả danh sách trên Firestore) — trả Promise
  function saveNanoExtraItems(items){

  }
  // Mở thẳng khung chat Zalo của 1 số điện thoại VN — zalo.me nhận cả dạng
  // 0xxxxxxxxx lẫn 84xxxxxxxxx, ở đây chuẩn hoá về 84xxxxxxxxx cho chắc.
  function zaloLink(phone){
    var n = String(phone || '').replace(/[\s.\-()]/g, '');
    if(n.indexOf('+84') === 0) n = '84' + n.slice(3);
    else if(n.indexOf('0') === 0) n = '84' + n.slice(1);

  }
  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);

    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

  }
  function fmtBytes(n){
    if(!n) return '0 B';
    var units = ['B','KB','MB','GB']; var i = 0; var v = n;
    while(v >= 1024 && i < units.length-1){ v /= 1024; i++; }

  }
  function fmtDate(ts){

    var d = ts.toDate ? ts.toDate() : new Date(ts);

  // ================= Xuất PDF đề cá nhân hóa đã giao — THÊM 26/9/2026 ======
  // Mở 1 tab mới thân thiện với việc in (Ctrl+P → "Lưu dưới dạng PDF"), hiện
  // đúng nội dung đề đã giao cho học sinh (students/{id}/assignedExams/{id},

  // KHÔNG dùng thư viện PDF nào (jsPDF/html2pdf...) — chỉ cần window.print(),

  function escapeHtmlPDF(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });

  // Bản JS thuần (không React) của tokenizeLatexRuns — copy logic y hệt bản

  var LATEX_TAG_MAP_PDF = {
    textbf: 'b', bf: 'b', bold: 'b',
    textit: 'i', it: 'i', emph: 'i',
    underline: 'u', uline: 'u',
    text: 'span', mathrm: 'span', mbox: 'span', textrm: 'span', textnormal: 'span'

    includegraphics: 1

  // SỬA 27/9/2026: xem chú thích LATEX_SYMBOL_CMDS trong prepscholar-ui.js —
  // giữ y hệt danh sách để 2 nơi không lệch cách hiển thị.
  var LATEX_SYMBOL_CMDS_PDF = {
    circ: '°', deg: '°',
    pm: '±', mp: '∓', times: '×', div: '÷', cdot: '·',
    infty: '∞', approx: '≈', neq: '≠', leq: '≤', geq: '≥',
    rightarrow: '→', to: '→', leftarrow: '←', ldots: '…', cdots: '⋯',
    Omega: 'Ω', omega: 'ω', Delta: 'Δ', delta: 'δ', alpha: 'α', beta: 'β',

  // Xem chú thích đầy đủ ở splitLatexTableCells trong prepscholar-ui.js.
  function splitLatexTableCellsPDF(rowStr){
    var PLACEHOLDER = '\u0000AMP\u0000';
    return rowStr.split('\\&').join(PLACEHOLDER).split('&').map(function(cell){
      return cell.split(PLACEHOLDER).join('\\&');
    });
  }
  function tokenizeLatexRunsPDF(str){
    var i = 0, len = str.length;
    function parseNodes(stopAtBrace){
      var nodes = []; var buf = '';
      function flush(){ if(buf){ nodes.push({ type: 'text', value: buf }); buf = ''; } }
      while(i < len){
        var c = str[i];
        if(stopAtBrace && c === '}'){ i++; break; }
        // "{,}"/"{.}" — dấu thập phân viết an toàn ngoài chế độ toán (xem
        // chú thích đầy đủ trong tokenizeLatexRuns của prepscholar-ui.js).
        if(c === '{' && (str[i+1] === ',' || str[i+1] === '.') && str[i+2] === '}'){
          buf += str[i+1]; i += 3; continue;
        }
        if(c === '\\'){
          var next = str[i + 1];
          if(next === '\\'){ flush(); nodes.push({ type: 'br' }); i += 2; continue; }
          if(next && '%&_$#{}~'.indexOf(next) !== -1){ buf += (next === '~' ? ' ' : next); i += 2; continue; }
          // \, \; \: \! — lệnh chèn khoảng trắng, không phải chữ cái nên
          // regex lệnh bên dưới không khớp được.
          if(next && ',;:!'.indexOf(next) !== -1){ buf += ' '; i += 2; continue; }
          var m = /^\\([a-zA-Z]+)\*?/.exec(str.slice(i));
          if(m){
            var cmdName = m[1];
            var j = i + m[0].length;
            while(str[j] === ' ') j++;
            if(str[j] === '['){
              var depth = 1; j++;
              while(j < len && depth > 0){ if(str[j] === '[') depth++; else if(str[j] === ']') depth--; j++; }
              while(str[j] === ' ') j++;
            }
            if(cmdName === 'begin' || cmdName === 'end'){
              // SỬA 27/9/2026: xem chú thích đầy đủ ở tokenizeLatexRuns trong
              // prepscholar-ui.js — \begin{tabular}{colspec}...\end{tabular}
              // nay dựng thành bảng HTML có viền thay vì in chữ thô "&"/"\\".
              var envNameStart = -1, envName = '';
              if(str[j] === '{'){
                envNameStart = j + 1;
                var d = 1; j++;
                while(j < len && d > 0){ if(str[j] === '{') d++; else if(str[j] === '}') d--; j++; }
                envName = str.slice(envNameStart, j - 1).trim();
              }
              // THÊM 2/10/2026 — hình TikZ trong đề in/xuất PDF: xem tikzpicture ở tokenizeLatexRuns (prepscholar-ui.js).
              if(cmdName === 'begin' && envName === 'tikzpicture'){
                var endTagT = '\\end{tikzpicture}';
                var endIdxT = str.indexOf(endTagT, j);
                flush();
                nodes.push({ type: 'tikz', code: endIdxT > -1 ? str.slice(j, endIdxT) : str.slice(j) });
                i = endIdxT > -1 ? endIdxT + endTagT.length : len;
                continue;
              }
              if(cmdName === 'begin' && envName === 'tabular'){
                while(str[j] === ' ') j++;
                if(str[j] === '{'){
                  var d2 = 1; j++;
                  while(j < len && d2 > 0){ if(str[j] === '{') d2++; else if(str[j] === '}') d2--; j++; }
                }
                var endTag = '\\end{tabular}';
                var endIdx = str.indexOf(endTag, j);
                var tableBody = (endIdx > -1 ? str.slice(j, endIdx) : str.slice(j)).replace(/\\hline/g, '');
                var tableRows = tableBody.split('\\\\').map(function(rowStr){
                  return splitLatexTableCellsPDF(rowStr).map(function(cellStr){
                    return tokenizeLatexRunsPDF(cellStr.trim());
                  });
                }).filter(function(cells){
                  return cells.some(function(cellNodes){
                    return cellNodes.some(function(n){ return (n.type === 'text' && n.value.trim()) || n.type === 'math' || n.type === 'cmd'; });
                  });
                });
                flush();
                nodes.push({ type: 'table', rows: tableRows });
                i = endIdx > -1 ? endIdx + endTag.length : len;
                continue;
              }
              flush(); i = j; continue;
            }
            if(str[j] === '{'){
              flush(); i = j + 1;
              var children = parseNodes(true);
              if(!LATEX_DROP_CMDS_PDF[cmdName]) nodes.push({ type: 'cmd', name: cmdName, children: children });
              continue;
            }
            if(LATEX_SYMBOL_CMDS_PDF[cmdName] !== undefined){
              buf += LATEX_SYMBOL_CMDS_PDF[cmdName];
              i = j;
              continue;
            }
            flush(); i = j; continue;
          }
          buf += '\\'; i++; continue;
        }
        if(c === '$'){
          flush();
          var end = str.indexOf('$', i + 1);
          if(end === -1){ buf += c; i++; continue; }
          nodes.push({ type: 'math', value: str.slice(i + 1, end) });
          i = end + 1;
          continue;
        }
        // "^" ngoài $...$ không có nghĩa gì (chỉ là thói quen viết "^\circ"
        // thay cho "độ" ngoài chế độ toán) — bỏ qua, không in ra.
        if(c === '^'){ i++; continue; }
        buf += c; i++;
      }
      flush();
      return nodes;
    }
    return parseNodes(false);
  }
  // nodes -> chuỗi HTML thuần (không phải React) — dùng ngay trong tab in,
  // nơi KaTeX được nạp qua thẻ <script src> thông thường (window.katex).
  function latexNodesToHtmlPDF(nodes){
    return nodes.map(function(node){
      if(node.type === 'text') return escapeHtmlPDF(node.value);
      if(node.type === 'br') return '<br>';
      if(node.type === 'math'){
        try{
          return window.katex ? window.katex.renderToString(node.value, { throwOnError: false }) : ('$' + escapeHtmlPDF(node.value) + '$');
        }catch(e){ return '$' + escapeHtmlPDF(node.value) + '$'; }
      }
      if(node.type === 'cmd'){
        var tag = LATEX_TAG_MAP_PDF[node.name] || 'span';
        return '<' + tag + '>' + latexNodesToHtmlPDF(node.children) + '</' + tag + '>';
      }
      if(node.type === 'tikz'){
        var svgPdf = window.OPC_TIKZ ? window.OPC_TIKZ.render(node.code) : null;
        return svgPdf ? '<div style="text-align:center;margin:8px 0;color:#000;">' + svgPdf + '</div>'
          : '<div style="margin:8px 0;padding:8px;border:1px dashed #94a3b8;font-size:0.85em;color:#64748b;">[Hình vẽ chưa hiển thị được]</div>';
      }
      if(node.type === 'table'){
        var rowsHtml = node.rows.map(function(cells, rIdx){
          var cellsHtml = cells.map(function(cellNodes){
            return '<td style="border:1px solid #cbd5e1;padding:4px 10px;text-align:center;' + (rIdx === 0 ? 'font-weight:700;background:#f1f5f9;' : '') + '">' + latexNodesToHtmlPDF(cellNodes) + '</td>';
          }).join('');
          return '<tr>' + cellsHtml + '</tr>';
        }).join('');
        return '<table style="border-collapse:collapse;margin:4px 0;font-size:0.9em;">' + rowsHtml + '</table>';
      }
      return '';
    }).join('');
  }
  function latexToHtmlPDF(text){
    if(!text) return '';
    var src = String(text);
    // dọn phần \immini bóc dở quanh hình TikZ (xem cleanLatexSource trong prepscholar-ui.js)
    if(/\}\s*\{\s*\\begin\{tikzpicture\}/.test(src)){
      src = src.replace(/\}\s*\{\s*(\\begin\{tikzpicture\})/, '$1').replace(/(\\end\{tikzpicture\})\s*\}/, '$1');
    }
    src = src.replace(/\\(?:renewcommand|newcommand|setlength)\*?\s*\{[^}]*\}\s*(?:\[[^\]]*\]\s*)?\{[^}]*\}/g, '');
    return latexNodesToHtmlPDF(tokenizeLatexRunsPDF(src));
  }
  function pdfImagesHtml(images){

  function pdfQuestionHtml(q, idx){
    var partLabel = q.part === 'II' ? 'Phần II — Đúng/Sai' : (q.part === 'III' ? 'Phần III — Trả lời ngắn' : 'Phần I — Trắc nghiệm');

    out += '<div class="q-head"><span class="q-idx">Câu ' + (idx + 1) + '</span><span class="q-part">' + partLabel + '</span></div>';
    out += pdfGroupPassageHtml(q);
    out += '<div class="q-stem">' + latexToHtmlPDF(q.stem) + '</div>';
    out += pdfImagesHtml(q.images);
    if(q.part === 'II' && q.statements && q.statements.length){
      out += '<div class="q-statements">' + q.statements.map(function(st, sIdx){
        var letter = st.key || String.fromCharCode(97 + sIdx);
        return '<div class="q-statement"><b>' + letter + ')</b> ' + latexToHtmlPDF(st.text) +
          '<span class="ans-block ans-tf ' + (st.isTrue ? 'tf-true' : 'tf-false') + '"> — ' + (st.isTrue ? 'ĐÚNG' : 'SAI') + '</span></div>';
      }).join('') + '</div>';
    } else if(q.part === 'III'){
      out += '<div class="q-shortans-line">Trả lời: <span class="answer-blank">........................</span>' +
        '<span class="ans-block ans-inline"> (Đáp án: <b>' + escapeHtmlPDF(q.correctAnswer != null ? q.correctAnswer : '?') + (q.unit ? ' ' + escapeHtmlPDF(q.unit) : '') + '</b>)</span></div>';
    } else if(q.options && q.options.length){
      out += '<div class="q-opts">' + q.options.map(function(o){
        var isCorrect = o.key === q.correctKey;
        return '<div class="q-opt' + (isCorrect ? ' ans-block ans-correct-opt' : '') + '"><span class="q-opt-key">' + escapeHtmlPDF(o.key) + '.</span> ' + latexToHtmlPDF(o.text) + '</div>';
      }).join('') + '</div>';
    }
    if(q.loiGiai){
      out += '<div class="ans-block q-loigiai"><b>💡 Lời giải:</b> ' + latexToHtmlPDF(q.loiGiai) + '</div>';
    }
    out += '</div>';
    return out;
  }

  function parseCSV(text){
    if(!text) return [];
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var firstLine = text.split(/\r\n|\r|\n/)[0] || '';
    var commaCount = (firstLine.match(/,/g) || []).length;
    var semiCount = (firstLine.match(/;/g) || []).length;
    var tabCount = (firstLine.match(/\t/g) || []).length;
    var delimiter = ',';
    if(semiCount > commaCount && semiCount >= tabCount) delimiter = ';';
    else if(tabCount > commaCount && tabCount > semiCount) delimiter = '\t';

    var rows = [];
    var currentRow = [];
    var currentVal = '';
    var inQuotes = false;
    var len = text.length;

    for(var i = 0; i < len; i++){
      var char = text[i];
      var nextChar = i + 1 < len ? text[i + 1] : '';

      if(char === '"'){
        if(inQuotes && nextChar === '"'){
          currentVal += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if(char === delimiter && !inQuotes){
        currentRow.push(currentVal.trim());
        currentVal = '';
      } else if((char === '\r' || char === '\n') && !inQuotes){
        if(char === '\r' && nextChar === '\n') i++;
        currentRow.push(currentVal.trim());
        if(currentRow.some(function(cell){ return cell.length > 0; })){
          rows.push(currentRow);
        }
        currentRow = [];
        currentVal = '';
      } else {
        currentVal += char;
      }
    }
    if(currentVal.length > 0 || currentRow.length > 0){
      currentRow.push(currentVal.trim());
      if(currentRow.some(function(cell){ return cell.length > 0; })){
        rows.push(currentRow);
      }
    }
    return rows;
  }

  }

  function validateStudentRow(raw, existingEmails, currentBatchEmails){
    var errors = [];
    var warnings = [];

    var name = (raw.name || '').trim();
    var email = (raw.email || '').trim();

    if(!name){
      errors.push('Thiếu họ và tên');
    }
    if(!email){
      errors.push('Thiếu email');
    } else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      errors.push('Email không đúng định dạng');
    }

    var emailLower = email.toLowerCase();
    if(email && existingEmails && existingEmails.has(emailLower)){
      warnings.push('Email đã có trên hệ thống');
    }
    if(email && currentBatchEmails && currentBatchEmails.has(emailLower)){
      warnings.push('Trùng email với dòng khác trong file');
    }

    var targetNum = parseFloat(raw.targetScore);
    if(isNaN(targetNum) || targetNum < 1 || targetNum > 10){
      targetNum = 9.0;
    }

    var lastName = (name.split(/\s+/).pop() || 'HOCSINH').toUpperCase();
    var code = lastName + Math.floor(100 + Math.random() * 900) + 'VLY';

    var student = {
      name: name,
      username: (raw.username || '').trim() || (email ? email.split('@')[0] : 'user' + Math.floor(Math.random()*1000)),
      password: (raw.password || '').trim() || '123',
      email: email,
      phone: (raw.phone || '').trim(),
      school: (raw.school || '').trim() || 'Chưa cập nhật',
      completedExamsCount: 0,
      averageScore: 0,
      highestScore: 0,
      targetScore: Number(targetNum.toFixed(2)),
      status: 'active',
      parentName: (raw.parentName || '').trim() || 'Chưa cập nhật',
      parentPhone: (raw.parentPhone || '').trim(),
      parentEmail: (raw.parentEmail || '').trim(),
      referralCode: code,
      commissionBalance: 0
    };

    var status = 'valid';
    if(errors.length > 0) status = 'error';
    else if(warnings.length > 0) status = 'warning';

    return {
      raw: raw,
      student: student,
      status: status,
      errors: errors,
      warnings: warnings
    };
  }
