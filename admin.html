  function PrepScholarMonitoringPanel(props){
    var OPCref = window.OPC;
    var studentsState = React.useState([]); var students = studentsState[0], setStudents = studentsState[1];
    var statsState = React.useState({}); var statsById = statsState[0], setStatsById = statsState[1];
    var loadingState = React.useState(true); var loading = loadingState[0], setLoading = loadingState[1];
    var loadErrState = React.useState(null); var loadErr = loadErrState[0], setLoadErr = loadErrState[1];
    var drillModalState = React.useState(null); var drillModal = drillModalState[0], setDrillModal = drillModalState[1];
    // THÊM 29/9/2026 — dữ liệu để GIAO DRILL THẬT (bản trước chỉ hiện toast).
    var drillExamsState = React.useState([]); var drillExams = drillExamsState[0], setDrillExams = drillExamsState[1];
    var drillCurState = React.useState(null); var drillCur = drillCurState[0], setDrillCur = drillCurState[1];
    var drillPickState = React.useState(null); var drillPick = drillPickState[0], setDrillPick = drillPickState[1]; // số chương đang chọn trong modal
    var drillBusyState = React.useState(false); var drillBusy = drillBusyState[0], setDrillBusy = drillBusyState[1];
    React.useEffect(function(){
      if(!OPCref || !OPCref.examBank) return;
      var unsub = OPCref.examBank.subscribe(function(snap){
        setDrillExams(snap.docs.map(function(d){ return Object.assign({}, d.data() || {}, { id: d.id }); }));
      }, function(err){ console.error('Lỗi tải ngân hàng đề (Giao Drill):', err); });
      return function(){ unsub(); };
    }, []);
    React.useEffect(function(){
      if(!OPCref || !OPCref.curriculum) return;
      var unsub = OPCref.curriculum.subscribe(function(data){ setDrillCur(data); },
        function(err){ console.error('Lỗi tải settings/curriculum (Giao Drill):', err); });
      return function(){ unsub(); };
    }, []);

    React.useEffect(function(){
      if(!OPCref || !OPCref.students) return;
      var unsub = OPCref.students.subscribe(function(snap){
        var rows = snap.docs.map(function(d){ var data = d.data() || {}; return Object.assign({}, data, {id: d.id}); });
        setStudents(rows); setLoading(false);
      }, function(err){ console.error('Lỗi tải danh sách học sinh (Giám sát thích ứng):', err); setLoadErr(err); setLoading(false); });
      return function(){ unsub(); };
    }, []);

    // Số liệu học tập THẬT (mastery/điểm dự đoán/sổ câu sai) — do chính
    // trang luyện tập ghi vào collection "student_stats" sau mỗi lần nộp bài
    // (xem OPC_LIVE.saveStudentStats trong opc-live-data.js). Đọc riêng và
    // gộp vào theo id, KHÔNG còn hàng demo giả lập khi chưa có dữ liệu.
    React.useEffect(function(){
      if(!OPCref || !OPCref.studentStats) return;
      var unsub = OPCref.studentStats.subscribe(function(snap){
        var map = {};
        snap.docs.forEach(function(d){ map[d.id] = d.data() || {}; });
        setStatsById(map);
      }, function(err){ console.error('Lỗi tải số liệu học tập thật:', err); });
      return function(){ unsub(); };
    }, []);

    // Học sinh thật, gộp thêm số liệu thật nếu em đó đã từng luyện tập ít
    // nhất 1 lần (chưa luyện lần nào thì các trường mastery/predictedScore
    // vẫn để trống — calculateStudentKPIs() đã tự hiển thị "Chưa có dữ liệu"
    // / "Mới nhập học" cho trường hợp này, không có số giả nào cả).
    var displayStudents = students.map(function(s){
      var st = statsById[s.id];
      if(!st) return s;
      return Object.assign({}, s, {
        mastery: st.mastery || s.mastery,
        nanoMastery: st.nanoMastery || s.nanoMastery, // THÊM 29/9/2026 — ưu tiên câu thuộc nano-point em yếu khi Giao Drill
        helpNeeded: st.helpNeeded || null, // THÊM 1/10/2026 — dạng bài em cần thầy hỗ trợ
        predictedScore: st.predicted != null ? st.predicted : s.predictedScore,
        mistakeCount: st.mistakeCount != null ? st.mistakeCount : s.mistakeCount,
        mistakeTotal: st.mistakeTotal != null ? st.mistakeTotal : s.mistakeTotal,
        // completedExamsCount/averageScore/highestScore/assignedExams...:
        // THÊM 23/9/2026 để "Xuất CSV & KPI" ở panel này cũng xuất đúng số
        // liệu thật, đồng bộ với bảng "Danh sách học sinh" — xem
        // calculateStudentKPIs.
        completedExamsCount: st.completedExamsCount != null ? st.completedExamsCount : s.completedExamsCount,
        averageScore: st.averageScore != null ? st.averageScore : s.averageScore,
        highestScore: st.highestScore != null ? st.highestScore : s.highestScore,
        assignedExamsCount: st.assignedExamsCount != null ? st.assignedExamsCount : s.assignedExamsCount,
        assignedExamsCompletedCount: st.assignedExamsCompletedCount != null ? st.assignedExamsCompletedCount : s.assignedExamsCompletedCount
      });
    });

    function handleAssignDrill(stu){
      setDrillModal(stu);
      var opts = drillChapterOptions(stu);
      var firstTested = opts.filter(function(o){ return o.unlocked && o.val != null; })[0];
      var firstOpen = opts.filter(function(o){ return o.unlocked; })[0];
      setDrillPick(firstTested ? firstTested.num : (firstOpen ? firstOpen.num : null));
    }

    // Các chương SGK (1-4) cho modal Giao Drill: mastery THẬT (null = chưa làm)
    // + đang mở hay khoá với em đó. Sắp: chương mở có số liệu (yếu -> mạnh),
    // rồi chương mở chưa làm, cuối cùng chương khoá.
    function drillChapterOptions(stu){
      var CUR = window.OPC_CURRICULUM;
      var unlocked = CUR ? CUR.getUnlockedChapters(stu, drillCur) : [1, 2, 3, 4];
      var real = realMasteryTopics(stu);
      var opts = [1, 2, 3, 4].map(function(num){
        var t = KPI_TOPICS.filter(function(x){ return x.chuong === num; })[0];
        var r = real.filter(function(x){ return x.chuong === num; })[0];
        return { num: num, name: t.name, topicKey: t.key, val: r ? r.val : null, unlocked: unlocked.indexOf(num) > -1 };
      });
      function rank(o){ return !o.unlocked ? 2 : (o.val == null ? 1 : 0); }
      return opts.sort(function(a, b){ return rank(a) - rank(b) || (a.val || 0) - (b.val || 0); });
    }

    // Bốc câu cho Drill: đúng chương đã chọn, bỏ đề Sở/Trường (giao nguyên
    // vẹn), bỏ câu em đã làm ĐÚNG trong 14 ngày gần đây. Điểm ưu tiên: câu
    // em từng làm sai (+4), nano-point em yếu <65% (+3), nano-point em chưa
    // từng làm (+1), mức M2-M3 (+2), M1 (+1), M4 (0). Mỗi nano-point tối đa 2
    // câu để bài Drill phủ nhiều lỗ hổng, không dồn vào 1 dạng.
    function pickDrillQuestions(stu, chuong, count, attempts){
      var CUR = window.OPC_CURRICULUM;
      var nano = stu.nanoMastery || {};
      var now = Date.now();
      var recentRight = {}, everWrong = {};
      (attempts || []).forEach(function(a){
        var t = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt).getTime();
        (a.wrongQuestions || []).forEach(function(q){ everWrong[q.qId] = true; });
        if(!isNaN(t) && now - t < 14 * 86400000){
          (a.rightQuestions || []).forEach(function(q){ recentRight[q.qId] = true; });
        }
      });
      var pool = [];
      drillExams.filter(function(ex){ return ex.examKind !== 'soTruong'; }).forEach(function(ex){
        (ex.questions || []).forEach(function(q){
          if(!CUR || CUR.inferChuong(q) !== chuong) return;
          var qid = ex.id + '_q' + q.index;
          if(recentRight[qid]) return;
          var nid = (q.nanoPointIds && q.nanoPointIds[0]) || null;
          var score = 0;
          if(everWrong[qid]) score += 4;
          if(nid && typeof nano[nid] === 'number' && nano[nid] < 65) score += 3;
          if(nid && nano[nid] == null) score += 1;
          if(q.level === 'M2' || q.level === 'M3') score += 2; else if(q.level === 'M1') score += 1;
          pool.push({ q: Object.assign({}, q, { examId: ex.id, examTitle: ex.title, examImages: ex.images }), nid: nid, score: score + Math.random() });
        });
      });
      pool.sort(function(a, b){ return b.score - a.score; });
      var picked = [], perNano = {}, rest = [];
      pool.forEach(function(it){
        var k = it.nid || '_none';
        if(picked.length < count && (perNano[k] || 0) < 2){ picked.push(it); perNano[k] = (perNano[k] || 0) + 1; }
        else rest.push(it);
      });
      for(var i = 0; i < rest.length && picked.length < count; i++) picked.push(rest[i]);
      // Xếp lại theo Phần I -> II -> III cho giống đề thật.
      var order = { I: 0, II: 1, III: 2 };
      return picked.map(function(it){ return it.q; }).sort(function(a, b){ return (order[a.part] || 0) - (order[b.part] || 0); });
    }

    // Đọc 1 giá trị mastery của học sinh, chấp nhận cả 2 kiểu đặt tên khoá
    // (có gạch nối "tu-truong"/"hat-nhan" — theo prepscholar.js — và không
    // gạch nối "tutruong"/"hatnhan" — theo dữ liệu học sinh cũ trong Firestore).
    function studentMasteryVal(stu, keys){
      if(!stu || !stu.mastery) return null;
      for(var i = 0; i < keys.length; i++){
        if(stu.mastery[keys[i]] != null) return Number(stu.mastery[keys[i]]);
      }
      return null;
    }

    // Trung bình cộng 1 chuyên đề của CẢ LỚP, chỉ tính trên những em đã có
    // số liệu thật (không còn 4 con số tĩnh "82%/64%/52%..." như bản demo).
    function classAvgTopic(keys){
      var vals = [];
      displayStudents.forEach(function(s){
        var v = studentMasteryVal(s, keys);
        if(v != null) vals.push(v);
      });
      if(!vals.length) return null;
      return Math.round(vals.reduce(function(a, b){ return a + b; }, 0) / vals.length);
    }

    function masteryColor(val){
      if(val == null) return 'var(--muted)';
      return val < 50 ? 'var(--critical)' : (val < 80 ? 'var(--warning)' : 'var(--good)');
    }

    var avgNhiet = classAvgTopic(['nhiet']);
    var avgKhi = classAvgTopic(['khi']);
    var avgTuTruong = classAvgTopic(['tu-truong', 'tutruong']);
    var avgHatNhan = classAvgTopic(['hat-nhan', 'hatnhan']);
    // THÊM 25/9/2026: 3 chuyên đề mới (đồng bộ nano-map.js/prepscholar.js).
    var avgCd1 = classAvgTopic(['cd1-dxc']);
    var avgCd2 = classAvgTopic(['cd2-yhoc']);
    var avgCd3 = classAvgTopic(['cd3-luongtu']);

    var studentsWithPredicted = displayStudents.filter(function(s){
      return s.predictedScore != null || (s.averageScore != null && Number(s.averageScore) > 0);
    });
    var classAvgPredicted = null;
    if(studentsWithPredicted.length){
      var sumPredicted = studentsWithPredicted.reduce(function(acc, s){
        var p = s.predictedScore != null ? Number(s.predictedScore) : Number(s.averageScore) * 0.95;
        return acc + p;
      }, 0);
      classAvgPredicted = (sumPredicted / studentsWithPredicted.length).toFixed(1);
    }


    async function confirmAssignDrill(stu, chuong, count){
      if(drillBusy || !chuong) return;
      var opt = drillChapterOptions(stu).filter(function(o){ return o.num === chuong; })[0];
      if(opt && !opt.unlocked && !window.confirm('Chương ' + chuong + ' đang KHOÁ với em ' + stu.name + ' (lớp chưa học). Vẫn giao?')) return;
      setDrillBusy(true);
      try{
        var attempts = [];
        try{ attempts = await OPCref.attempts.loadForStudent(stu.id); }
        catch(e){ console.error('Lỗi tải lịch sử làm bài (Giao Drill) — vẫn giao, chỉ không lọc câu đã làm đúng:', e); }
        var picked = pickDrillQuestions(stu, chuong, count, attempts);
        if(!picked.length){
          props.fireToast('Chương ' + chuong + ' chưa có câu phù hợp trong ngân hàng đề (hoặc em đã làm đúng hết gần đây).', true);
          return;
        }
        if(picked.length < count && !window.confirm('Chỉ tìm được ' + picked.length + '/' + count + ' câu phù hợp. Vẫn giao ' + picked.length + ' câu?')) return;

        // Ảnh minh hoạ: tải theo từng đề gốc (giống Giao đề cá nhân hoá).
        var imgByExam = {};
        var examIds = Array.from(new Set(picked.map(function(q){ return q.examId; })));
        for(var i = 0; i < examIds.length; i++){
          var src = picked.filter(function(q){ return q.examId === examIds[i]; })[0];
          try{ imgByExam[examIds[i]] = await OPCref.examBank.loadExamImages(examIds[i], src.examImages); }
          catch(e){ console.error('Lỗi tải ảnh đề ' + examIds[i] + ':', e); imgByExam[examIds[i]] = []; }
        }
        var transformed = picked.map(function(q){ return toStudentQuestionShape(q, q.examId, q.examTitle || '', imgByExam[q.examId] || []); });

        var seq = 1;
        try{ seq = (await OPCref.assignedExams.countForStudent(stu.id)) + 1; }catch(e){ console.error(e); }
        var name = opt ? opt.name : ('Chương ' + chuong);
        function cnt(pred){ return picked.filter(pred).length; }
        await OPCref.assignedExams.save(stu.id, {
          seq: seq,
          title: 'Drill thích ứng — ' + name + ' (' + transformed.length + ' câu)',
          sourceType: 'drill',
          chuDeFilter: name,
          chuong: chuong,
          totalQuestions: transformed.length,
          partCounts: { p1: cnt(function(q){ return (q.part || 'I') === 'I'; }), p2: cnt(function(q){ return q.part === 'II'; }), p3: cnt(function(q){ return q.part === 'III'; }) },
          levelCounts: { m1: cnt(function(q){ return q.level === 'M1'; }), m2: cnt(function(q){ return q.level === 'M2'; }), m3: cnt(function(q){ return q.level === 'M3'; }), m4: cnt(function(q){ return q.level === 'M4'; }) },
          questions: transformed
        });
        props.fireToast('Đã giao "Đề số ' + seq + '": Drill ' + transformed.length + ' câu ' + name + ' cho ' + stu.name + ' — em làm được ngay ở mục đề được giao.');
        setDrillModal(null);
      }catch(err){
        console.error('Lỗi giao Drill:', err);
        props.fireToast('Giao Drill thất bại: ' + (err && (err.code || err.message) || err), true);
      }finally{
        setDrillBusy(false);
      }
    }

    function handleExportKPI(){
      var dataToExport = displayStudents;
      if(!dataToExport.length){ props.fireToast('Chưa có học sinh để xuất file CSV.', true); return; }

      var headers = [
        'STT',
        'Mã học sinh',

        'Email',
        'Số điện thoại',
        'Trường THPT',

        'Điểm thi cao nhất',
        'Điểm dự đoán tốt nghiệp',

        'Tỷ lệ hoàn thành đề được giao (%)',

      ];

      var rows = dataToExport.map(function(s, idx){
        var kpi = calculateStudentKPIs(s);
        return [
          idx + 1,
          s.id || ('s' + (idx + 1)),

          s.email || '',
          s.phone || '',
          s.school || 'Chưa cập nhật',
          s.username || '',
          s.status === 'active' ? 'Đang học' : 'Tạm khoá',
          kpi.targetScore,
          kpi.avgScore,
          kpi.highestScore,
          kpi.predictedScore,
          kpi.completed,
          kpi.totalAssigned,
          kpi.completionRatePct,
          kpi.targetProgressPct,
          kpi.rating,
          kpi.weakTopic,
          kpi.mistakes,
          s.parentName || 'Chưa cập nhật',
          s.parentPhone || '',
          s.parentEmail || '',
          s.referralCode || '',
          (s.commissionBalance || 0).toLocaleString('vi-VN')
        ];
      });

      var totalAssignedCompleted = dataToExport.reduce(function(acc, s){ return acc + (Number(s.assignedExamsCompletedCount) || 0); }, 0);
      var totalAssigned = dataToExport.reduce(function(acc, s){ return acc + (Number(s.assignedExamsCount) || 0); }, 0);
      var classAvgCompletion = totalAssigned > 0 ? Math.round((totalAssignedCompleted / totalAssigned) * 100) : 0;
      var practicedForExport = dataToExport.filter(function(s){ return (Number(s.completedExamsCount) || 0) > 0; });
      var sumAvgScore = practicedForExport.reduce(function(acc, s){ return acc + (Number(s.averageScore) || 0); }, 0);
      var classAvgScore = practicedForExport.length > 0 ? (sumAvgScore / practicedForExport.length).toFixed(1) : '0.0';

      var dividerRow = new Array(headers.length).fill('---');
      var summaryRow = [
        'TỔNG KẾT',
        'TOÀN BỘ ' + dataToExport.length + ' HỌC SINH',
        '', '', '', '', '',
        'Đang học: ' + dataToExport.length + ' em',
        'TB Mục tiêu: 9.0',
        'Điểm TB lớp: ' + classAvgScore,
        '',
        'Dự đoán TB: ' + (Number(classAvgScore) * 0.96 + 0.2).toFixed(1),
        'Đề được giao đã hoàn thành: ' + totalAssignedCompleted,
        'Tổng đề được giao: ' + totalAssigned,
        'Tỷ lệ HT chung: ' + classAvgCompletion + '%',
        '', 'Khảo sát PrepScholar', '', '', '', '', '', '', ''
      ];

      var allRows = [headers].concat(rows).concat([dividerRow, summaryRow]);
      var csv = allRows.map(function(r){ return r.map(csvEscape).join(','); }).join('\n');

      var now = new Date();
      var y = now.getFullYear();
      var m = ('0' + (now.getMonth() + 1)).slice(-2);
      var d = ('0' + now.getDate()).slice(-2);
      var fileName = 'danh_sach_hoc_sinh_kpi_' + y + m + d + '.csv';

      downloadCSV(fileName, csv);
      props.fireToast('Đã xuất file CSV báo cáo KPI toàn bộ ' + dataToExport.length + ' học sinh.');
    }

    var drillOpts = drillModal ? drillChapterOptions(drillModal) : [];
    var drillHasReal = drillOpts.some(function(o){ return o.unlocked && o.val != null; });
    var assignModal = drillModal ? h('div',{className:'sm-overlay', onClick:function(){ if(!drillBusy) setDrillModal(null); }},
      h('div',{className:'sm-modal', onClick:function(e){ e.stopPropagation(); }},
        h('div',{className:'sm-modal-head'},
          h('h3',null,'🎯 Giao bài Drill thích ứng'),
          h('button',{type:'button', className:'sm-modal-close', disabled: drillBusy, onClick:function(){ setDrillModal(null); }}, h(IconClose))
        ),
        h('p',{style:{fontSize:'0.86rem', color:'var(--ink-2)', lineHeight:1.6}},
          'Giao bài luyện tập cho ', h('b',null, drillModal.name), '. Câu được ưu tiên: câu em từng làm sai, câu thuộc phần kiến thức em yếu, mức M2–M3; bỏ câu em vừa làm đúng trong 14 ngày.'

        !drillHasReal ? h('div',{className:'banner info', style:{marginTop:10}}, h('span',null,'ℹ️'),
          h('div',null,'Em chưa có số liệu ở chương nào đang mở — nên cho em làm Kiểm tra chẩn đoán trước để biết chính xác phần yếu. Vẫn có thể chọn chương để giao Drill.')) : null,
        h('div',{style:{marginTop:12, display:'flex', flexDirection:'column', gap:6}},

    return h('div',null,
      h('div',{className:'eb-header-card'},

          )
        ),
        h('div',{className:'eb-matrix-grid', style:{marginTop:16}},
          h('div',{className:'eb-matrix-cell'},

            h('div',{className:'eb-matrix-lbl'}, 'Khí lí tưởng')),
          // Từ trường: THÊM 25/9/2026 — trước đây classAvgTopic tính đúng
          // nhưng ô này bị thiếu, không hiện ra (lỗi sót từ trước, không
          // liên quan tới việc mở rộng 7 chủ đề — tiện sửa luôn khi đụng

          h('div',{className:'eb-matrix-cell'},

            h('div',{className:'eb-matrix-lbl'}, 'Từ trường')),
          h('div',{className:'eb-matrix-cell'},
            h('div',{className:'eb-matrix-val', style:{color: masteryColor(avgHatNhan)}}, avgHatNhan != null ? avgHatNhan + '%' : '—'),
            h('div',{className:'eb-matrix-lbl'}, 'Vật lí hạt nhân')),
          // 3 chuyên đề mới — THÊM 25/9/2026.
          h('div',{className:'eb-matrix-cell'},
            h('div',{className:'eb-matrix-val', style:{color: masteryColor(avgCd1)}}, avgCd1 != null ? avgCd1 + '%' : '—'),
            h('div',{className:'eb-matrix-lbl'}, 'DĐ xoay chiều (CĐ)')),
          h('div',{className:'eb-matrix-cell'},
            h('div',{className:'eb-matrix-val', style:{color: masteryColor(avgCd2)}}, avgCd2 != null ? avgCd2 + '%' : '—'),
            h('div',{className:'eb-matrix-lbl'}, 'Y học (CĐ)')),
          h('div',{className:'eb-matrix-cell'},
            h('div',{className:'eb-matrix-val', style:{color: masteryColor(avgCd3)}}, avgCd3 != null ? avgCd3 + '%' : '—'),
            h('div',{className:'eb-matrix-lbl'}, 'Lượng tử (CĐ)'))
        ),
        (avgNhiet == null && avgKhi == null && avgTuTruong == null && avgHatNhan == null && avgCd1 == null && avgCd2 == null && avgCd3 == null) ? h('p',{style:{marginTop:10, fontSize:'0.8rem', color:'var(--muted)'}}, 'Chưa có học sinh nào luyện tập — số liệu sẽ tự cập nhật ngay khi có bài nộp đầu tiên.') : null
      ),

      h('div',{className:'sm-table-wrap', style:{marginTop:20}},
        h('table',{className:'sm-table'},
          h('thead',null,
            h('tr',null,
              h('th',null,'Học sinh'),
              h('th',null,'Mục tiêu / Dự đoán'),
              h('th',null,'Vật lí nhiệt'),
              h('th',null,'Khí lí tưởng'),
              h('th',null,'Từ trường'),
              h('th',null,'Hạt nhân'),
              // 3 cột chuyên đề mới — THÊM 25/9/2026 (đồng bộ nano-map.js/prepscholar.js).
              h('th',null,'DĐ xoay chiều (CĐ)'),
              h('th',null,'Y học (CĐ)'),
              h('th',null,'Lượng tử (CĐ)'),
              h('th',null,'Sổ câu sai'),
              h('th',{style:{textAlign:'right'}},'Hành động')
            )
          ),
          h('tbody',null,
            displayStudents.map(function(stu, idx){
              // Số liệu THẬT theo từng em — không còn số giả lập theo idx
              // (VD "idx * 2 + 1" câu sai) hay mastery mặc định 75/65/60/50
              // cho mọi học sinh. Chưa có dữ liệu thì hiển thị "—".
              var vNhiet = studentMasteryVal(stu, ['nhiet']);
              var vKhi = studentMasteryVal(stu, ['khi']);
              var vTuTruong = studentMasteryVal(stu, ['tu-truong', 'tutruong']);
              var vHatNhan = studentMasteryVal(stu, ['hat-nhan', 'hatnhan']);
              // 3 chuyên đề mới — THÊM 25/9/2026.
              var vCd1 = studentMasteryVal(stu, ['cd1-dxc']);
              var vCd2 = studentMasteryVal(stu, ['cd2-yhoc']);
              var vCd3 = studentMasteryVal(stu, ['cd3-luongtu']);
              var pScore = stu.predictedScore != null ? Number(stu.predictedScore).toFixed(1) : (stu.averageScore ? (stu.averageScore * 0.95).toFixed(1) : null);
              var tScore = stu.targetScore != null ? stu.targetScore : 9.0;
              var mCount = (stu.mistakeTotal != null || stu.mistakeCount != null) ? mistakeLabel(stu) : null;

              function pill(val){
                var color = masteryColor(val);
                return h('span',{style:{fontFamily:'IBM Plex Mono, monospace', fontWeight:700, color:color, background:'color-mix(in srgb, ' + color + ' 12%, transparent)', padding:'2px 8px', borderRadius:5, fontSize:'0.78rem'}}, val != null ? val + '%' : '—');
              }

              return h('tr',{key:stu.id || idx},
                h('td',null,
                  h('div',{className:'sm-student-cell'},
                    h('div',{className:'sm-avatar'}, initials(stu.name || 'H')),
                    h('div',null,
                      h('div',{className:'sm-student-name'}, stu.name || 'Học sinh'),
                      h('div',{className:'sm-student-email'}, stu.email || ''),
                      // THÊM 1/10/2026 — "🆘 Cần thầy hỗ trợ": dạng bài em đã luyện
                      // tương tự 3 lượt vẫn chưa đạt. Thầy hỗ trợ xong bấm ✓ để gỡ.
                      (function(){
                        var hn = stu.helpNeeded || {};
                        var keys = Object.keys(hn).filter(function(k){ return hn[k]; });
                        if(!keys.length) return null;
                        return h('div',{style:{marginTop:6, display:'flex', flexDirection:'column', gap:4}},
                          keys.map(function(k){
                            var it = hn[k] || {};
                            var when = it.at ? new Date(it.at) : null;
                            return h('div',{key:k, style:{display:'flex', alignItems:'center', gap:6, fontSize:'0.74rem', padding:'3px 8px', borderRadius:8, color:'var(--critical)', background:'color-mix(in srgb, var(--critical) 10%, transparent)'}},
                              h('span',{style:{flex:1}}, '🆘 Cần hỗ trợ: ' + (it.name || k) + (it.part ? ' (Phần ' + it.part + ')' : '') + (when && !isNaN(when) ? ' · ' + when.getDate() + '/' + (when.getMonth() + 1) : '')),
                              h('button',{type:'button', title:'Đã hỗ trợ xong — gỡ khỏi danh sách', style:{border:'none', background:'transparent', cursor:'pointer', fontWeight:700, color:'var(--good)'},
                                onClick:function(){
                                  OPCref.studentStats.clearHelp(stu.id, k).then(function(){ props.fireToast('Đã gỡ "' + (it.name || k) + '" của ' + stu.name + '.'); })
                                    .catch(function(err){ props.fireToast('Lỗi: ' + (err && (err.code || err.message) || 'không rõ'), true); });
                                }}, '✓ Đã hỗ trợ'));
                          }));
                      })()
                    )
                  )
                ),
                h('td',null,
                  h('div',{style:{fontFamily:'IBM Plex Mono, monospace', fontSize:'0.86rem'}},
                    h('b',{style:{color:'var(--accent-strong)'}}, pScore != null ? pScore : '—'),
                    h('span',{style:{color:'var(--muted)'}}, ' / ' + tScore + '+')
                  )
                ),
                h('td',null, pill(vNhiet)),
                h('td',null, pill(vKhi)),
                h('td',null, pill(vTuTruong)),
                h('td',null, pill(vHatNhan)),
                h('td',null, pill(vCd1)),
                h('td',null, pill(vCd2)),
                h('td',null, pill(vCd3)),
                h('td',null,
                  h('span',{style:{fontFamily:'IBM Plex Mono, monospace', fontSize:'0.82rem', color:'var(--ink)'}}, mCount != null ? mCount + ' câu' : '—')
                ),
                h('td',{style:{textAlign:'right'}},
                  h('button',{
                    type:'button',
                    className:'btn btn-primary',
                    style:{padding:'5px 12px', fontSize:'0.78rem'},
                    onClick:function(){ handleAssignDrill(stu); }
                  }, '🎯 Giao Drill thích ứng')
                )
              );
            })
          )
        )
      ),

      assignModal
    );
  }

  // ================= Root app (auth gate + tabs + toast) =================
  function AdminApp(){
    useNanoExtraSync(); // THÊM 5/10/2026 — nạp nano-point thầy tự thêm cho mọi màn hình admin
    // The Firebase module script is deferred by the browser and always
    // finishes executing AFTER this classic script runs (module scripts
    // wait for the document to finish parsing; classic scripts run inline
    // as encountered) — so window.OPC is guaranteed to still be undefined
    // on this component's very first render, even on a fast connection.
    // Poll briefly for it instead of assuming it is there already.
    var opcLoadedState = React.useState(!!window.OPC); var opcLoaded = opcLoadedState[0], setOpcLoaded = opcLoadedState[1];
    var authStatusState = React.useState('checking'); var authStatus = authStatusState[0], setAuthStatus = authStatusState[1]; // checking | signed-out | not-admin | admin
    var userState = React.useState(null); var user = userState[0], setUser = userState[1];
    var tabState = React.useState('students'); var tab = tabState[0], setTab = tabState[1]; // students | exambank | generator
    var toastState = React.useState(null); var toast = toastState[0], setToast = toastState[1];

    function fireToast(msg, isErr){ setToast({msg:msg, err:!!isErr}); setTimeout(function(){ setToast(null); }, 3400); }

    React.useEffect(function(){
      if(opcLoaded) return;
      var iv = setInterval(function(){
        if(window.OPC){ setOpcLoaded(true); clearInterval(iv); }
      }, 50);
      var giveUp = setTimeout(function(){ clearInterval(iv); setOpcLoaded(true); }, 20000);
      return function(){ clearInterval(iv); clearTimeout(giveUp); };
    }, [opcLoaded]);

    React.useEffect(function(){
      if(!opcLoaded || !window.OPC || !window.OPC.configReady) return;
      var unsub = window.OPC.onAuthStateChanged(function(u){
        if(!u){ setUser(null); window.OPC_currentUser = null; setAuthStatus('signed-out'); return; }
        var email = (u.email || '').toLowerCase();
        var allowed = window.OPC.ADMIN_EMAILS.map(function(e){ return e.toLowerCase(); }).indexOf(email) > -1;
        if(!allowed){
          window.OPC.signOutUser();
          setUser(null); window.OPC_currentUser = null; setAuthStatus('not-admin');
          return;
        }
        window.OPC_currentUser = u;
        setUser(u); setAuthStatus('admin');
      });
      return function(){ unsub(); };
    }, [opcLoaded]);

    var headerRight = document.getElementById('admin-header-right');
    React.useEffect(function(){
      if(!headerRight) return;
      if(authStatus === 'admin' && user){
        headerRight.innerHTML = '';
        var chip = document.createElement('div'); chip.className = 'user-chip';
        var ue = document.createElement('span'); ue.className = 'ue'; ue.textContent = user.email;
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'signout-btn'; btn.textContent = 'Đăng xuất';
        btn.onclick = function(){ window.OPC.signOutUser(); };
        chip.appendChild(ue); chip.appendChild(btn);
        headerRight.appendChild(chip);
      } else {
        headerRight.innerHTML = '<span class="admin-chip"><span class="dot"></span>Công cụ nội bộ · chỉ admin</span>';
      }
    }, [authStatus, user]);

    if(!opcLoaded){
      return h('div',{className:'login-wrap'}, h('p',{style:{color:'var(--ink-2)'}}, 'Đang tải…'));
    }
    if(!window.OPC || !window.OPC.configReady){ return h(SetupNeededScreen, {sdkError: window.OPC && window.OPC.sdkError}); }
    if(authStatus === 'checking'){
      return h('div',{className:'login-wrap'}, h('p',{style:{color:'var(--ink-2)'}}, 'Đang kiểm tra đăng nhập…'));
    }
    if(authStatus === 'signed-out'){ return h(LoginScreen); }
    if(authStatus === 'not-admin'){
      return h(LoginScreen, {error:'Tài khoản Google vừa chọn không có quyền quản trị trang này. Đăng nhập lại bằng đúng tài khoản admin.'});
    }

    return h('div',null,
      h('div',{className:'tab-row'},
        h('button',{type:'button', className:cx('tab-btn', tab==='students' && 'active'), onClick:function(){ setTab('students'); }}, 'Học sinh'),
        h('button',{type:'button', className:cx('tab-btn', tab==='prepscholar' && 'active'), onClick:function(){ setTab('prepscholar'); }}, '⚡ Giám sát thích ứng PrepScholar'),
        h('button',{type:'button', className:cx('tab-btn', tab==='exambank' && 'active'), onClick:function(){ setTab('exambank'); }}, 'Ngân hàng đề & câu hỏi'),
        h('button',{type:'button', className:cx('tab-btn', tab==='generator' && 'active'), onClick:function(){ setTab('generator'); }}, '🎯 Tạo đề cá nhân hóa'),
        h('button',{type:'button', className:cx('tab-btn', tab==='curriculum' && 'active'), onClick:function(){ setTab('curriculum'); }}, '📚 Quản lý chương'),
        h('button',{type:'button', className:cx('tab-btn', tab==='reports' && 'active'), onClick:function(){ setTab('reports'); }}, '🦉 Báo cáo Phụ huynh'),
        h('button',{type:'button', className:cx('tab-btn', tab==='room' && 'active'), onClick:function(){ setTab('room'); }}, '🎓 Phòng dạy'),
        h('button',{type:'button', className:cx('tab-btn', tab==='nano' && 'active'), onClick:function(){ setTab('nano'); }}, '🗺️ Nano-point'),
        h('button',{type:'button', className:cx('tab-btn', tab==='nanotag' && 'active'), onClick:function(){ setTab('nanotag'); }}, '🏷️ Gắn nano-point'),
        h('button',{type:'button', className:cx('tab-btn', tab==='pricing' && 'active'), onClick:function(){ setTab('pricing'); }}, '💰 Gói dịch vụ'),
        h('button',{type:'button', className:cx('tab-btn', tab==='special' && 'active'), onClick:function(){ setTab('special'); }}, '🏆 HSG & Olympic')
      ),
      tab === 'students' ? h(StudentsPanel, {fireToast:fireToast}) : (
        tab === 'prepscholar' ? h(PrepScholarMonitoringPanel, {fireToast:fireToast, onGoToGenerator:function(){ setTab('generator'); }}) : (
          tab === 'exambank' ? h(ExamBankPanel, {fireToast:fireToast, onGoToGenerator:function(){ setTab('generator'); }}) : (
            tab === 'curriculum' ? h(CurriculumPanel, {fireToast:fireToast}) : (
            tab === 'reports' ? h(ParentReportsPanel, {fireToast:fireToast}) : (
              tab === 'room' ? h(TeachingRoomPanel, {fireToast:fireToast}) : (
              tab === 'nanotag' ? h(NanoTaggerPanel, {fireToast:fireToast}) : (
              tab === 'nano' ? h(NanoMapPanel, {fireToast:fireToast}) : (
              tab === 'pricing' ? h('div', null, h(ReferralSettingsCard, {fireToast:fireToast}), h(PricingPanel, {fireToast:fireToast})) : (
                tab === 'special' ? h(SpecialBankPanel, {fireToast:fireToast}) : h(PersonalizedExamGeneratorPanel, {fireToast:fireToast})))))
            )
            )
          )
        )
      ),
      toast ? h('div',{className: cx('rq-toast', 'show', toast.err && 'err')}, h('span',{className:'tk'}, toast.err ? '⚠' : '✓'), toast.msg) : null
    );
  }

  function boot(){
    var mountEl = document.getElementById('admin-root');
    if(!mountEl) return;
    // Mount right away — do not wait on window.OPCReady here. The Firebase
    // module script (type="module") is always deferred until after this
    // classic script has run, so window.OPCReady is never set yet at this
    // point even on a fast connection; AdminApp itself polls for it after
    // mounting (see the opcLoaded effect above).
    if(ReactDOM.createRoot){ ReactDOM.createRoot(mountEl).render(h(AdminApp)); }
    else { ReactDOM.render(h(AdminApp), mountEl); }
  }
  boot();
})();
</script>
</body>
</html>
