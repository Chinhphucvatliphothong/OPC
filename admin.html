// THÊM 4/10/2026 — ĐỌC ĐÁP ÁN TRẢ LỜI NGẮN từ chuỗi LaTeX trong \shortans{...}.
  // Lỗi cũ: "1{,}73" (dấu phẩy thập phân viết trong ngoặc để KaTeX hiện đúng) bị cắt ở "{" nên đọc ra 1.
  // Nay chuẩn hoá {,} -> , rồi đọc đủ số; hiểu cả dạng 2{,}5\cdot10^{3}. Trả { value, decimals, exp } hoặc null.
  // decimals = số chữ số sau dấu thập phân của đáp án gốc (dùng suy ra dung sai chấm bài).
  function parseShortAnswer(raw){
    var s = String(raw == null ? '' : raw)
      .replace(/\{\s*,\s*\}/g, ',').replace(/\{\s*\.\s*\}/g, '.')
      .replace(/\$/g, '').replace(/\\[,;:!]/g, '').replace(/\\ /g, '').replace(/~/g, '');
    var sci = /(-?\d+(?:[.,]\d+)?)\s*(?:\\cdot|\\times|·|×|\*)\s*10\s*\^\s*\{?\s*(-?\d+)\s*\}?/.exec(s);
    var m = sci || /-?\d+(?:[.,]\d+)?/.exec(s);
    if(!m) return null;
    var mant = String(sci ? sci[1] : m[0]).replace(',', '.');
    var exp = sci ? parseInt(sci[2], 10) : 0;
    var dot = mant.indexOf('.');
    var decimals = dot < 0 ? 0 : mant.length - dot - 1;
    var value = Number((Number(mant) * Math.pow(10, exp)).toPrecision(12));
    if(!isFinite(value)) return null;
    return { value: value, decimals: decimals, exp: exp };
  }


  // Trích xuất các khối ngoặc nhọn {...} an toàn ngay cả khi có ngoặc nhọn lồng nhau như $\dfrac{a}{b}$
  function extractBraceBlocks(str, startIndex, maxBlocks){
    maxBlocks = maxBlocks || 4;
    var blocks = [];
    var i = startIndex;
    while(i < str.length && blocks.length < maxBlocks){
      if(str[i] === '{'){
        var depth = 1;
        var start = i + 1;
        i++;
        while(i < str.length && depth > 0){
          if(str[i] === '{' && str[i-1] !== '\\') depth++;
          else if(str[i] === '}' && str[i-1] !== '\\') depth--;
          i++;
        }
        if(depth === 0){
          blocks.push(str.substring(start, i - 1).trim());
        }
      } else {
        i++;
      }
    }
    return blocks;
  }

  // THÊM 2/10/2026 — gỡ \immini{A}{B} (có thể kèm [tuỳ chọn]) thành "A" + xuống dòng + "B"; không đụng gì nếu
  // không có \immini hoặc cú pháp không đủ 2 khối ngoặc (khi đó giữ cách cũ: chỉ bỏ chữ \immini{).
  function unwrapImminiInStem(stem){
    var idx = stem.indexOf('\\immini');
    if(idx < 0) return stem;
    function groupEnd(str, open){
      var depth = 0;
      for(var k = open; k < str.length; k++){
        var ch = str[k];
        if(ch === '\\'){ k++; continue; }
        if(ch === '{') depth++;
        else if(ch === '}'){ depth--; if(depth === 0) return k; }
      }
      return -1;
    }
    var p = idx + 7;
    while(stem[p] === ' ') p++;
    if(stem[p] === '['){ var cb = stem.indexOf(']', p); if(cb < 0) return stem.replace(/\\immini\{?/, ''); p = cb + 1; while(stem[p] === ' ') p++; }
    if(stem[p] !== '{') return stem.replace(/\\immini\{?/, '');
    var e1 = groupEnd(stem, p);
    if(e1 < 0) return stem.replace(/\\immini\{?/, '');
    var q = e1 + 1;
    while(/\s/.test(stem[q] || '')) q++;
    if(stem[q] !== '{') return stem.replace(/\\immini\{?/, '');
    var e2 = groupEnd(stem, q);
    if(e2 < 0) return stem.replace(/\\immini\{?/, '');
    return stem.slice(0, idx) + stem.slice(p + 1, e1) + '\n' + stem.slice(q + 1, e2) + stem.slice(e2 + 1);
  }

  // Tải file .tex trực tiếp về máy tính người dùng từ bộ nhớ/Firestore
  function downloadTexFile(texObj, title){
    if(!texObj) return;
    if(texObj.content){
      var blob = new Blob([texObj.content], { type: 'application/x-tex;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = texObj.name || (title ? title.replace(/[^\w.\-]+/g, '_') + '.tex' : 'de_thi.tex');
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } else if(texObj.url){
      window.open(texObj.url, '_blank');
    }
  }

  // Tối ưu hóa và nén hình ảnh sơ đồ/đồ thị câu hỏi client-side thành JPEG siêu nhẹ cho Firestore
  function compressImage(file, maxDimension, quality){
    return new Promise(function(resolve){
      if(!file) return resolve(null);
      if(!/^image\//i.test(file.type) || /image\/svg/i.test(file.type)){
        var reader = new FileReader();
        reader.onload = function(e){
          resolve({ name: file.name, size: file.size, url: e.target.result, originalSize: file.size });
        };
        reader.onerror = function(){
          resolve({ name: file.name, size: file.size, url: '', originalSize: file.size });
        };
        reader.readAsDataURL(file);
        return;
      }

      var img = new Image();
      var objectUrl = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(objectUrl);
        var w = img.naturalWidth || img.width || 800;
        var h = img.naturalHeight || img.height || 600;
        var maxD = maxDimension || 1200;
        if(w > maxD || h > maxD){
          if(w > h){
            h = Math.round((h * maxD) / w);
            w = maxD;
          } else {
            w = Math.round((w * maxD) / h);
            h = maxD;
          }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', quality || 0.82);
        var approxBytes = Math.round((dataUrl.length - 22) * 0.75);
        resolve({
          name: file.name,
          size: approxBytes,
          originalSize: file.size,
          url: dataUrl,
          width: w,
          height: h
        });
      };
      img.onerror = function(){
        URL.revokeObjectURL(objectUrl);
        var reader = new FileReader();
        reader.onload = function(e){
          resolve({ name: file.name, size: file.size, url: e.target.result, originalSize: file.size });
        };
        reader.readAsDataURL(file);
      };
      img.src = objectUrl;
    });
  }

  // Parser bóc tách file .tex ngân hàng đề theo chuẩn Bộ Giáo Dục & tag: % [Mức độ][Chủ đề lớn][Dạng bài/Chủ đề nhỏ]
  // Bóc tách 1 khối "câu hỏi chùm" (\immini{đoạn văn/ngữ cảnh dùng chung}{hình
  // minh hoạ}) — cú pháp LaTeX chuẩn cho các câu hỏi nhóm kiểu "Dùng thông tin
  // sau cho câu X và câu Y". Trả về đoạn văn đã làm sạch cú pháp LaTeX cơ bản,
  // danh sách tên file hình, và số câu hỏi liền sau mà đoạn này áp dụng (đọc
  // từ chính số câu ghi trong đoạn văn — VD "câu 1 và câu 2" → 2 câu; nếu
  // không đọc được số nào thì tạm coi là áp dụng cho đúng 1 câu ngay sau đó
  // và đánh dấu "uncertain" để admin biết mà kiểm tra lại).
  // SỬA 26/9/2026: đếm số câu hỏi mà 1 đoạn mở đầu dùng chung áp dụng cho,
  // đọc từ chính câu chữ (VD "câu 1 và 2:", "câu 1, 2 và 3:", "câu 3 đến 5").
  // Cách đếm CŨ (quét mọi cặp "câu <số>" rải rác trong CẢ đoạn văn) bỏ sót
  // đúng cách viết tắt phổ biến nhất — "câu 1 và 2" — vì chữ "câu" chỉ xuất
  // hiện MỘT LẦN trước cả cụm số, số thứ 2 ("2") không có chữ "câu" đứng
  // trước nên bị regex cũ /câu\s*(\d+)/g bỏ qua, khiến hệ thống tưởng nhóm
  // chỉ áp dụng cho đúng 1 câu. Sửa: từ vị trí chữ "câu" đầu tiên đi kèm số,
  // lấy cả CỤM kí tự phía sau cho đến dấu ":" gần nhất (hoặc tối đa 60 kí
  // tự nếu không có dấu ":"), rồi lấy MỌI số xuất hiện trong cụm đó — không
  // đòi hỏi chữ "câu" phải lặp lại trước từng số.
  function inferGroupQuestionCount(passageText){
    var m = passageText.match(/c[aâ]u\s*\d/i);
    if(!m) return { count: 1, uncertain: true };
    var startIdx = m.index;
    var colonIdx = passageText.indexOf(':', startIdx);
    var windowEnd = (colonIdx > -1 && colonIdx - startIdx < 80) ? colonIdx : Math.min(passageText.length, startIdx + 60);
    var windowText = passageText.slice(startIdx, windowEnd);
    var nums = [];
    var numRegex = /\d+/g;
    var nm;
    while((nm = numRegex.exec(windowText)) !== null){ nums.push(Number(nm[0])); }
    if(nums.length >= 2){
      return { count: Math.max.apply(null, nums) - Math.min.apply(null, nums) + 1, uncertain: false };
    } else if(nums.length === 1){
      return { count: 1, uncertain: false };
    }
    return { count: 1, uncertain: true };
  }

  // THÊM 2/10/2026 — HÌNH TikZ & BẢNG trong đề: \begin{tikzpicture}...\end{tikzpicture} và
  // \begin{tabular}...\end{tabular} KHÔNG được làm phẳng xuống 1 dòng như phần chữ (dòng chú thích "%" bên trong
  // mã TikZ sẽ "nuốt" luôn phần còn lại của dòng). stash: cất các khối này ra, xử lý chữ xong rồi restore: trả về
  // nguyên vẹn (kèm xuống dòng) để màn hình học sinh (tikz-lite.js / bảng) dựng lại.
  // THÊM 5/10/2026 — đọc dòng thẻ "% @nano: khi-1.3, khi-2.1" trong .tex (có thể 2-3 nano-point/câu, chịu được
  // "khi -2.1"). Không phụ thuộc window.OPC_NANO để dùng được cả khi chạy thử ngoài trình duyệt.
  function parseNanoTagIds(text){
    var t = String(text || '').toLowerCase().replace(/([a-z])\s+-\s*(\d)/g, '$1-$2');
    var out = [], m, re = /[a-z0-9]+(?:-[a-z0-9]+)*\.\d+/g;
    while((m = re.exec(t)) !== null){ if(out.indexOf(m[0]) < 0) out.push(m[0]); }
    return out;
  }
  var FIGURE_BLOCK_RE = /\\begin\{(tikzpicture|tabular)\}[\s\S]*?\\end\{\1\}/g;
  function stashFigureBlocks(text){
    var blocks = [];
    var t = String(text).replace(FIGURE_BLOCK_RE, function(m){ blocks.push(m); return ' \u0001' + (blocks.length - 1) + '\u0001 '; });
    return {
      text: t,
      blocks: blocks,
      restore: function(str){
        return str.replace(/\s*\u0001(\d+)\u0001\s*/g, function(_, k){ return '\n' + blocks[Number(k)] + '\n'; }).trim();
      }
    };
  }
  function extractImminiGroup(text){
    var mIdx = text.indexOf('\\immini');
    if(mIdx === -1) return null;
    var blocks = extractBraceBlocks(text, mIdx + 7, 2);
    if(!blocks.length) return null;
    var passageRaw = blocks[0] || '';
    var imageRaw = blocks.length > 1 ? blocks[1] : '';
    var stashP = stashFigureBlocks(passageRaw);
    var passageText = stashP.text
      .replace(/\\textbf\{([^{}]*)\}/g, '$1')
      .replace(/\\textit\{([^{}]*)\}/g, '$1')
      .replace(/\\noindent/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    // SỬA 2/10/2026 — phần chữ/bảng nằm NGAY SAU \immini{..}{..} (vd "Kết quả thí nghiệm ghi ở bảng sau:" +
    // bảng) trước đây bị bỏ rơi vì chỉ đọc 2 tham số của \immini. Nay nối tiếp vào đoạn dùng chung.
    var trailing = '';
    var b1 = scanBraceBlock(text, text.indexOf('{', mIdx + 7));
    if(b1){
      var k2 = b1.endIndex;
      while(k2 < text.length && /\s/.test(text[k2])) k2++;
      var b2 = text[k2] === '{' ? scanBraceBlock(text, k2) : null;
      if(b2) trailing = text.slice(b2.endIndex);
    }
    var stashT = stashFigureBlocks(trailing.replace(/^%.*$/gm, '').replace(/\\begin\{ex\}[\s\S]*$/, ''));
    var trailingText = stashT.text
      .replace(/\\begin\{center\}|\\end\{center\}/g, ' ')
      .replace(/\\textbf\{([^{}]*)\}/g, '$1')
      .replace(/\\textit\{([^{}]*)\}/g, '$1')
      .replace(/\\noindent/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if(!passageText) return null;
    var imgs = [];
    var imgRegex2 = /\\includegraphics(?:\[.*?\])?\{([^}]+)\}/g;
    var im2;
    while((im2 = imgRegex2.exec(imageRaw)) !== null){ imgs.push(im2[1]); }
    var groupCount = inferGroupQuestionCount(passageText);
    var passageFull = stashP.restore(passageText);
    // hình TikZ nằm ở tham số thứ 2 của \immini (thay cho ảnh) -> đặt cuối đoạn dùng chung
    var figInImage = [];
    imageRaw.replace(FIGURE_BLOCK_RE, function(m){ figInImage.push(m); return m; });
    if(figInImage.length) passageFull += '\n' + figInImage.join('\n');
    if(trailingText) passageFull += '\n' + stashT.restore(trailingText);
    return { passage: passageFull, images: imgs, remaining: Math.max(1, groupCount.count), uncertain: groupCount.uncertain };
  }

  // SỬA 26/9/2026 — theo báo cáo thật của thầy: nhiều đề dùng câu hỏi chùm
  // KHÔNG qua \immini mà viết trực tiếp kiểu:
  //   \textbf{Nội dung câu 1 và 2:} <đoạn văn/ngữ cảnh dùng chung>
  //   \begin{center}\includegraphics[...]{...}\end{center}
  //   \begin{ex} ... \end{ex}   (câu 1)
  //   \begin{ex} ... \end{ex}   (câu 2)
  // Trước đây preambleBuffer chỉ được xét khi có \immini -> case này bị xoá
  // âm thầm (mất cả đoạn văn dùng chung lẫn hình minh hoạ chung), 2 câu hỏi
  // hiện ra rời rạc, không có ngữ cảnh, không có hình. Nhận diện bằng cụm từ
  // "Nội dung ... câu <số>" (không phân biệt hoa/thường, chấp nhận vài chữ
  // xen giữa như "Nội dung dùng chung cho câu 1, 2:") — cụm này gần như chỉ
  // xuất hiện ở đúng loại đoạn mở đầu câu hỏi chùm, không trùng với tiêu đề
  // phần thi ("PHẦN II — ...") hay tên đề, nên an toàn để kích hoạt.
  function extractPlainPreambleGroup(text){
    if(!/N[ộo]i dung[^\n]{0,40}c[aâ]u\s*\d/i.test(text)) return null;
    var imgs = [];
    var imgRegex3 = /\\includegraphics(?:\[.*?\])?\{([^}]+)\}/g;
    var im3;
    while((im3 = imgRegex3.exec(text)) !== null){ imgs.push(im3[1]); }
    var stashPl = stashFigureBlocks(text.replace(/^%.*$/gm, ''));
    var passageText = stashPl.text
      .replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, function(m, inner){
        return inner.replace(/\\includegraphics(?:\[.*?\])?\{[^}]+\}/g, '').trim();
      })
      .replace(/\\includegraphics(?:\[.*?\])?\{[^}]+\}/g, '')
      .replace(/\\textbf\{([^{}]*)\}/g, '$1')
      .replace(/\\textit\{([^{}]*)\}/g, '$1')
      .replace(/\\noindent/g, '')
      .replace(/\\(subsubsection|tieuephan)\{[^{}]*\}/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if(!passageText) return null;
    var groupCount = inferGroupQuestionCount(passageText);
    // SỬA 2/10/2026 — giữ nguyên hình TikZ/bảng nằm trong đoạn dùng chung (không làm phẳng thành 1 dòng)
    return { passage: stashPl.restore(passageText), images: imgs, remaining: Math.max(1, groupCount.count), uncertain: groupCount.uncertain };
  }

  // Quét 1 khối {...} bắt đầu ĐÚNG tại dấu '{' ở startIdx (nhận diện đúng độ
  // sâu ngoặc nhọn lồng nhau, bỏ qua ngoặc bị escape "\{"/"\}" — giống
  // extractBraceBlocks phía trên nhưng trả thêm endIndex (vị trí NGAY SAU
  // dấu '}' đóng) để phục vụ việc CẮT/THAY THẾ trực tiếp trên chuỗi gốc,
  // điều extractBraceBlocks (vốn chỉ dùng để ĐỌC nội dung) không cần tới.
  function scanBraceBlock(str, startIdx){
    if(str[startIdx] !== '{') return null;
    var depth = 1;
    var i = startIdx + 1;
    while(i < str.length && depth > 0){
      if(str[i] === '{' && str[i - 1] !== '\\') depth++;
      else if(str[i] === '}' && str[i - 1] !== '\\') depth--;
      i++;
    }
    if(depth !== 0) return null; // ngoặc không khớp (file lỗi cú pháp/bị cắt cụt) — bỏ qua an toàn
    return { content: str.substring(startIdx + 1, i - 1), endIndex: i };
  }

  // "Gỡ" cú pháp \immini{ \begin{ex}...\end{ex} }{hình} — một số đề dùng
  // \immini để gắn 1 hình DUY NHẤT cho ĐÚNG 1 câu (không phải câu hỏi chùm
  // dùng chung ngữ cảnh cho nhiều câu): đặt CẢ khối \begin{ex}...\end{ex}
  // vào bên trong tham số thứ nhất của \immini, hình ảnh nằm ở tham số thứ
  // hai — xuất hiện SAU \end{ex}. THÊM 25/9/2026, theo báo cáo thật của
  // thầy: bộ máy bóc theo dòng bên dưới (dựa vào \begin{ex}/\end{ex} làm
  // mốc) không thấy được phần hình này vì nó nằm NGOÀI phạm vi đã bắt được
  // của câu hỏi -> hình bị mất khi hiện cho học sinh dù file .tex hoàn toàn
  // hợp lệ. Xử lý TRƯỚC khi bóc theo dòng: chèn thẳng \includegraphics vào
  // trong khối \begin{ex}...\end{ex} (ngay trước \end{ex}), rồi bỏ lớp bọc
  // \immini{...}{...} ngoài cùng — nhờ vậy phần bóc ảnh theo từng câu (vốn
  // đã hoạt động đúng, xem imgRegex bên dưới) tự nhận ra hình như bình
  // thường, không cần sửa gì thêm ở bộ máy chính.
  // KHÔNG đụng tới \immini dùng cho câu hỏi chùm thật (tham số 1 là đoạn
  // văn/ngữ cảnh dùng chung, KHÔNG chứa \begin{ex}) — case đó vẫn được xử
  // lý như cũ qua preambleBuffer/extractImminiGroup bên dưới. Cũng không
  // đụng tới \immini{}{hình} đặt bên TRONG 1 câu (tham số 1 rỗng) — case
  // này vốn đã hoạt động đúng vì \includegraphics vẫn nằm trong phạm vi
  // \begin{ex}...\end{ex} đã bắt được.
  function unwrapSingleQuestionImmini(content){
    var out = '';
    var pos = 0;
    while(true){
      var mIdx = content.indexOf('\\immini', pos);
      if(mIdx === -1){ out += content.slice(pos); break; }
      var brace1Start = content.indexOf('{', mIdx);
      if(brace1Start === -1){ out += content.slice(pos); break; }
      var block1 = scanBraceBlock(content, brace1Start);
      if(!block1){ out += content.slice(pos, mIdx + 7); pos = mIdx + 7; continue; }
      if(!/\\begin\{ex\}/.test(block1.content) || !/\\end\{ex\}/.test(block1.content)){
        // Không phải case "bọc nguyên 1 câu" -> giữ nguyên như cũ.
        out += content.slice(pos, mIdx + 7);
        pos = mIdx + 7;
        continue;
      }
      var afterBlock1 = block1.endIndex;
      var imageArg = '';
      var finalEnd = afterBlock1;
      if(content[afterBlock1] === '{'){
        var block2 = scanBraceBlock(content, afterBlock1);
        if(block2){ imageArg = block2.content; finalEnd = block2.endIndex; }
      }
      var exContent = block1.content;
      // SỬA 2/10/2026 — hình ở tham số 2 là TikZ/bảng (không phải \includegraphics): chèn vào PHẦN ĐỀ BÀI (ngay trước
      // \choice/\choiceTF/\shortans/\dongke/\loigiai). Trước đây mọi thứ đều chèn trước \end{ex} — tức nằm SAU
      // \loigiai, ngoài phạm vi phần đề bài nên hình TikZ bị mất khi hiện cho học sinh (ảnh \includegraphics thì
      // vẫn được nhận vì được quét trên toàn câu, nên vẫn giữ cách cũ cho ảnh).
      var figureBlocks = [];
      var imageOnly = imageArg ? imageArg.replace(FIGURE_BLOCK_RE, function(m){ figureBlocks.push(m); return ''; }) : '';
      var withImage = exContent;
      if(figureBlocks.length){
        var cutAt = exContent.search(/\\choice|\\shortans|\\dongke|\\loigiai/);
        var ins = '\n' + figureBlocks.join('\n') + '\n';
        withImage = cutAt > -1 ? exContent.slice(0, cutAt) + ins + exContent.slice(cutAt) : exContent.replace(/\\end\{ex\}/, ins + '\\end{ex}');
      }
      if(imageOnly.replace(/\\begin\{center\}|\\end\{center\}/g, '').trim()){
        withImage = withImage.replace(/\\end\{ex\}/, imageOnly + '\n\\end{ex}');
      }
      out += content.slice(pos, mIdx) + withImage;
      pos = finalEnd;
    }
    return out;
  }

  // opts.allowEssay (THÊM 30/9/2026, chỉ ngân hàng HSG/Olympic): câu không có
  // \\choice / \\choiceTF / \\shortans được nhận là câu TỰ LUẬN (type
  // 'essay') thay vì câu trắc nghiệm rỗng. Ngân hàng Vật lí 12 giữ nguyên.
  function parseTexBank(content, filename, opts){
    var allowEssay = !!(opts && opts.allowEssay);
    // THÊM 25/9/2026: gỡ trước cú pháp \immini{ \begin{ex}...\end{ex} }{hình}
    // (1 hình cho đúng 1 câu) — xem giải thích đầy đủ ở unwrapSingleQuestionImmini.
    content = unwrapSingleQuestionImmini(content);
    var lines = content.split(/\r?\n/);
    var currentPart = 'I';
    var questions = [];
    var inEx = false;
    var exBuffer = [];
    var lastCommentTag = null;
    var lastNanoIds = []; // THÊM 5/10/2026 — các mã nano đọc từ dòng "% @nano: …" ngay trước câu
    var titleCand = '';
    var preambleBuffer = [];
    var pendingGroup = null;

    var tagRegex = /%\s*\[(M[1-4])\]\s*\[([^\]]+)\]\s*\[([^\]]+)\]/i;
    var subsecRegex = /\\subsubsection\{([^}]+)\}/i;

    for(var i = 0; i < lines.length; i++){
      var line = lines[i];

      if(!titleCand){
        var sm = line.match(subsecRegex);
        if(sm) titleCand = sm[1].trim();
      }

      // Nhận diện phân đoạn đề thi chuẩn Bộ GD: Phần I, Phần II, Phần III.
      // Hỗ trợ cả số La Mã lẫn số thường, có dấu lẫn không dấu (một số file
      // .tex xuất ra bị mất dấu "PHẦN" → "PHAN") để tránh toàn bộ câu hỏi bị
      // gộp nhầm vào Phần I khi file nguồn dùng cách ghi khác với mặc định.
      var isPartIII = /\\tieuephan\{.*?III.*?\}/i.test(line) || /PH[ẦA]N\s*[:\-]?\s*(III|3)\b/i.test(line);
      var isPartII = /\\tieuephan\{.*?II.*?\}/i.test(line) || /PH[ẦA]N\s*[:\-]?\s*(II|2)\b/i.test(line);
      var isPartI = /\\tieuephan\{.*?I.*?\}/i.test(line) || /PH[ẦA]N\s*[:\-]?\s*(I|1)\b/i.test(line);
      if(isPartIII){
        currentPart = 'III';
      } else if(isPartII){
        currentPart = 'II';
      } else if(isPartI){
        currentPart = 'I';
      }

      var nanoLine = line.match(/%.*?@nano\s*:\s*(.*)$/i);
      if(nanoLine){ lastNanoIds = parseNanoTagIds(nanoLine[1]); }

      var tm = line.match(tagRegex);
      if(tm){
        lastCommentTag = {
          level: tm[1].toUpperCase(),
          chuDeLon: tm[2].trim(),
          dangBai: tm[3].trim()
        };
      }

      if(/\\begin\{ex\}/.test(line)){
        // Xử lý phần "mở đầu" tích luỹ được trước câu hỏi này — nếu có chứa
        // \immini thì đó là ngữ cảnh dùng chung cho câu hỏi chùm sắp tới.
        if(preambleBuffer.length){
          var preambleText = preambleBuffer.join('\n');
          var newGroup = null;
          if(/\\immini/.test(preambleText)){
            newGroup = extractImminiGroup(preambleText);
          } else {
            // SỬA 26/9/2026: câu hỏi chùm viết trực tiếp (không \immini),
            // nhận diện qua cụm "Nội dung ... câu N" — xem extractPlainPreambleGroup.
            newGroup = extractPlainPreambleGroup(preambleText);
          }
          if(newGroup) pendingGroup = newGroup;
          preambleBuffer = [];
        }
        inEx = true;
        exBuffer = [line];
      } else if(inEx){
        exBuffer.push(line);
        if(/\\end\{ex\}/.test(line)){
          inEx = false;
          var full = exBuffer.join('\n');
          var tag = lastCommentTag || { level: 'M2', chuDeLon: 'Vật lí', dangBai: 'Chung' };
          lastCommentTag = null;
          var nanoTagIds = lastNanoIds; lastNanoIds = [];

          var qType = 'choice';
          if(/\\choiceTF/i.test(full)) qType = 'choiceTF';
          else if(/\\shortans/i.test(full)) qType = 'shortans';
          else if(allowEssay && !/\\choice/i.test(full)) qType = 'essay';

          // Bóc tách nội dung câu hỏi (bỏ bớt cú pháp bao bọc)
          var stemRaw = full.replace(/^[\s\S]*?\\begin\{ex\}/, '').replace(/\\end\{ex\}[\s\S]*?$/, '');
          var stemCutIdx = stemRaw.search(/\\choice|\\choiceTF|\\shortans|\\dongke|\\loigiai/);
          var stem = (stemCutIdx > -1 ? stemRaw.substring(0, stemCutIdx) : stemRaw).trim();
          // SỬA 2/10/2026 — \immini{đoạn văn}{hình} đứng TRONG câu: trước đây chỉ xoá "\immini{" nên còn sót "}{"
          // giữa đoạn văn và hình (hiện chữ thô "}{ ..." ở màn hình học sinh). Nay bóc đúng 2 tham số rồi nối lại.
          stem = unwrapImminiInStem(stem).trim();

          // Bóc tách phương án lựa chọn
          var options = [];
          if(qType === 'choice'){
            var cIdx = full.indexOf('\\choice');
            if(cIdx > -1){
              var rawOpts = extractBraceBlocks(full, cIdx + 7, 4);
              options = rawOpts.map(function(opt, oIdx){
                var isTrue = /\\True\b/.test(opt);
                var text = opt.replace(/\\True\b/, '').trim();
                return { key: String.fromCharCode(65 + oIdx), text: text, isTrue: isTrue };
              });
            }
          } else if(qType === 'choiceTF'){
            var tfIdx = full.search(/\\choiceTF(?:\[.*?\])?/);
            if(tfIdx > -1){
              var tfMatch = full.match(/\\choiceTF(?:\[.*?\])?/);
              var rawTf = extractBraceBlocks(full, tfIdx + (tfMatch ? tfMatch[0].length : 9), 4);
              options = rawTf.map(function(opt, oIdx){
                var isTrue = /\\True\b/.test(opt);
                var text = opt.replace(/\\True\b/, '').trim();
                return { key: ['a', 'b', 'c', 'd'][oIdx], text: text, isTrue: isTrue };
              });
            }
          }

          // Bóc tách trả lời ngắn — SỬA 26/9/2026: dùng extractBraceBlocks
          // (nhận diện đúng độ sâu ngoặc nhọn) thay vì regex "không tham
          // lam" cũ /\{([^}]+)\}/. Đáp án số thập phân kiểu Việt Nam hay
          // viết "\shortans{7{,}5}" (để KaTeX hiện dấu phẩy đúng) — ngoặc
          // "{,}" lồng bên trong khiến regex cũ dừng lại ở dấu "}" đóng đầu
          // tiên gặp được (của "{,}"), cắt cụt đáp án thành "7{," thay vì
          // "7{,}5" -> lưu sai đáp án dùng để chấm điểm tự động.
          var shortansVal = null;
          if(qType === 'shortans'){
            var shortansIdx = full.indexOf('\\shortans');
            var shortansBlocks = shortansIdx > -1 ? extractBraceBlocks(full, shortansIdx + 9, 1) : [];
            if(shortansBlocks.length) shortansVal = shortansBlocks[0].trim();
          }

          // Bóc tách lời giải — dùng extractBraceBlocks (nhận diện đúng độ sâu
          // ngoặc nhọn) thay vì regex "không tham lam" cũ: lời giải vật lí gần
          // như luôn chứa lệnh LaTeX có ngoặc lồng nhau (\frac{a}{b}, \sqrt{x},
          // \text{...}...) nên regex cũ bị cắt cụt tại dấu "}" đóng đầu tiên
          // gặp được (thường là ngoặc con bên trong), làm hỏng cú pháp và khiến
          // KaTeX render lỗi -> hiển thị lại dạng LaTeX thô cho học sinh.
          var loigiaiIdx = full.indexOf('\\loigiai');
          var loigiaiBlocks = loigiaiIdx > -1 ? extractBraceBlocks(full, loigiaiIdx + 8, 1) : [];
          var loigiai = loigiaiBlocks.length ? loigiaiBlocks[0].trim() : '';

          // Bóc tách tên hình ảnh
          var imgMatches = [];
          var imgRegex = /\\includegraphics(?:\[.*?\])?\{([^}]+)\}/g;
          var im;
          while((im = imgRegex.exec(full)) !== null){
            imgMatches.push(im[1]);
          }

          // Gắn ngữ cảnh "câu hỏi chùm" đang chờ (nếu có) vào câu này, rồi
          // giảm dần số câu còn lại thuộc nhóm — hết thì xoá nhóm đang chờ.
          var groupData = null;
          if(pendingGroup && pendingGroup.remaining > 0){
            groupData = { passage: pendingGroup.passage, images: pendingGroup.images.slice(), uncertain: pendingGroup.uncertain };
            pendingGroup.remaining -= 1;
            if(pendingGroup.remaining <= 0) pendingGroup = null;
          }

          questions.push({
            index: questions.length + 1,
            part: currentPart,
            type: qType,
            level: tag.level,
            chuDeLon: tag.chuDeLon,
            dangBai: tag.dangBai,
            nanoTagIds: nanoTagIds,
            stem: stem,
            options: options,
            shortans: shortansVal,
            loigiai: loigiai,
            images: imgMatches,
            groupPassage: groupData ? groupData.passage : null,
            groupImages: groupData ? groupData.images : [],
            groupUncertain: groupData ? !!groupData.uncertain : false,
            raw: full
          });
        }
      } else {
        preambleBuffer.push(line);
      }
    }

    var stats = {
      total: questions.length,
      p1: questions.filter(function(q){ return q.part === 'I'; }).length,
      p2: questions.filter(function(q){ return q.part === 'II'; }).length,
      p3: questions.filter(function(q){ return q.part === 'III'; }).length,
      m1: questions.filter(function(q){ return q.level === 'M1'; }).length,
      m2: questions.filter(function(q){ return q.level === 'M2'; }).length,
      m3: questions.filter(function(q){ return q.level === 'M3'; }).length,
      m4: questions.filter(function(q){ return q.level === 'M4'; }).length,
      grouped: questions.filter(function(q){ return !!q.groupPassage; }).length,
      topics: Array.from(new Set(questions.map(function(q){ return q.chuDeLon; }).filter(Boolean))),
      subTopics: Array.from(new Set(questions.map(function(q){ return q.dangBai; }).filter(Boolean)))
    };

    // Gợi ý "Chuyên đề chính" cho form: ưu tiên dùng chính dữ liệu đã gắn thẻ
    // trong file (stats.topics, lấy từ tag % [Mức độ][Chủ đề lớn][Dạng bài]
    // của từng câu) thay vì chỉ đoán theo từ khoá — đáng tin hơn nhiều. Nếu
    // file có TỪ 2 chuyên đề khác nhau trở lên (đề tổng hợp cuốn chiếu nhiều
    // chương) thì không ép về 1 chuyên đề sai, mà gợi ý "Tổng hợp nhiều
    // chuyên đề" luôn.
    var suggestedChuDe = CHU_DE_LIST[0];
    if(stats.topics.length > 1){
      suggestedChuDe = 'Tổng hợp nhiều chuyên đề';
    } else if(stats.topics.length === 1 && CHU_DE_LIST.indexOf(stats.topics[0]) > -1){
      suggestedChuDe = stats.topics[0];
    } else {
      var fullText = ((filename||'') + ' ' + (titleCand||'') + ' ' + stats.topics.join(' ')).toLowerCase();
      if(/khí|boyle|charles|nhiệt động|chất khí|piston|xilanh/i.test(fullText)) suggestedChuDe = 'Khí lí tưởng';
      else if(/nhiệt|sôi|nóng chảy|ngưng tụ|nội năng|đông đặc/i.test(fullText)) suggestedChuDe = 'Vật lí nhiệt';
      else if(/từ trường|cảm ứng|lorentz|dòng điện cảm ứng|flen|từ thông|máy phát điện/i.test(fullText)) suggestedChuDe = 'Từ trường';
      else if(/hạt nhân|phóng xạ|năng lượng liên kết|phản ứng hạt nhân/i.test(fullText)) suggestedChuDe = 'Vật lí hạt nhân';
      else if(/mạch rlc|dung kháng|cảm kháng|máy biến áp|chỉnh lưu|dòng điện xoay chiều/i.test(fullText)) suggestedChuDe = 'Dòng điện xoay chiều (Chuyên đề)';
      else if(/tia x|x-quang|xquang|siêu âm|cộng hưởng từ|mri|chẩn đoán/i.test(fullText)) suggestedChuDe = 'Vật lí trong y học (Chuyên đề)';
      else if(/quang điện|lượng tử|photon|bohr|quang phổ vạch|lưỡng tính sóng hạt|vùng năng lượng/i.test(fullText)) suggestedChuDe = 'Vật lí lượng tử (Chuyên đề)';
    }

    // Gợi ý "Mức độ tổng quan" tương tự: nếu file có từ 2 mức độ khác nhau
    // trở lên (rất thường gặp — 1 bài/1 đề luôn trộn nhiều mức) thì gợi ý
    // "Đa mức" (v:0) thay vì ép chọn 1 mức không đúng thực tế.
    var distinctLevelCount = (stats.m1 ? 1 : 0) + (stats.m2 ? 1 : 0) + (stats.m3 ? 1 : 0) + (stats.m4 ? 1 : 0);
    var suggestedMucDo = distinctLevelCount > 1 ? 0 : (stats.m1 ? 1 : stats.m2 ? 2 : stats.m3 ? 3 : stats.m4 ? 4 : 2);

    return {
      title: titleCand || (filename ? filename.replace(/\.tex$/i, '').replace(/[_-]+/g, ' ') : ''),
      suggestedChuDe: suggestedChuDe,
      suggestedMucDo: suggestedMucDo,
      stats: stats,
      questions: questions
    };
  }

  function IconSearch(){
    return h('svg',{viewBox:'0 0 24 24', fill:'none'},
      h('circle',{cx:11, cy:11, r:7, stroke:'currentColor', strokeWidth:1.8}),
      h('path',{d:'M20 20l-3.2-3.2', stroke:'currentColor', strokeWidth:1.8, strokeLinecap:'round'})
    );
  }
  function IconClose(){
    return h('svg',{viewBox:'0 0 24 24', fill:'none', width:18, height:18},
      h('path',{d:'M6 6l12 12M18 6L6 18', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round'})
    );
  }
  function IconGoogle(){

  // THÊM 29/9/2026 — các chuyên đề có số liệu mastery THẬT của 1 học sinh,
  // sắp từ yếu đến mạnh. Chấp nhận cả khoá cũ không gạch nối (tutruong,
  // hatnhan). chuong: số chương SGK (1-4) hoặc null với 3 chuyên đề.
  var KPI_TOPICS = [
    { key:'nhiet', alt:[], name:'Vật lí nhiệt', chuong:1 },
    { key:'khi', alt:[], name:'Khí lí tưởng', chuong:2 },
    { key:'tu-truong', alt:['tutruong'], name:'Từ trường', chuong:3 },
    { key:'hat-nhan', alt:['hatnhan'], name:'Vật lí hạt nhân', chuong:4 },
    { key:'cd1-dxc', alt:[], name:'Dòng điện xoay chiều (CĐ)', chuong:null },
    { key:'cd2-yhoc', alt:[], name:'Vật lí trong y học (CĐ)', chuong:null },
    { key:'cd3-luongtu', alt:[], name:'Vật lí lượng tử (CĐ)', chuong:null }
  ];
  function realMasteryTopics(s){
    var m = (s && s.mastery) || {};
    var out = [];
    KPI_TOPICS.forEach(function(t){
      var keys = [t.key].concat(t.alt);
      for(var i = 0; i < keys.length; i++){
        if(m[keys[i]] != null && !isNaN(Number(m[keys[i]]))){
          out.push({ key: t.key, name: t.name, chuong: t.chuong, val: Math.round(Number(m[keys[i]])) });
          break;
        }
      }
    });
    return out.sort(function(a, b){ return a.val - b.val; });
  }
  // Số câu sai hiển thị: mistakeTotal (tổng thật, có từ 29/9/2026); dữ liệu
  // cũ chỉ có mistakeCount bị cắt ở 15 -> hiện "≥15" cho khỏi hiểu nhầm.
  function mistakeLabel(s){
    if(!s) return 0;
    if(s.mistakeTotal != null) return Number(s.mistakeTotal) || 0;
    var c = Number(s.mistakeCount) || 0;
    return c >= 15 ? '≥15' : c;
  }

  function calculateStudentKPIs(s){
    s = s || {};
    // completed: TỔNG số lượt nộp bài thật (mọi loại — Kiểm tra đầu vào,
    // Drill, Thi thử, Luyện thích ứng, Đề được giao...) — do trang luyện tập
    // tự tính và đẩy lên student_stats.completedExamsCount sau mỗi lần nộp
    // bài (xem computeStudentStatsFromAttempts trong prepscholar.js).
    var completed = Number(s.completedExamsCount) || 0;

    // Hoàn thành: % số ĐỀ ĐƯỢC GIAO (qua "Giao đề cá nhân hóa" trong admin)
    // mà học sinh đã làm xong — thay cho "mục tiêu 20 đề" bịa trước đây.
    // Chỉ có ý nghĩa khi thầy đã giao ít nhất 1 đề; chưa giao thì hiện thật
    // "Chưa giao đề" thay vì suy ra %.
    var assignedTotal = Number(s.assignedExamsCount) || 0;
    var assignedCompleted = Number(s.assignedExamsCompletedCount) || 0;
    var hasAssigned = assignedTotal > 0;
    var completionRate = hasAssigned ? Math.min(100, Math.round((assignedCompleted / assignedTotal) * 100)) : 0;

    var avg = Number(s.averageScore) || 0;
    var highest = Number(s.highestScore) || 0;
    var target = Number(s.targetScore) || 9.0;
    var targetProgress = target > 0 ? Math.min(100, Math.round((avg / target) * 100)) : 0;

    var predicted = s.predictedScore !== undefined && s.predictedScore !== null
      ? Number(s.predictedScore)
      : (avg > 0 ? Math.min(10, Math.round(((avg * 0.95) + 0.3) * 10) / 10) : 7.0);

    var rating = 'Chưa có dữ liệu';
    if(completed > 0 || avg > 0){
      if(avg >= 8.5) rating = 'Xuất sắc (Mục tiêu 9+)';
      else if(avg >= 7.5) rating = 'Giỏi (Vững vàng)';
      else if(avg >= 6.5) rating = 'Khá (Cần tăng tốc)';
      else if(avg >= 5.0) rating = 'Trung bình (Cần phụ đạo)';
      else rating = 'Yếu (Cảnh báo học tập)';
    } else {
      rating = 'Mới nhập học';
    }

    // SỬA 29/9/2026: CHỈ xét chuyên đề có số liệu THẬT. Bản trước gán số giả
    // định cho chương chưa làm (Nhiệt 75, Khí 65, Từ trường 60, Hạt nhân 45)
    // nên em nào chưa làm câu hạt nhân nào cũng bị báo "yếu nhất: Vật lí hạt
    // nhân (45%)". Chưa có số liệu thật -> "Chưa xác định".
    var weakTopic = 'Chưa xác định';
    var realTopics = realMasteryTopics(s);
    if(realTopics.length){
      weakTopic = realTopics[0].name + ' (' + realTopics[0].val + '%)';
    }

    var mistakes = mistakeLabel(s);

    return {
      completed: completed,
      assignedTotal: assignedTotal,
      assignedCompleted: assignedCompleted,
      hasAssigned: hasAssigned,
      totalAssigned: assignedTotal, // giữ tên trường cũ cho các chỗ còn tham chiếu (CSV, tổng hợp lớp)
      completionRate: completionRate,
      completionRatePct: hasAssigned ? (completionRate + '%') : 'Chưa giao đề',
      completionBarPct: completionRate + '%', // luôn là số hợp lệ để làm CSS width (0% khi chưa giao đề)
      avgScore: avg.toFixed(1),
      highestScore: highest.toFixed(1),
      targetScore: target.toFixed(1),
      predictedScore: predicted.toFixed(1),
      targetProgressPct: targetProgress + '%',
      rating: rating,
      weakTopic: weakTopic,
      mistakes: mistakes
    };
  }

  function renderClassSummaryCard(students){
    students = students || [];
    var totalStudents = students.length;
    var activeStudents = students.filter(function(s){ return s.status === 'active'; }).length;

    // Điểm TB lớp / Điểm cao nhất khóa: chỉ tính trên các em ĐÃ TỪNG làm bài
    // thật (completedExamsCount > 0) — chưa ai làm bài thì hiện "—" trung
    // thực, không hiện 0.0 (dễ hiểu nhầm là điểm liệt).
    var practiced = students.filter(function(s){ return (Number(s.completedExamsCount) || 0) > 0; });
    var sumAvgScore = practiced.reduce(function(acc, s){ return acc + (Number(s.averageScore) || 0); }, 0);
    var avgClassScore = practiced.length > 0 ? (sumAvgScore / practiced.length).toFixed(1) : null;

    var maxScore = students.reduce(function(max, s){ return Math.max(max, Number(s.highestScore) || 0); }, 0);
    var highestClassScore = maxScore > 0 ? maxScore.toFixed(1) : null;

    // Hoàn thành: tổng số đề được giao đã hoàn thành / tổng số đề được giao
    // (tính năng "Giao đề cá nhân hóa") — không còn mục tiêu 20 đề/em bịa ra.
    var totalAssignedClass = students.reduce(function(acc, s){ return acc + (Number(s.assignedExamsCount) || 0); }, 0);
    var totalAssignedCompletedClass = students.reduce(function(acc, s){ return acc + (Number(s.assignedExamsCompletedCount) || 0); }, 0);
    var avgCompletionRate = totalAssignedClass > 0 ? Math.min(100, Math.round((totalAssignedCompletedClass / totalAssignedClass) * 100)) : null;

    var sumTarget = students.reduce(function(acc, s){ return acc + (Number(s.targetScore) || 9.0); }, 0);
    var avgTarget = totalStudents > 0 ? (sumTarget / totalStudents).toFixed(1) : '9.0';

    return h('div',{id:'student-class-summary-card', className:'sm-summary-card'},
      h('div',{className:'sm-summary-head'},
        h('div',{className:'sm-summary-title'},
          h('span',null,'📊 Tổng quan chỉ số lớp học')
        ),
        h('span',{className:'sm-summary-badge'}, totalStudents + ' học sinh')
      ),
      h('div',{className:'sm-summary-grid'},
        h('div',{id:'metric-active-students', className:'sm-summary-item'},
          h('div',{className:'sm-summary-label'}, 'Học sinh đang học'),
          h('div',{className:'sm-summary-val', style:{color:'var(--ink)'}}, activeStudents + ' / ' + totalStudents),
          h('div',{className:'sm-summary-sub'}, 'Đang kích hoạt tài khoản học tập')
        ),
        h('div',{id:'metric-avg-score', className:'sm-summary-item'},
          h('div',{className:'sm-summary-label'}, 'Điểm trung bình lớp'),
          h('div',{className:'sm-summary-val', style:{color:'var(--accent-strong)'}}, avgClassScore != null ? avgClassScore : '—'),
          h('div',{className:'sm-summary-sub'}, avgClassScore != null ? ('Mục tiêu trung bình: ' + avgTarget + '+') : 'Chưa có em nào làm bài')
        ),
        h('div',{id:'metric-completion-rate', className:'sm-summary-item'},
          h('div',{className:'sm-summary-label'}, 'Tỷ lệ hoàn thành đề đã giao'),
          h('div',{className:'sm-summary-val', style:{color:'var(--accent)'}}, avgCompletionRate != null ? (avgCompletionRate + '%') : '—'),
          h('div',{style:{display:'flex', alignItems:'center', gap:6, marginTop:4}},
            h('div',{style:{width:48, height:5, background:'var(--line)', borderRadius:3, overflow:'hidden', display:'inline-block'}},
              h('div',{style:{height:'100%', width:(avgCompletionRate || 0) + '%', background:'var(--accent)'}})
            ),
            h('span',{className:'sm-summary-sub', style:{marginTop:0}}, totalAssignedClass > 0 ? (totalAssignedCompletedClass + '/' + totalAssignedClass + ' đề') : 'Chưa giao đề nào')
          )
        ),
        h('div',{id:'metric-top-score', className:'sm-summary-item'},
          h('div',{className:'sm-summary-label'}, 'Điểm cao nhất khóa'),

        )

  // ============= Biểu đồ điểm số (lịch sử làm bài) =============
  // THÊM 24/9/2026: biểu đồ đường đơn giản (1 chuỗi số liệu — không cần chú
  // giải màu, chỉ cần tiêu đề) vẽ điểm scaledScore10 theo thời gian, dùng
  // trong hồ sơ học sinh (StudentsPanel). SVG viewBox cố định, scale tuyến
  // tính 0-10 theo trục Y; điểm dữ liệu có hover để xem chính xác điểm/ngày
  // (đúng tinh thần "luôn có lớp hover" của biểu đồ HTML/SVG). Nếu < 2 điểm
  // dữ liệu thì không đủ để vẽ đường — hiện thông báo thay vì 1 chấm lẻ loi.
  function ScoreHistoryChart(props){
    var points = props.points || []; // [{label, score, date}], đã sắp CŨ -> MỚI
    var hoverState = React.useState(null); var hoverIdx = hoverState[0], setHoverIdx = hoverState[1];
    if(points.length < 2){
      return h('p', { style: { color: 'var(--muted)', fontSize: '0.8rem', textAlign: 'center', padding: '18px 0' } },
        'Cần ít nhất 2 lượt làm bài đã chấm điểm để vẽ biểu đồ xu hướng.');
    }
    var W = 560, H = 170, padL = 30, padR = 14, padT = 14, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = points.length;
    function xAt(i){ return padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1)); }
    function yAt(score){ return padT + plotH - (Math.max(0, Math.min(10, score)) / 10) * plotH; }
    var pathD = points.map(function(p, i){ return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ',' + yAt(p.score).toFixed(1); }).join(' ');
    var gridYs = [0, 2.5, 5, 7.5, 10];
    var hovered = hoverIdx != null ? points[hoverIdx] : null;
    return h('div', { style: { position: 'relative' } },
      h('svg', { viewBox: '0 0 ' + W + ' ' + H, style: { width: '100%', height: 'auto', display: 'block', overflow: 'visible' } },
        // Lưới ngang mờ (recessive grid) + nhãn trục Y
        gridYs.map(function(gy){
          var y = yAt(gy);
          return h('g', { key: gy },
            h('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: 'var(--line)', strokeWidth: 1, opacity: 0.6 }),
            h('text', { x: padL - 6, y: y + 3, fontSize: 8, textAnchor: 'end', fill: 'var(--muted)' }, gy.toFixed(gy % 1 ? 1 : 0))
          );
        }),
        // Đường điểm số — nét mảnh 2px, đầu bo tròn theo mark spec
        h('path', { d: pathD, fill: 'none', stroke: 'var(--accent-strong)', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }),
        // Vùng tô nhạt dưới đường để dễ đọc xu hướng
        h('path', {
          d: pathD + ' L' + xAt(n - 1).toFixed(1) + ',' + (padT + plotH) + ' L' + xAt(0).toFixed(1) + ',' + (padT + plotH) + ' Z',
          fill: 'color-mix(in srgb, var(--accent) 12%, transparent)',
          stroke: 'none'
        }),
        // Điểm dữ liệu + vùng bắt hover (hit target lớn hơn chấm thật)
        points.map(function(p, i){
          var cx = xAt(i), cy = yAt(p.score);
          return h('g', { key: i },
            h('circle', { cx: cx, cy: cy, r: hoverIdx === i ? 4.5 : 3, fill: 'var(--accent-strong)', stroke: 'var(--surface)', strokeWidth: 1.5 }),
            h('rect', {
              x: cx - (plotW / n) / 2, y: padT, width: Math.max(6, plotW / n), height: plotH,
              fill: 'transparent',
              onMouseEnter: function(){ setHoverIdx(i); },
              onMouseLeave: function(){ setHoverIdx(function(cur){ return cur === i ? null : cur; }); }
            })
          );
        }),
        // Nhãn trực tiếp cho điểm đầu/cuối (selective direct labels)
        h('text', { x: xAt(0), y: yAt(points[0].score) - 8, fontSize: 8, textAnchor: 'start', fill: 'var(--ink-2)' }, points[0].score.toFixed(1)),
        h('text', { x: xAt(n - 1), y: yAt(points[n - 1].score) - 8, fontSize: 8, textAnchor: 'end', fill: 'var(--accent-strong)', fontWeight: 700 }, points[n - 1].score.toFixed(1))
      ),
      hovered ? h('div', {
        style: {
          position: 'absolute', left: (xAt(hoverIdx) / W * 100) + '%', top: 0, transform: 'translate(-50%, -100%)',
          background: 'var(--ink)', color: 'var(--surface)', fontSize: '0.72rem', padding: '4px 8px', borderRadius: '6px',
          whiteSpace: 'nowrap', pointerEvents: 'none', marginTop: '-6px', zIndex: 2
        }
      }, hovered.label + ' · ' + hovered.score.toFixed(2) + '/10') : null
    );
  }

  // ============================================================================
  // THÊM 4/10/2026 — XEM LẠI BÀI LÀM CỦA HỌC SINH (trang admin).
  // Giống màn "Phân tích chi tiết từng câu" mà em thấy sau khi nộp bài: từng câu, đáp án em đã chọn,
  // đáp án đúng, đúng/sai, lời giải. Dữ liệu lấy từ:
  //  - students/{id}/attempts: answers (đáp án em chọn, khoá theo mã câu "examId_qN"), rightQuestions /
  //    wrongQuestions (mã câu + kết quả lúc nộp);
  //  - đề gốc trong "de_thi" (nội dung câu, phương án, lời giải) — tải theo examId và nhớ lại (cache).
  // Lượt làm trước 24/9/2026 không có "answers": vẫn liệt kê câu đúng/sai nhưng báo rõ không có đáp án em chọn.
  // Câu đã bị xoá khỏi ngân hàng: hiện mã câu + kết quả đã lưu.
  // ============================================================================
  var examDocCache = {};
  function loadExamCached(examId){
    if(!examDocCache[examId]){
      var OPCref = window.OPC;
      examDocCache[examId] = (OPCref && OPCref.examBank)
        ? OPCref.examBank.getExam(examId).catch(function(e){ console.warn('Lỗi tải đề ' + examId + ':', e); delete examDocCache[examId]; return undefined; })
        : Promise.resolve(undefined);
    }
    return examDocCache[examId];
  }
  function hvSplitQid(id){
    var i = String(id).lastIndexOf('_q');
    if(i < 0) return null;
    return { examId: String(id).slice(0, i), index: Number(String(id).slice(i + 2)) };
  }
  function hvNormImg(name){ return String(name || '').trim().toLowerCase().replace(/^.*[\\/]/, '').replace(/\.[a-z0-9]+$/i, ''); }
  function hvImagesFor(names, exam){
    if(!names || !names.length || !exam || !exam.images) return [];
    var out = [];
    names.forEach(function(n){
      var key = hvNormImg(n);
      var f = exam.images.filter(function(im){ return hvNormImg(im.name) === key; })[0];
      var url = f ? (f.url || f.dataUrl) : '';
      if(url) out.push({ name: n, url: url });
    });
    return out;
  }
  function hvPartOf(q){ return q.type === 'choiceTF' ? 'II' : (q.type === 'shortans' ? 'III' : 'I'); }

  function hvBuildRows(attempt, exams){
    var answers = (attempt.answers && typeof attempt.answers === 'object') ? attempt.answers : {};

    Object.keys(answers).forEach(function(k){ ids[k] = 1; });
    (attempt.rightQuestions || []).forEach(function(r){ if(r && r.qId){ ids[r.qId] = 1; rightSet[r.qId] = 1; } });
    (attempt.wrongQuestions || []).forEach(function(r){ if(r && r.qId){ ids[r.qId] = 1; wrongSet[r.qId] = 1; } });
    var rows = Object.keys(ids).map(function(id){
      var sp = hvSplitQid(id);
      var exam = sp ? exams[sp.examId] : undefined;
      var q = (exam && exam.questions) ? exam.questions.filter(function(x){ return Number(x.index) === sp.index; })[0] : null;
      var ua = answers[id];
      var row = { id: id, examId: sp ? sp.examId : '', index: sp ? sp.index : 0, exam: exam, q: q || null, ua: ua, hasAnswers: attempt.answers != null };
      var stored = rightSet[id] ? 'ok' : (wrongSet[id] ? 'bad' : null);
      if(!q){ row.status = stored || 'bad'; row.missing = (exam === null) ? 'deleted' : (exam === undefined ? 'error' : 'noq'); return row; }
      row.part = hvPartOf(q);
      var computed = false, blank = false;
      if(row.part === 'I'){
        var correct = (q.options || []).filter(function(o){ return o.isTrue; })[0];
        row.correctKey = correct ? correct.key : null;
        blank = (ua === undefined || ua === '' || ua === 'Chưa chọn');
        computed = !blank && ua === row.correctKey;
      } else if(row.part === 'II'){
        var sts = q.options || [];
        var matched = 0;
        sts.forEach(function(st){ if(ua && ua[st.key] === !!st.isTrue) matched++; });
        row.matched = matched; row.total = sts.length;
        blank = !ua || !Object.keys(ua).length;
        computed = sts.length > 0 && matched === sts.length;
      } else {
        var pa = parseShortAnswer(q.shortans);
        row.correctValue = pa ? pa.value : null;
        blank = (ua === undefined || ua === null || String(ua).trim() === '');
        if(!blank && pa){
          var num = Number(String(ua).trim().replace(',', '.'));
          var tol = 0.5 * Math.pow(10, -pa.decimals) * Math.pow(10, pa.exp) + 1e-9;
          computed = !isNaN(num) && Math.abs(num - pa.value) <= tol;
        }

      row.blank = blank;
      row.status = blank ? 'blank' : ((stored || (computed ? 'ok' : 'bad')));

    // lượt cũ không có -> sắp theo đề gốc (Firestore không giữ thứ tự khoá của "answers").
    var order = Array.isArray(attempt.questionIds) ? attempt.questionIds : null;
    if(order){
      var pos = {}; order.forEach(function(id, i){ pos[id] = i; });
      rows.sort(function(a, b){

    } else {
      rows.sort(function(a, b){ return a.examId < b.examId ? -1 : (a.examId > b.examId ? 1 : a.index - b.index); });
    }
    return rows;
  }

    function handleCSVFile(file){
      if(!file) return;
      var fName = (file.name || '').toLowerCase();
      if(!fName.endsWith('.csv') && !fName.endsWith('.txt') && !file.type.includes('csv') && !file.type.includes('text')){
        props.fireToast('Vui lòng chọn file định dạng .csv hoặc .txt', true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e){
        var content = e.target.result;
        var parsedRows = parseCSV(content);
        if(!parsedRows || parsedRows.length < 1){
          props.fireToast('File CSV không có nội dung hợp lệ.', true);
          setImportData(null);
          return;
        }

        var headerRow = parsedRows[0];
        var headerInfo = detectStudentCSVHeaders(headerRow);
        var startIdx = 1;
        if(headerInfo.isFallback && headerRow.some(function(c){ return (c||'').indexOf('@') > -1; })){
          startIdx = 0;
        }

        var existingEmailSet = new Set();
        students.forEach(function(s){
          if(s.email) existingEmailSet.add(s.email.toLowerCase().trim());
        });

        var batchEmailSet = new Set();
        var evaluatedRows = [];
        var validCount = 0;
        var warnCount = 0;
        var errCount = 0;

        for(var i = startIdx; i < parsedRows.length; i++){
          var row = parsedRows[i];
          if(!row || !row.length || (row.length === 1 && !row[0].trim())) continue;
          var raw = mapStudentCSVRow(row, headerInfo.map);
          var evaluated = validateStudentRow(raw, existingEmailSet, batchEmailSet);
          evaluated.lineNum = i + 1;
          evaluatedRows.push(evaluated);
          if(evaluated.status === 'valid'){
            validCount++;
            if(raw.email) batchEmailSet.add(raw.email.toLowerCase().trim());
          } else if(evaluated.status === 'warning'){
            warnCount++;
          } else {
            errCount++;
          }
        }

        if(!evaluatedRows.length){
          props.fireToast('Không tìm thấy dòng học sinh nào trong file.', true);
          setImportData(null);
          return;
        }

        setImportData({
          fileName: file.name,
          fileSize: (file.size / 1024).toFixed(1) + ' KB',
          rows: evaluatedRows,
          validCount: validCount,
          warnCount: warnCount,
          errCount: errCount,
          totalCount: evaluatedRows.length
        });
      };
      reader.onerror = function(){
        props.fireToast('Không đọc được tệp — vui lòng thử lại.', true);
      };
      reader.readAsText(file, 'utf-8');
    }

    function executeBulkImport(){
      if(!importData || !importData.rows.length) return;
      var toImport = importData.rows.filter(function(r){
        if(r.status === 'valid') return true;

        return false;
      }).map(function(r){ return r.student; });

      if(!toImport.length){
        props.fireToast('Không có học sinh hợp lệ nào để nhập.', true);
        return;
      }

      setImporting(true);
      setImportProgress(0);

      var total = toImport.length;
      var success = 0;
      var failed = 0;

      var p = Promise.resolve();
      toImport.forEach(function(stu, idx){
        p = p.then(function(){
          return OPCref.students.add(stu).then(function(){
            success++;
            setImportProgress(Math.round(((idx + 1) / total) * 100));
          }).catch(function(err){
            console.error('Lỗi khi thêm học sinh ' + stu.name, err);
            failed++;
          });
        });
      });

      p.then(function(){
        setImporting(false);
        setImportOpen(false);
        setImportData(null);
        if(failed === 0){
          props.fireToast('Đã nhập thành công ' + success + ' học sinh từ file CSV!');
        } else {
          props.fireToast('Đã nhập ' + success + ' học sinh, lỗi ' + failed + ' học sinh.', true);
        }
      });
    }

      var unsub = OPCref.studentStats.subscribe(function(snap){
        var map = {};
        snap.docs.forEach(function(d){ map[d.id] = d.data() || {}; });
        setStatsById(map);
      }, function(){});
      return function(){ unsub(); };
    }, []);

    // THÊM 29/9/2026 — mẫu tin nhắn Zalo + cấu hình chương đang mở.
    var tplState = React.useState(null); var tpl = tplState[0], setTpl = tplState[1];
    var tplDraftState = React.useState(null); var tplDraft = tplDraftState[0], setTplDraft = tplDraftState[1];
    var tplOpenState = React.useState(false); var tplOpen = tplOpenState[0], setTplOpen = tplOpenState[1];
    var tplSavingState = React.useState(false); var tplSaving = tplSavingState[0], setTplSaving = tplSavingState[1];
    var repCurState = React.useState(null); var repCur = repCurState[0], setRepCur = repCurState[1];
    React.useEffect(function(){
      if(!OPCref.reportTemplate) return;
      var unsub = OPCref.reportTemplate.subscribe(function(data){ setTpl(data); }, function(err){ console.error('Lỗi tải mẫu báo cáo:', err); });
      return function(){ unsub(); };
    }, []);
    React.useEffect(function(){
      if(!OPCref.curriculum) return;
      var unsub = OPCref.curriculum.subscribe(function(data){ setRepCur(data); }, function(err){ console.error(err); });
      return function(){ unsub(); };
    }, []);
    var tplHeader = (tpl && tpl.header != null) ? tpl.header : DEFAULT_REPORT_HEADER;
    var tplFooter = (tpl && tpl.footer != null) ? tpl.footer : DEFAULT_REPORT_FOOTER;

    var activeStudents = students.filter(function(s){ return s.status === 'active'; }).map(function(s){
      var st = statsById[s.id] || {};
      return Object.assign({}, s, {
        mastery: st.mastery || s.mastery || {},
        // nanoMastery: THÊM 25/9/2026 — mastery thật theo nano-point (xem
        // buildPromptData bên dưới), trước đây panel này không đọc field
        // này nên báo cáo AI luôn chỉ nêu được mức chuyên đề chung chung.
        nanoMastery: st.nanoMastery || s.nanoMastery,
        predicted: st.predicted != null ? st.predicted : s.predictedScore,
        averageScore: st.averageScore != null ? st.averageScore : s.averageScore,
        recentTrend: st.recentTrend, recentAvgScore: st.recentAvgScore, priorAvgScore: st.priorAvgScore,
        assignedExamsCount: st.assignedExamsCount, assignedExamsCompletedCount: st.assignedExamsCompletedCount,
        mistakeCount: st.mistakeCount, mistakeTotal: st.mistakeTotal
      });
    });

    function isStale(s){
      if(!s.lastParentReportSentAt) return true;
      var d = new Date(s.lastParentReportSentAt);
      if(isNaN(d.getTime())) return true;
      return (Date.now() - d.getTime()) > REPORT_STALE_DAYS * 86400000;
    }
    var staleStudents = activeStudents.filter(isStale);

    // Bản nháp AI đang mở (chưa lưu Firestore cho tới khi bấm "Đánh dấu đã
    // gửi") — key theo studentId. bulkBusy: đang chạy vòng tạo hàng loạt.
    var draftsState = React.useState({}); var drafts = draftsState[0], setDrafts = draftsState[1]; // {id: {text, loading, error}}
    var bulkBusyState = React.useState(false); var bulkBusy = bulkBusyState[0], setBulkBusy = bulkBusyState[1];
    var reviewIdState = React.useState(null); var reviewId = reviewIdState[0], setReviewId = reviewIdState[1];
    var sendingState = React.useState(false); var sending = sendingState[0], setSending = sendingState[1];

    // SỬA 25/9/2026: điểm mạnh/yếu ưu tiên lấy theo NANO-POINT (đơn vị kiến
    // thức nhỏ nhất, vd "Bài toán bình kín rò rỉ hoặc bơm thêm khí") thay vì
    // chỉ nêu tên cả chuyên đề chung chung (vd "Khí lí tưởng") khi đã có đủ
    // dữ liệu — giúp báo cáo AI cho phụ huynh cụ thể, hữu ích hơn nhiều mà
    // KHÔNG cần sửa gì ở api/ai-parent-report.js: tên nano-point trong
    // nano-map.js vốn đã là câu mô tả tự nhiên, không dùng mã/thuật ngữ kỹ
    // thuật, nên khớp thẳng với field "name" mà endpoint AI đang mong đợi
    // (xem SYSTEM_INSTRUCTION trong file đó — cấm dùng thuật ngữ nội bộ).
    // Học sinh mới học (chưa đủ 3 nano-point từng kiểm tra) vẫn dùng lại
    // mức chuyên đề như cũ, tránh AI viết báo cáo dựa trên quá ít dữ liệu.
    // SỬA 29/9/2026:
    //  (1) Chỉ nêu phần kiến thức thuộc chương ĐANG MỞ với em (hoặc chuyên
    //      đề) — không báo phụ huynh "em yếu Từ trường" khi lớp chưa học.
    //  (2) Thêm số liệu THẬT CỦA 7 NGÀY QUA (số bài, điểm TB tuần) từ lịch sử
    //      làm bài — bản trước ghi "7 ngày qua" nhưng gửi số liệu cộng dồn.
    //  (3) Số câu sai dùng tổng thật (mistakeTotal), không phải số bị cắt 15.
    function buildPromptData(s, week){
      var CUR = window.OPC_CURRICULUM;
      var unlocked = CUR ? CUR.getUnlockedChapters(s, repCur) : [1, 2, 3, 4];
      function chuongOfTopic(key){ return CUR && CUR.TOPIC_TO_CHUONG[key] ? CUR.TOPIC_TO_CHUONG[key] : null; }
      function topicAllowed(key){ var c = chuongOfTopic(key); return c == null || unlocked.indexOf(c) > -1; }

      var mastery = s.mastery || {};
      var topics = Object.keys(CHU_DE_LABEL).filter(function(k){ return mastery[k] != null && topicAllowed(k); })
        .map(function(k){ return { name: CHU_DE_LABEL[k], pct: Math.round(mastery[k]) }; })
        .sort(function(a, b){ return b.pct - a.pct; });

      var nanoRows = [];
      if(window.OPC_NANO && s.nanoMastery){
        nanoRows = Object.keys(s.nanoMastery)
          .filter(function(id){ return typeof s.nanoMastery[id] === 'number'; })
          .map(function(id){
            var nano = window.OPC_NANO.getNano(id);
            if(!nano) return null;
            var bai = window.OPC_NANO.getBai(nano.baiKey);
            if(bai && !topicAllowed(bai.chuDeKey)) return null;
            return { name: nano.name, pct: Math.round(s.nanoMastery[id]) };
          })
          .filter(Boolean)
          .sort(function(a, b){ return b.pct - a.pct; });
      }

      var strong, weak;
      if(nanoRows.length >= 3){
        strong = nanoRows.slice(0, 2).filter(function(t){ return t.pct >= 65; });
        weak = nanoRows.slice(-2).filter(function(t){ return t.pct < 65; });
      } else {
        strong = topics.slice(0, 1).filter(function(t){ return t.pct >= 65; });
        weak = topics.slice(-2).filter(function(t){ return t.pct < 65; });
      }
      var mistakes = s.mistakeTotal != null ? Number(s.mistakeTotal) : (s.mistakeCount != null ? Number(s.mistakeCount) : null);
      return {
        studentName: s.name,
        periodLabel: week ? week.label : '7 ngày qua',
        completedInPeriod: week ? week.count : null,
        periodAvgScore: week && week.avg != null ? week.avg : null,
        averageScore: s.averageScore != null ? Number(Number(s.averageScore).toFixed(2)) : null,
        recentAvgScore: s.recentAvgScore != null ? Number(Number(s.recentAvgScore).toFixed(2)) : null,
        priorAvgScore: s.priorAvgScore != null ? Number(Number(s.priorAvgScore).toFixed(2)) : null,
        recentTrend: s.recentTrend || null,
        predicted: s.predicted != null ? Number(s.predicted) : null,
        target: s.targetScore != null ? Number(s.targetScore) : null,
        strongTopics: strong,
        weakTopics: weak,
        assignedTotal: s.assignedExamsCount || null,
        assignedCompleted: s.assignedExamsCompletedCount || null,
        mistakeCount: mistakes
      };
    }

    // Số liệu 7 ngày qua từ lịch sử làm bài thật (100 lượt gần nhất).
    function fmtDM(d){ return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
    async function loadWeek(s){
      var end = new Date(), start = new Date(Date.now() - 6 * 86400000);
      var out = { label: 'tuần ' + fmtDM(start) + ' – ' + fmtDM(end), from: fmtDM(start), to: fmtDM(end), count: 0, avg: null };
      try{
        var list = await OPCref.attempts.loadForStudent(s.id);
        var since = Date.now() - 7 * 86400000;
        var inWeek = list.filter(function(a){
          var t = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt).getTime();
          return !isNaN(t) && t >= since;
        });
        out.count = inWeek.length;
        var scores = inWeek.map(function(a){ return Number(a.scaledScore10); }).filter(function(v){ return !isNaN(v); });
        if(scores.length) out.avg = Math.round(scores.reduce(function(x, y){ return x + y; }, 0) / scores.length * 100) / 100;
      }catch(e){
        console.error('Lỗi tải lịch sử làm bài (báo cáo phụ huynh):', e);
        out.count = null; // không rõ — không nói bừa với phụ huynh
      }
      return out;
    }

    // Ghép mẫu tin nhắn: {ten} {tuNgay} {denNgay} {soBai} {diemTB}
    function fillTemplate(text, s, week){
      var avg = week && week.avg != null ? String(week.avg.toFixed ? week.avg.toFixed(1) : week.avg).replace('.', ',') + '/10' : 'chưa có';
      return String(text || '')
        .replace(/\{ten\}/g, s.name || '')
        .replace(/\{tuNgay\}/g, week ? week.from : '')
        .replace(/\{denNgay\}/g, week ? week.to : '')
        .replace(/\{soBai\}/g, week && week.count != null ? String(week.count) : '—')
        .replace(/\{diemTB\}/g, avg);
    }
    function composeMessage(body, s, week){
      var parts = [];
      var hd = fillTemplate(tplHeader, s, week).trim(); if(hd) parts.push(hd);
      parts.push(String(body || '').trim());
      var ft = fillTemplate(tplFooter, s, week).trim(); if(ft) parts.push(ft);
      return parts.join('\n\n');
    }

    async function generateFor(s){
      setDrafts(function(prev){ var next = Object.assign({}, prev); next[s.id] = { text: (prev[s.id] && prev[s.id].text) || null, loading: true, error: null }; return next; });
      var week = await loadWeek(s);
      return fetch('/api/ai-parent-report', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildPromptData(s, week))
      }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          setDrafts(function(prev){
            var next = Object.assign({}, prev);
            if(result.ok && result.data && result.data.report){
              next[s.id] = { text: composeMessage(result.data.report, s, week), loading: false, error: null };
            } else {
              next[s.id] = { text: null, loading: false, error: (result.data && result.data.error) || 'FaradayAI đang bận, thử lại sau.' };
            }
            return next;
          });
          return result;
        }).catch(function(){
          setDrafts(function(prev){ var next = Object.assign({}, prev); next[s.id] = { text: null, loading: false, error: 'Không kết nối được tới FaradayAI.' }; return next; });
        });
    }

    function handleSaveTemplate(){
      if(!tplDraft) return;
      setTplSaving(true);
      OPCref.reportTemplate.save({ header: tplDraft.header, footer: tplDraft.footer }).then(function(){
        props.fireToast('Đã lưu mẫu tin nhắn — áp dụng cho các báo cáo tạo từ bây giờ.');
        setTplOpen(false);
      }).catch(function(err){
        props.fireToast('Lưu mẫu thất bại (' + (err && (err.code || err.message) || 'không rõ') + ').', true);
      }).finally(function(){ setTplSaving(false); });
    }

    function handleGenerateOne(s){
      generateFor(s).then(function(){ setReviewId(s.id); });
    }

    function handleGenerateAllMissing(){
      if(bulkBusy || !staleStudents.length) return;
      setBulkBusy(true);
      var p = Promise.resolve();
      staleStudents.forEach(function(s){
        p = p.then(function(){ return generateFor(s); });
      });
      p.finally(function(){ setBulkBusy(false); props.fireToast('Đã tạo xong báo cáo nháp cho ' + staleStudents.length + ' học sinh — xem & gửi từng em bên dưới.'); });
    }

    function handleMarkSent(s){
      var d = drafts[s.id];
      if(!d || !d.text) return;
      setSending(true);
      var nowIso = new Date().toISOString();
      OPCref.parentReports.save(s.id, null, { text: d.text, createdAt: nowIso, sentAt: nowIso, channel: 'zalo' })
        .then(function(){ return OPCref.students.update(s.id, { lastParentReportSentAt: nowIso }); })
        .then(function(){
          props.fireToast('Đã đánh dấu đã gửi báo cáo cho ' + s.name + '.');
          setDrafts(function(prev){ var next = Object.assign({}, prev); delete next[s.id]; return next; });
          setReviewId(null);
        }).catch(function(err){
          console.error('Lỗi lưu báo cáo phụ huynh:', err);
          props.fireToast('Không lưu được — thử lại.', true);
        }).finally(function(){ setSending(false); });
    }

    var reviewStudent = reviewId ? activeStudents.filter(function(s){ return s.id === reviewId; })[0] : null;
    var reviewDraft = reviewId ? drafts[reviewId] : null;

    var reviewModal = !reviewStudent ? null : h('div', { className: 'sm-overlay', onClick: function(e){ if(e.target === e.currentTarget) setReviewId(null); } },
      h('div', { className: 'sm-modal', style: { maxWidth: '540px' }, role: 'dialog', 'aria-modal': 'true' },
        h('div', { className: 'sm-modal-head' }, h('h3', null, '🦉 Báo cáo cho ' + reviewStudent.name),
          h('button', { type: 'button', className: 'sm-modal-close', onClick: function(){ setReviewId(null); } }, h(IconClose))),
        reviewDraft && reviewDraft.loading ? h('p', { style: { color: 'var(--muted)', fontSize: '0.85rem' } }, 'FaradayAI đang soạn báo cáo…') :
        reviewDraft && reviewDraft.error ? h('div', { className: 'banner warn' }, h('span', null, '⚠️'), h('div', null, reviewDraft.error)) :
        h('textarea', {
          value: (reviewDraft && reviewDraft.text) || '',
          onChange: function(e){ setDrafts(function(prev){ var next = Object.assign({}, prev); next[reviewStudent.id] = Object.assign({}, next[reviewStudent.id], { text: e.target.value }); return next; }); },
          rows: 10,
          style: { width: '100%', boxSizing: 'border-box', fontFamily: '"Be Vietnam Pro",sans-serif', fontSize: '0.88rem', lineHeight: 1.6, padding: '10px 12px', borderRadius: '10px', border: '1px solid var(--line)', resize: 'vertical' }
        }),
        h('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' } },
          h('button', { type: 'button', className: 'btn btn-secondary', disabled: reviewDraft && reviewDraft.loading, onClick: function(){ generateFor(reviewStudent); } }, '🔄 Tạo lại'),
          h('button', {
            type: 'button', className: 'btn btn-secondary',
            disabled: !reviewDraft || !reviewDraft.text,
            onClick: function(){ copyToClipboard(reviewDraft.text).then(function(){ props.fireToast('Đã sao chép — dán vào Zalo để gửi.'); }); }
          }, '📋 Sao chép'),
          h('button', {
            type: 'button', className: 'btn btn-secondary',
            disabled: !reviewStudent.parentPhone,
            onClick: function(){ window.open(zaloLink(reviewStudent.parentPhone), '_blank'); }
          }, '💬 Mở Zalo phụ huynh'),
          h('button', {
            type: 'button', className: 'btn btn-primary', style: { marginLeft: 'auto' },
            disabled: !reviewDraft || !reviewDraft.text || sending,
            onClick: function(){ handleMarkSent(reviewStudent); }
          }, sending ? 'Đang lưu…' : '✅ Đánh dấu đã gửi')
        )
      )
    );

    if(loading){ return h('div',{className:'card'}, h('p',{style:{color:'var(--ink-2)', fontSize:'0.9rem'}}, 'Đang tải dữ liệu học sinh…')); }

    return h('div', null,
      h('div', { className: 'card' },
        h('div', { className: 'sm-toolbar' },
          h('div', null, h('h3', null, '🦉 Báo cáo Phụ huynh — FaradayAI'),
            h('p', { className: 'sm-sub' }, 'AI soạn nháp từ dữ liệu luyện tập thật — thầy xem/sửa rồi Sao chép + gửi qua Zalo cá nhân.')),
          h('div', { className: 'sm-actions' },
            h('button', { type: 'button', className: 'btn btn-primary', disabled: bulkBusy || !staleStudents.length, onClick: handleGenerateAllMissing },
              bulkBusy ? 'Đang tạo…' : '🪄 Tạo báo cáo cho ' + staleStudents.length + ' học sinh còn thiếu'),
            h('button', { type: 'button', className: 'btn btn-secondary', onClick: function(){ setTplDraft({ header: tplHeader, footer: tplFooter }); setTplOpen(!tplOpen); } }, '✉️ Mẫu tin nhắn Zalo')
          )
        ),
        tplOpen && tplDraft ? h('div', { style: { marginTop: '14px', padding: '14px', border: '1px solid var(--line)', borderRadius: '12px', background: 'var(--surface-2)' } },
          h('div', { style: { fontWeight: 700, fontSize: '0.9rem' } }, '✉️ Mẫu tin nhắn Zalo (soạn 1 lần, dùng cho mọi báo cáo)'),
          h('p', { style: { fontSize: '0.78rem', color: 'var(--muted)', margin: '4px 0 10px' } },
            'Tin nhắn gửi đi = Phần mở đầu + nội dung AI soạn riêng cho từng em + Phần kết. Chỗ trống tự điền: {ten} tên học sinh · {tuNgay} {denNgay} khoảng ngày của tuần · {soBai} số bài em làm trong 7 ngày · {diemTB} điểm trung bình tuần.'),
          h('label', { style: { fontSize: '0.8rem', fontWeight: 600 } }, 'Phần mở đầu'),
          h('textarea', { rows: 4, value: tplDraft.header, onChange: function(e){ setTplDraft(Object.assign({}, tplDraft, { header: e.target.value })); },
            style: { width: '100%', boxSizing: 'border-box', margin: '4px 0 10px', padding: '8px 10px', borderRadius: '8px', border: '1px solid var(--line)', fontFamily: 'inherit', fontSize: '0.86rem' } }),
          h('label', { style: { fontSize: '0.8rem', fontWeight: 600 } }, 'Phần kết'),
          h('textarea', { rows: 3, value: tplDraft.footer, onChange: function(e){ setTplDraft(Object.assign({}, tplDraft, { footer: e.target.value })); },
            style: { width: '100%', boxSizing: 'border-box', margin: '4px 0 10px', padding: '8px 10px', borderRadius: '8px', border: '1px solid var(--line)', fontFamily: 'inherit', fontSize: '0.86rem' } }),
          h('div', { style: { display: 'flex', gap: '8px' } },
            h('button', { type: 'button', className: 'btn btn-primary', disabled: tplSaving, onClick: handleSaveTemplate }, tplSaving ? 'Đang lưu…' : '💾 Lưu mẫu'),
            h('button', { type: 'button', className: 'btn btn-secondary', onClick: function(){ setTplDraft({ header: DEFAULT_REPORT_HEADER, footer: DEFAULT_REPORT_FOOTER }); } }, 'Khôi phục mẫu gợi ý'),
            h('button', { type: 'button', className: 'btn btn-secondary', onClick: function(){ setTplOpen(false); } }, 'Đóng')
          )
        ) : null,
        staleStudents.length ? h('div', { className: 'sm-alert-banner leads' },
          h('div', { className: 'sm-alert-banner-head' },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
              h('span', { style: { fontSize: '1.2rem' } }, '📅'),
              h('div', null,
                h('div', { className: 'sm-alert-banner-title' }, staleStudents.length + '/' + activeStudents.length + ' học sinh chưa có báo cáo trong ' + REPORT_STALE_DAYS + ' ngày qua'),
                h('div', { className: 'sm-alert-banner-sub' }, 'Tự động nhắc mỗi lần mở trang này — bấm "Tạo báo cáo" ở trên hoặc từng dòng bên dưới.')
              )
            )
          )
        ) : h('div', { className: 'banner info', style: { marginTop: '16px' } }, h('span', null, '✅'), h('div', null, 'Cả lớp đều đã có báo cáo trong ' + REPORT_STALE_DAYS + ' ngày qua.')),

        h('div', { className: 'sm-table-wrap', style: { marginTop: '16px' } },
          h('table', { className: 'sm-table' },
            h('thead', null, h('tr', null, h('th', null, 'Học sinh'), h('th', null, 'Lần gửi gần nhất'), h('th', null, 'Trạng thái'), h('th', { style: { textAlign: 'right' } }, 'Hành động'))),
            h('tbody', null, activeStudents.map(function(s){
              var stale = isStale(s);
              var d = drafts[s.id];
              return h('tr', { key: s.id },
                h('td', null, h('div', { className: 'sm-student-cell' }, h('div', { className: 'sm-avatar' }, initials(s.name)), h('div', null, h('div', { className: 'sm-student-name' }, s.name)))),
                h('td', null, s.lastParentReportSentAt ? fmtDate(s.lastParentReportSentAt) : 'Chưa từng gửi'),
                h('td', null, stale ? h('span', { className: 'sm-assigned-pill pending' }, '🟠 Cần gửi') : h('span', { className: 'sm-assigned-pill done' }, '🟢 Mới gửi')),
                h('td', { style: { textAlign: 'right' } },
                  d && d.text ? h('button', { type: 'button', className: 'sm-link-btn', onClick: function(){ setReviewId(s.id); } }, '📝 Xem & Gửi') :
                  h('button', { type: 'button', className: 'sm-link-btn', disabled: d && d.loading, onClick: function(){ handleGenerateOne(s); } }, (d && d.loading) ? 'Đang tạo…' : '🪄 Tạo báo cáo AI')
                )
              );
            }))
          )
        )
      ),
      reviewModal
    );
  }

  // THÊM 5/10/2026 — dùng chung cho màn "Gắn nano-point cho câu đã nạp"
  function buildNanoCatalogPayloadGlobal(){
    var N = window.OPC_NANO;
    if(!N) return [];
    return N.CHU_DE.map(function(cd){
      return { chuDeKey: cd.key, chuDeName: cd.name, bai: N.getBaiByChuDe(cd.key).map(function(b){
        return { baiKey: b.key, baiName: b.name, nano: N.getNanoByBai(b.key).map(function(n){ return { id: n.id, name: n.name }; }) };
      }) };
    });
  }
  // Gọi AI gợi ý nano-point cho 1 câu đã lưu; trả {nanoIds, confidence, reason} hoặc ném lỗi có thông báo tiếng Việt
  async function fetchAiNano(q){
    var resp = await fetch('/api/ai-suggest-nano', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        stem: q.stem || q.raw || '', options: (q.options || []).map(function(o){ return o.key + '. ' + o.text; }),
        level: q.level, chuDeLon: q.chuDeLon, dangBai: q.dangBai,
        groupPassage: q.groupPassage || '', loigiai: q.loigiai || '',
        candidates: quickNanoSuggest(q).ids, catalog: buildNanoCatalogPayloadGlobal()
      })
    });
    var data = await resp.json().catch(function(){ return {}; });
    if(!resp.ok) throw new Error((data && data.error) || 'AI gợi ý thất bại — thử lại.');
    return data;
  }
  function plainPreview(text, n){
    var t = String(text || '').replace(/\\[a-zA-Z]+/g, ' ').replace(/[$_^{}\\]/g, ' ').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }
  function normStemKey(text){
    return String(text || '').toLowerCase().replace(/\\[a-zA-Z]+/g, ' ').replace(/[^a-z0-9àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]+/g, '').slice(0, 60);
  }
