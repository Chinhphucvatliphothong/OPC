  // THÊM 5/10/2026 — GẮN / GẮN LẠI NANO-POINT CHO CÂU ĐÃ NẠP (KHÔNG phải xoá đề rồi nạp lại).
  // Nano-point của mỗi câu nằm trong chính tài liệu đề ("questions[i].nanoPointIds"); màn này sửa đúng trường đó
  // bằng OPC.examBank.updateQuestions — hình ảnh, tex gốc, đáp án... không bị đụng. Lịch sử của học sinh được
  // tính lại theo nano-point MỚI (prepscholar.js tra thẻ hiện tại của câu theo mã câu).
  // Ba cách gắn: tay (chip + chọn thêm), gợi ý nhanh (khớp từ khoá, không AI), AI; hoặc đọc lại thẻ "% @nano:"
  // từ file .tex đã sửa (ghép câu theo nội dung đề, không theo thứ tự).
  // ============================================================================
  function NanoTaggerPanel(props){
    useNanoExtraSync();
    var N = window.OPC_NANO, OPCref = window.OPC;
    var examsState = React.useState([]); var exams = examsState[0], setExams = examsState[1];
    var examIdState = React.useState(''); var examId = examIdState[0], setExamId = examIdState[1];
    var onlyUntaggedState = React.useState(true); var onlyUntagged = onlyUntaggedState[0], setOnlyUntagged = onlyUntaggedState[1];
    var searchState = React.useState(''); var search = searchState[0], setSearch = searchState[1];
    var editsState = React.useState({}); var edits = editsState[0], setEdits = editsState[1];       // key -> {ids, conf, note}
    var busyState = React.useState(null); var busy = busyState[0], setBusy = busyState[1];            // 'save' | 'ai' | key
    var progState = React.useState(null); var prog = progState[0], setProg = progState[1];
    var syncState = React.useState(null); var sync = syncState[0], setSync = syncState[1];            // kết quả đọc .tex
    var stopRef = React.useRef(false);
    var shownLimitState = React.useState(60); var shownLimit = shownLimitState[0], setShownLimit = shownLimitState[1];

    React.useEffect(function(){
      if(!OPCref || !OPCref.examBank) return;
      var unsub = OPCref.examBank.subscribe(function(snap){
        setExams(snap.docs.map(function(d){ return Object.assign({}, d.data() || {}, { id: d.id }); }));
      }, function(err){ console.error('Lỗi tải ngân hàng đề (Gắn nano-point):', err); });
      return function(){ unsub(); };
    }, []);

    if(!N || !OPCref) return h('div', { className: 'card' }, h('p', null, 'Chưa tải được dữ liệu.'));

    function keyOf(eid, idx){ return eid + '|' + idx; }
    function curIds(exam, idx, q){
      var k = keyOf(exam.id, idx);
      return edits[k] ? edits[k].ids : ((q.nanoPointIds || []).slice());
    }
    // danh sách phẳng các câu (có kèm đề) sau khi lọc
    var all = [];
    exams.forEach(function(exam){
      if(examId && exam.id !== examId) return;
      (exam.questions || []).forEach(function(q, idx){ all.push({ exam: exam, q: q, idx: idx, key: keyOf(exam.id, idx) }); });
    });
    var totalQ = all.length;
    var taggedQ = all.filter(function(it){ return curIds(it.exam, it.idx, it.q).length > 0; }).length;
    var needle = search.trim().toLowerCase();
    var rows = all.filter(function(it){
      if(onlyUntagged && curIds(it.exam, it.idx, it.q).length > 0 && !edits[it.key]) return false;
      if(!needle) return true;
      return (plainPreview(it.q.stem, 400) + ' ' + (it.q.dangBai || '') + ' ' + (it.q.chuDeLon || '') + ' ' + (it.exam.title || '')).toLowerCase().indexOf(needle) > -1;
    });
    var shown = rows.slice(0, shownLimit);
    var dirtyKeys = Object.keys(edits);

    function setIds(it, ids, conf, note){
      setEdits(function(prev){
        var n = Object.assign({}, prev);
        var orig = (it.q.nanoPointIds || []).join(',');
        if(ids.join(',') === orig && !conf) delete n[it.key];
        else n[it.key] = { ids: ids, conf: conf || '', note: note || '' };
        return n;
      });
    }
    function toggleId(it, id){
      var ids = curIds(it.exam, it.idx, it.q).slice();
      var i = ids.indexOf(id);
      if(i > -1) ids.splice(i, 1); else ids.push(id);
      setIds(it, ids, '', '');
    }
    function quick(it, silent){
      var r = quickNanoSuggest(it.q);
      if(!r.ids.length){ if(!silent) props.fireToast('Gợi ý nhanh không thấy nano-point khớp — thử AI hoặc chọn tay.', true); return 'none'; }
      if(r.confidence === 'thấp'){ if(!silent) props.fireToast('Gợi ý nhanh chưa chắc (độ tin cậy thấp) nên chưa chọn sẵn.', true); return 'weak'; }
      setIds(it, r.ids, r.confidence, 'Khớp từ khoá');
      return 'ok';
    }
    function bulkQuick(){
      var ok = 0, weak = 0;
      shown.forEach(function(it){ if(curIds(it.exam, it.idx, it.q).length) return; var r = quick(it, true); if(r === 'ok') ok++; else weak++; });
      props.fireToast('Gợi ý nhanh: ' + ok + ' câu đã gợi ý' + (weak ? ', ' + weak + ' câu chưa chắc (để trống cho thầy chọn)' : '') + '. Bấm "Lưu thay đổi" để ghi.', !ok);
    }
    async function ai(it, silent){
      setBusy(it.key);
      try{
        var d = await fetchAiNano(it.q);
        setIds(it, d.nanoIds || [], d.confidence || '', d.reason || (d.nanoIds && d.nanoIds.length ? '' : 'AI không thấy nano-point nào khớp'));
        if(!silent) props.fireToast('AI đã gợi ý' + (d.confidence ? ' (độ tin cậy ' + d.confidence + ')' : '') + (d.reason ? ' — ' + d.reason : '') + '.');
        return true;
      }catch(err){ if(!silent) props.fireToast(err.message || 'AI gợi ý thất bại.', true); return false; }
      finally{ setBusy(null); }
    }
    async function bulkAi(){
      var targets = shown.filter(function(it){ return !curIds(it.exam, it.idx, it.q).length; });
      if(!targets.length){ props.fireToast('Không còn câu chưa gắn trong danh sách đang hiện.', true); return; }
      stopRef.current = false; setBusy('ai'); setProg({ done: 0, total: targets.length });
      var okN = 0, fails = 0;
      for(var i = 0; i < targets.length; i++){
        if(stopRef.current) break;
        var ok = await ai(targets[i], true);
        if(ok){ okN++; fails = 0; } else { fails++; if(fails >= 3){ props.fireToast('AI lỗi 3 lần liên tiếp — dừng. Kiểm tra mạng / khoá API rồi thử lại.', true); break; } }
        setProg({ done: i + 1, total: targets.length });
      }
      setBusy(null); setProg(null);
      props.fireToast('AI đã gợi ý ' + okN + '/' + targets.length + ' câu. Xem lại rồi bấm "Lưu thay đổi".', !okN);
    }
    function discard(){ if(!dirtyKeys.length) return; if(window.confirm('Bỏ ' + dirtyKeys.length + ' thay đổi chưa lưu?')) setEdits({}); }
    async function save(){
      if(!dirtyKeys.length) return;
      var byExam = {};
      dirtyKeys.forEach(function(k){ var p = k.split('|'); var idx = Number(p[p.length - 1]); var eid = p.slice(0, -1).join('|'); (byExam[eid] || (byExam[eid] = [])).push({ idx: idx, ids: edits[k].ids }); });
      setBusy('save');
      try{
        await Promise.all(Object.keys(byExam).map(function(eid){
          var exam = exams.filter(function(e){ return e.id === eid; })[0];
          if(!exam) return Promise.resolve();
          var qs = (exam.questions || []).slice();
          byExam[eid].forEach(function(c){
            var first = c.ids.length ? N.getNano(c.ids[0]) : null;
            qs[c.idx] = Object.assign({}, qs[c.idx], { nanoPointIds: c.ids, nanoBaiKey: first ? first.baiKey : (qs[c.idx].nanoBaiKey || '') });
          });
          return OPCref.examBank.updateQuestions(eid, qs);
        }));
        props.fireToast('Đã lưu nano-point cho ' + dirtyKeys.length + ' câu. Học sinh sẽ thấy khi tải lại trang.');
        setEdits({});
      }catch(err){ console.error('Lỗi lưu nano-point:', err); props.fireToast('Không lưu được — thử lại.', true); }
      finally{ setBusy(null); }
    }

    // ---- Đọc lại thẻ @nano từ file .tex ----
    async function onPickTex(e){
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!f) return;
      var targetExams = examId ? exams.filter(function(x){ return x.id === examId; }) : exams;
      try{
        var parsed = parseTexBank(await f.text(), f.name, { allowEssay: true });
        var byKey = {};
        targetExams.forEach(function(exam){ (exam.questions || []).forEach(function(q, idx){
          var k = normStemKey((q.groupPassage ? '' : '') + q.stem);
          if(k) (byKey[k] || (byKey[k] = [])).push({ exam: exam, q: q, idx: idx });
        }); });
        var matched = [], unmatched = 0, noTag = 0, unknown = {};
        (parsed.questions || []).forEach(function(pq, pi){
          if(!pq.nanoTagIds || !pq.nanoTagIds.length){ noTag++; return; }
          // báo MỌI mã nano chưa có trong bản đồ trong file (kể cả ở câu không ghép được) để thầy thêm đủ một lần
          pq.nanoTagIds.forEach(function(id){ if(!N.getNano(id)) unknown[id] = (unknown[id] || 0) + 1; });
          var cands = byKey[normStemKey(pq.stem)] || [];
          if(!cands.length){ unmatched++; return; }
          var hit = cands.filter(function(c){ return c.q.index === pq.index; })[0] || cands[0];
          var known = pq.nanoTagIds.filter(function(id){ return !!N.getNano(id); });
          if(known.length) matched.push({ it: { exam: hit.exam, q: hit.q, idx: hit.idx, key: keyOf(hit.exam.id, hit.idx) }, ids: known });
        });
        setSync({ file: f.name, total: (parsed.questions || []).length, matched: matched, unmatched: unmatched, noTag: noTag, unknown: unknown });
      }catch(err){ console.error(err); props.fireToast('Không đọc được file .tex này.', true); }
    }
    function applySync(){
      if(!sync) return;
      setEdits(function(prev){
        var n = Object.assign({}, prev);
        sync.matched.forEach(function(m){
          if((m.it.q.nanoPointIds || []).join(',') !== m.ids.join(',')) n[m.it.key] = { ids: m.ids, conf: '', note: 'Từ thẻ @nano trong .tex' };
        });
        return n;
      });
      props.fireToast('Đã đưa ' + sync.matched.length + ' câu vào danh sách thay đổi. Bấm "Lưu thay đổi" để ghi.');
      setSync(null); setOnlyUntagged(false);
    }

    var inputStyle = { padding: '7px 10px', border: '1px solid var(--line, #d9d4c7)', borderRadius: '8px', fontSize: '0.88rem', background: 'var(--surface, #fff)', color: 'inherit' };
    var allNanoOptions = N.CHU_DE.map(function(cd){
      return h(React.Fragment, { key: cd.key }, N.getBaiByChuDe(cd.key).map(function(b){
        var ns = N.getNanoByBai(b.key);
        if(!ns.length) return null;
        return h('optgroup', { key: b.key, label: cd.icon + ' ' + b.name }, ns.map(function(n){ return h('option', { key: n.id, value: n.id }, n.id + ' · ' + n.name); }));
      }));
    });

    return h('div', null,
      h('div', { className: 'card', style: { marginBottom: '14px' } },
        h('div', { className: 'sm-toolbar' },
          h('div', null, h('h3', null, '🏷️ Gắn nano-point cho câu đã nạp'),
            h('p', { className: 'sm-sub' }, 'Sửa nano-point của câu hỏi ĐÃ CÓ trong ngân hàng — không cần xoá đề rồi nạp lại. Mỗi câu gắn được 1–3 nano-point (kể cả ở các Bài khác nhau).'))),
        h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center' } },
          h('select', { value: examId, style: inputStyle, onChange: function(e){ setExamId(e.target.value); setShownLimit(60); } },
            h('option', { value: '' }, 'Tất cả các đề (' + exams.length + ')'),
            exams.map(function(x){ return h('option', { key: x.id, value: x.id }, (x.title || x.id) + ' · ' + (x.questions || []).length + ' câu'); })),
          h('label', { style: { display: 'inline-flex', gap: '6px', alignItems: 'center', fontSize: '0.88rem' } },
            h('input', { type: 'checkbox', checked: onlyUntagged, onChange: function(e){ setOnlyUntagged(e.target.checked); setShownLimit(60); } }), 'Chỉ câu chưa gắn nano-point'),

  function PricingPanel(props){
    var OPCref = window.OPC;

    var tiersState = React.useState(defaultPricingTiers()); var tiers = tiersState[0], setTiers = tiersState[1];
    var savingState = React.useState(false); var saving = savingState[0], setSaving = savingState[1];
    var initedRef = React.useRef(false);

    React.useEffect(function(){
      if(!OPCref.pricing) return;
      var unsub = OPCref.pricing.subscribe(function(data){
        setLoading(false);
        // Chỉ "mồi" state chỉnh sửa MỘT LẦN lúc mở panel — tránh dữ liệu
        // Firestore ghi đè lên những gì thầy đang gõ dở giữa chừng.
        if(initedRef.current) return;
        initedRef.current = true;
        if(data){
          setHasSavedDoc(true);
          setSectionEnabled(data.sectionEnabled !== false);
          setTiers(Array.isArray(data.tiers) && data.tiers.length ? data.tiers.map(function(t){
            return Object.assign({ name:'', price:0, unit:'/tháng', badge:'', featured:false, visible:true, features:[] }, t);
          }) : defaultPricingTiers());
        } else {
          setHasSavedDoc(false);
          setTiers(defaultPricingTiers());
        }
      }, function(){ setLoading(false); });
      return function(){ unsub(); };
    }, []);

    function updateTier(idx, patch){
      setTiers(function(prev){ var next = prev.slice(); next[idx] = Object.assign({}, next[idx], patch); return next; });
    }
    function moveTier(idx, dir){
      setTiers(function(prev){
        var next = prev.slice();
        var j = idx + dir;
        if(j < 0 || j >= next.length) return prev;
        var tmp = next[idx]; next[idx] = next[j]; next[j] = tmp;
        return next;
      });
    }
    function removeTier(idx){
      if(!window.confirm('Xoá gói "' + (tiers[idx].name || '(chưa đặt tên)') + '"? Thao tác chỉ có hiệu lực sau khi bấm Lưu.')) return;
      setTiers(function(prev){ return prev.filter(function(_, i){ return i !== idx; }); });
    }
    function addTier(){
      setTiers(function(prev){ return prev.concat([{ name:'Gói mới', price:0, unit:'/tháng', badge:'', featured:false, visible:true, features:[] }]); });
    }
    function resetToDefault(){

      setTiers(defaultPricingTiers());

        var t = tiers[i];

        if(t.price == null || isNaN(Number(t.price)) || Number(t.price) < 0){ props.fireToast('Giá của gói "' + t.name + '" không hợp lệ.', true); return; }

        .catch(function(err){ console.error('Lỗi lưu Gói dịch vụ:', err); props.fireToast('Không lưu được — thử lại.', true); })

    return h('div', { className: 'card' },
      h('div', { className: 'sm-toolbar' },
        h('div', null, h('h3', null, '💰 Gói dịch vụ'),
          h('p', { className: 'sm-sub' }, 'Giá/tính năng hiển thị ở mục "Gói dịch vụ" trên trang chủ — sửa xong bấm Lưu là trang chủ cập nhật ngay, không cần deploy lại.')),
        h('div', { className: 'sm-actions' },
          h('button', { type: 'button', className: 'btn btn-secondary', onClick: resetToDefault }, '↩️ Khôi phục mặc định'),
          h('button', { type: 'button', className: 'btn btn-primary', disabled: saving, onClick: handleSave }, saving ? 'Đang lưu…' : '💾 Lưu thay đổi')
        )
      ),

      !hasSavedDoc ? h('div', { className: 'banner info', style: { marginTop: '16px' } }, h('span', null, 'ℹ️'),
        h('div', null, 'Chưa từng lưu cấu hình — đang hiển thị đúng 3 gói mặc định trang chủ đang áp dụng. Bấm "Lưu thay đổi" để bắt đầu quản lý giá từ đây.')) : null,

      h('label', { style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: '0.85rem', marginTop: '16px', cursor: 'pointer', fontWeight: 700 } },
        h('input', { type: 'checkbox', checked: sectionEnabled, onChange: function(e){ setSectionEnabled(e.target.checked); } }),
        'Hiện mục "Gói dịch vụ" trên trang chủ'
      ),
      !sectionEnabled ? h('p', { style: { fontSize: '0.8rem', color: 'var(--warning)', marginTop: '4px' } }, '⚠️ Cả mục Gói dịch vụ sẽ bị ẩn khỏi trang chủ (dùng khi chưa sẵn sàng mở bán).') : null,

      tiers.map(function(t, idx){
        return h('div', { key: idx, className: cx('pp-tier-card', (!t.visible || !sectionEnabled) && 'disabled') },
          h('div', { className: 'pp-tier-head' },
            h('div', { className: 'pp-tier-head-left' },
              h('div', { className: 'pp-tier-num' }, idx + 1),
              h('div', { className: 'pp-tier-order-btns' },
                h('button', { type: 'button', disabled: idx === 0, onClick: function(){ moveTier(idx, -1); } }, '▲'),
                h('button', { type: 'button', disabled: idx === tiers.length - 1, onClick: function(){ moveTier(idx, 1); } }, '▼')
              )
            ),
            h('button', { type: 'button', className: 'pp-remove-btn', onClick: function(){ removeTier(idx); } }, '🗑 Xoá gói')
          ),
          h('div', { className: 'pp-tier-grid' },
            h('div', { className: 'sm-field' }, h('label', null, 'Tên gói'),
              h('input', { type: 'text', value: t.name, onChange: function(e){ updateTier(idx, { name: e.target.value }); } })),
            h('div', { className: 'sm-field' }, h('label', null, 'Giá (VNĐ)'),
              h('input', { type: 'number', min: 0, step: 10000, value: t.price, onChange: function(e){ updateTier(idx, { price: Number(e.target.value) }); } }),
              h('div', { className: 'pp-preview-price' }, pricingFmtVND(t.price) + (t.unit || ''))),
            h('div', { className: 'sm-field' }, h('label', null, 'Đơn vị'),
              h('input', { type: 'text', value: t.unit || '', placeholder: '/tháng', onChange: function(e){ updateTier(idx, { unit: e.target.value }); } }))
          ),
          h('div', { className: 'sm-field', style: { marginTop: '12px' } }, h('label', null, 'Nhãn nổi bật (để trống nếu không có, vd. "Phổ biến nhất")'),
            h('input', { type: 'text', value: t.badge || '', onChange: function(e){ updateTier(idx, { badge: e.target.value }); } })),
          h('div', { className: 'sm-field', style: { marginTop: '12px' } }, h('label', null, 'Tính năng (mỗi dòng 1 tính năng)'),
            h('textarea', {
              rows: 4, value: (t.features || []).join('\n'),
              style: { width: '100%', boxSizing: 'border-box', fontFamily: '"Be Vietnam Pro",sans-serif', fontSize: '0.86rem', lineHeight: 1.6, padding: '8px 11px', borderRadius: '8px', border: '1px solid var(--line)', background: 'var(--surface)', color: 'var(--ink)', resize: 'vertical' },
              onChange: function(e){ updateTier(idx, { features: e.target.value.split('\n') }); },
              onBlur: function(e){ updateTier(idx, { features: e.target.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean) }); }
            })),
          h('div', { className: 'pp-tier-toggles' },
            h('label', null, h('input', { type: 'checkbox', checked: !!t.featured, onChange: function(e){ updateTier(idx, { featured: e.target.checked }); } }), 'Làm nổi bật (khung viền vàng)'),
            h('label', null, h('input', { type: 'checkbox', checked: t.visible !== false, onChange: function(e){ updateTier(idx, { visible: e.target.checked }); } }), 'Hiển thị gói này trên trang chủ')
          )
        );
      }),

      h('button', { type: 'button', className: 'btn btn-secondary', style: { marginTop: '14px' }, onClick: addTier }, '➕ Thêm gói mới')
    );
  }

  // ================= Quản lý chương (khoá/mở chương theo học sinh) =========
  // THÊM 28/9/2026 — bảng học sinh × 4 chương (mỗi ô là 1 công tắc), nút mở/
  // khoá 1 chương cho cả lớp, chương mở mặc định cho lớp (settings/curriculum),
  // và danh sách câu hỏi CHƯA GẮN CHƯƠNG để gắn bổ sung (câu chưa gắn chương
  // không bao giờ hiện với học sinh — xem curriculum.js / prepscholar.js).
  function CurriculumPanel(props){
    var OPCref = window.OPC;
    var CUR = window.OPC_CURRICULUM;
    var studentsState = React.useState([]); var students = studentsState[0], setStudents = studentsState[1];
    var curState = React.useState({ loaded: false, data: null }); var cur = curState[0], setCur = curState[1];
    var examsState = React.useState([]); var exams = examsState[0], setExams = examsState[1];
    var busyState = React.useState({}); var busy = busyState[0], setBusy = busyState[1];
    var bulkBusyState = React.useState(false); var bulkBusy = bulkBusyState[0], setBulkBusy = bulkBusyState[1];
    var searchState = React.useState(''); var search = searchState[0], setSearch = searchState[1];
    var pickState = React.useState({}); var picks = pickState[0], setPicks = pickState[1]; // key "<examId>#<idx>" -> chương chọn
    var showAllState = React.useState(false); var showAll = showAllState[0], setShowAll = showAllState[1];

    React.useEffect(function(){
      if(!OPCref || !OPCref.curriculum) return;
      var unsub1 = OPCref.students.subscribe(function(snap){
        setStudents(snap.docs.map(function(d){ return Object.assign({}, d.data() || {}, { id: d.id }); }));
      }, function(err){ console.error('Lỗi tải học sinh (Quản lý chương):', err); });
      var unsub2 = OPCref.curriculum.subscribe(function(data){ setCur({ loaded: true, data: data }); },
        function(err){ console.error('Lỗi tải settings/curriculum:', err); setCur({ loaded: true, data: null }); });
      var unsub3 = OPCref.examBank.subscribe(function(snap){
        setExams(snap.docs.map(function(d){ return Object.assign({}, d.data() || {}, { id: d.id }); }));
      }, function(err){ console.error('Lỗi tải ngân hàng đề (Quản lý chương):', err); });
      return function(){ unsub1(); unsub2(); unsub3(); };
    }, []);

    // ---- Thống kê câu hỏi theo chương + danh sách câu chưa gắn chương ----
    var bankInfo = React.useMemo(function(){
      var perChapter = {};
      if(!CUR) return { perChapter: perChapter, untagged: [] };
      CUR.ALL_CHAPTERS.forEach(function(n){ perChapter[n] = { I: 0, II: 0, III: 0 }; });
      var untagged = [];
      exams.forEach(function(exam){
        (exam.questions || []).forEach(function(q, idx){
          var c = CUR.inferChuong(q);
          if(c){ perChapter[c][q.part || 'I'] = (perChapter[c][q.part || 'I'] || 0) + 1; return; }
          var sugTopic = window.OPC_NANO ? window.OPC_NANO.findChuDeByText(q.chuDeLon) : null;
          var suggestion = sugTopic ? (CUR.TOPIC_TO_CHUONG[sugTopic.key] || null) : null;
          untagged.push({ key: exam.id + '#' + idx, examId: exam.id, examTitle: exam.title || '(chưa đặt tên)', idx: idx, q: q, suggestion: suggestion });
        });
      });
      return { perChapter: perChapter, untagged: untagged };
    }, [exams]);

    if(!CUR){
      return h('div', { className: 'card' }, h('p', null, 'Không tải được curriculum.js — kiểm tra lại file đã được deploy.'));
    }

    var defaultChapters = CUR.getUnlockedChapters(null, cur.data);
    function chaptersOf(s){ return CUR.getUnlockedChapters(s, cur.data); }
    function hasOwn(s){ return Array.isArray(s.unlockedChapters); }
    function withChapter(list, num, on){
      var next = list.filter(function(n){ return n !== num; });
      if(on) next.push(num);
      return CUR.normalizeChapters(next);
    }
    function markBusy(key, val){ setBusy(function(prev){ var n = Object.assign({}, prev); if(val) n[key] = true; else delete n[key]; return n; }); }

    function toggleCell(s, num){
      var list = chaptersOf(s);
      var on = list.indexOf(num) < 0;
      var key = s.id + '#' + num;
      markBusy(key, true);
      OPCref.curriculum.setStudentChapters(s.id, withChapter(list, num, on))
        .then(function(){ props.fireToast((on ? 'Đã mở ' : 'Đã khoá ') + 'Chương ' + num + ' cho ' + (s.name || 'học sinh') + '.'); })
        .catch(function(err){ console.error(err); props.fireToast('Không lưu được — thử lại.', true); })
        .finally(function(){ markBusy(key, false); });
    }

    function resetStudent(s){
      markBusy(s.id + '#reset', true);
      OPCref.curriculum.resetStudentChapters(s.id)
        .then(function(){ props.fireToast((s.name || 'Học sinh') + ' đã quay về theo mặc định của lớp.'); })
        .catch(function(err){ console.error(err); props.fireToast('Không lưu được — thử lại.', true); })
        .finally(function(){ markBusy(s.id + '#reset', false); });
    }

    function toggleDefault(num){
      var on = defaultChapters.indexOf(num) < 0;
      setBulkBusy(true);
      OPCref.curriculum.saveDefault(withChapter(defaultChapters, num, on))
        .then(function(){ props.fireToast('Đã cập nhật chương mở mặc định (áp dụng cho học sinh chưa có cấu hình riêng).'); })
        .catch(function(err){ console.error(err); props.fireToast('Không lưu được — thử lại.', true); })
        .finally(function(){ setBulkBusy(false); });
    }

    // Mở/Khoá 1 chương cho CẢ LỚP: sửa mặc định của lớp + danh sách riêng của
    // từng em đang có cấu hình riêng (em theo mặc định tự nhận theo).
    function setChapterForClass(num, on){
      var ch = CUR.getChapter(num);
      if(!window.confirm((on ? 'Mở' : 'Khoá') + ' Chương ' + num + ' (' + (ch ? ch.name : '') + ') cho CẢ LỚP (' + students.length + ' học sinh)?')) return;
      setBulkBusy(true);
      var jobs = [OPCref.curriculum.saveDefault(withChapter(defaultChapters, num, on))];
      students.forEach(function(s){
        if(hasOwn(s)) jobs.push(OPCref.curriculum.setStudentChapters(s.id, withChapter(chaptersOf(s), num, on)));
      });
      Promise.all(jobs)
        .then(function(){ props.fireToast('Đã ' + (on ? 'mở' : 'khoá') + ' Chương ' + num + ' cho cả lớp.'); })
        .catch(function(err){ console.error(err); props.fireToast('Có lỗi khi lưu — một số học sinh có thể chưa được cập nhật, thử lại.', true); })
        .finally(function(){ setBulkBusy(false); });
    }

    var filteredUntagged = bankInfo.untagged.filter(function(it){
      if(!search.trim()) return true;
      var hay = (it.examTitle + ' ' + (it.q.chuDeLon || '') + ' ' + (it.q.dangBai || '') + ' ' + (it.q.stem || '')).toLowerCase();
      return hay.indexOf(search.trim().toLowerCase()) > -1;
    });
    var visibleUntagged = showAll ? filteredUntagged : filteredUntagged.slice(0, 50);

    // Gắn chương cho 1 loạt câu: gom theo đề rồi ghi lại mảng questions của
    // từng đề 1 lần (OPC.examBank.updateQuestions).
    function saveTags(items){
      var byExam = {};
      items.forEach(function(it){ (byExam[it.examId] || (byExam[it.examId] = [])).push(it); });
      var jobs = Object.keys(byExam).map(function(examId){
        var exam = exams.filter(function(e){ return e.id === examId; })[0];
        if(!exam) return Promise.resolve();
        var qs = (exam.questions || []).slice();
        byExam[examId].forEach(function(it){ qs[it.idx] = Object.assign({}, qs[it.idx], { chuong: it.chuong }); });
        return OPCref.examBank.updateQuestions(examId, qs);
      });
      setBulkBusy(true);
      return Promise.all(jobs)
        .then(function(){
          props.fireToast('Đã gắn chương cho ' + items.length + ' câu hỏi.');
          setPicks(function(prev){ var n = Object.assign({}, prev); items.forEach(function(it){ delete n[it.key]; }); return n; });
        })
        .catch(function(err){ console.error(err); props.fireToast('Không lưu được — thử lại.', true); })
        .finally(function(){ setBulkBusy(false); });
    }
    function saveOne(it){
      var c = Number(picks[it.key] || it.suggestion);
      if(!c){ props.fireToast('Chọn chương cho câu này trước khi lưu.', true); return; }
      saveTags([{ key: it.key, examId: it.examId, idx: it.idx, chuong: c }]);
    }
    function saveAllPicked(){
      var items = filteredUntagged.filter(function(it){ return picks[it.key]; })
        .map(function(it){ return { key: it.key, examId: it.examId, idx: it.idx, chuong: Number(picks[it.key]) }; });
      if(!items.length){ props.fireToast('Chưa chọn chương cho câu nào.', true); return; }
      saveTags(items);
    }
    function applySuggestions(){
      var items = filteredUntagged.filter(function(it){ return it.suggestion; })
        .map(function(it){ return { key: it.key, examId: it.examId, idx: it.idx, chuong: it.suggestion }; });
      if(!items.length){ props.fireToast('Không có câu nào có gợi ý chương từ "Chủ đề lớn".', true); return; }
      if(!window.confirm('Gắn chương theo gợi ý (dựa trên tag "Chủ đề lớn" của câu) cho ' + items.length + ' câu hỏi?')) return;
      saveTags(items);
    }

    var chapterName = function(n){ var c = CUR.getChapter(n); return c ? c.icon + ' Chương ' + n + ': ' + c.name : 'Chương ' + n; };
    var pickedCount = filteredUntagged.filter(function(it){ return picks[it.key]; }).length;

    return h('div', { className: 'card' },
      h('div', { className: 'sm-toolbar' },
        h('div', null, h('h3', null, '📚 Quản lý chương'),
          h('p', { className: 'sm-sub' }, 'Dạy cuốn chiếu: học sinh chỉ luyện tập / thi thử với câu hỏi thuộc chương đã được mở. Cấu hình riêng của từng em ghi đè mặc định của lớp. Thay đổi có hiệu lực từ lần đăng nhập / tải lại trang tiếp theo của học sinh.'))
      ),

      // ---- Chương mặc định + mở/khoá cho cả lớp ----
      h('div', { className: 'cp-chip-row' },
        CUR.CHAPTERS.map(function(c){
          var isDefault = defaultChapters.indexOf(c.num) > -1;
          var q = bankInfo.perChapter[c.num];
          return h('div', { key: c.num, className: 'cp-chapter-box' },
            h('h4', null, chapterName(c.num)),
            h('div', { style: { fontSize: '0.78rem', color: 'var(--muted)' } },
              'Ngân hàng: P.I ' + q.I + ' · P.II ' + q.II + ' · P.III ' + q.III + ' câu'),
            h('label', { style: { display: 'flex', alignItems: 'center', gap: 6, fontSize: '0.8rem', marginTop: 6, cursor: 'pointer' } },
              h('input', { type: 'checkbox', checked: isDefault, disabled: bulkBusy || !cur.loaded, onChange: function(){ toggleDefault(c.num); } }),
              'Mở mặc định cho học sinh mới / theo lớp'),
            h('div', null,
              h('button', { type: 'button', className: 'btn btn-primary', disabled: bulkBusy, onClick: function(){ setChapterForClass(c.num, true); } }, '🔓 Mở chương ' + c.num + ' cho cả lớp'),
              h('button', { type: 'button', className: 'btn btn-secondary', disabled: bulkBusy, onClick: function(){ setChapterForClass(c.num, false); } }, '🔒 Khóa chương ' + c.num + ' cho cả lớp')
            )
          );
        })
      ),
      !cur.data ? h('div', { className: 'banner info' }, h('span', null, 'ℹ️'),
        h('div', null, 'Chưa có cấu hình settings/curriculum — đang dùng mặc định: mở Chương 1 và 2. Bấm vào một ô "Mở mặc định" hoặc nút Mở/Khoá cho cả lớp để lưu cấu hình.')) : null,

      // ---- Bảng học sinh × 4 chương ----
      h('div', { className: 'sm-table-wrap' },
        h('table', { className: 'sm-table' },
          h('thead', null, h('tr', null,
            h('th', null, 'Học sinh'),
            CUR.CHAPTERS.map(function(c){ return h('th', { key: c.num, style: { textAlign: 'center' } }, 'Chương ' + c.num + ' · ' + c.name); }),
            h('th', null, 'Cấu hình')
          )),
          h('tbody', null,
            students.length ? students.map(function(s){
              var list = chaptersOf(s);
              return h('tr', { key: s.id },
                h('td', null, h('div', { style: { fontWeight: 700 } }, s.name || '(chưa đặt tên)'),
                  h('div', { style: { fontSize: '0.75rem', color: 'var(--muted)' } }, (s.username ? '@' + s.username : '') + (s.status && s.status !== 'active' ? ' · Tạm khoá' : ''))),
                CUR.CHAPTERS.map(function(c){
                  var on = list.indexOf(c.num) > -1;
                  return h('td', { key: c.num, style: { textAlign: 'center' } },
                    h('button', {
                      type: 'button', className: cx('cp-switch', on && 'on'),
                      disabled: !!busy[s.id + '#' + c.num] || bulkBusy || !cur.loaded,
                      title: (on ? 'Đang mở — bấm để khoá' : 'Đang khoá — bấm để mở') + ' Chương ' + c.num,
                      'aria-pressed': on,
                      onClick: function(){ toggleCell(s, c.num); }
                    }));
                }),
                h('td', null, hasOwn(s)
                  ? h('span', null, h('span', { style: { fontSize: '0.78rem', fontWeight: 700 } }, 'Riêng '),
                      h('button', { type: 'button', className: 'btn btn-secondary', style: { fontSize: '0.72rem', padding: '4px 8px' }, disabled: !!busy[s.id + '#reset'] || bulkBusy, onClick: function(){ resetStudent(s); } }, '↺ Theo lớp'))
                  : h('span', { style: { fontSize: '0.78rem', color: 'var(--muted)' } }, 'Theo mặc định lớp'))
              );
            }) : h('tr', null, h('td', { colSpan: 6, style: { color: 'var(--muted)' } }, 'Chưa có học sinh nào.'))
          )
        )
      ),

      // ---- Câu hỏi chưa gắn chương ----
      h('div', { style: { marginTop: '28px' } },
        h('div', { className: 'sm-toolbar' },
          h('div', null,
            h('h3', null, '🏷️ Câu hỏi chưa gắn chương: ' + bankInfo.untagged.length + ' câu'),
            h('p', { className: 'sm-sub' }, 'Câu chưa có trường "chuong" và không suy ra được từ mã kiến thức (nano-point / Bài) sẽ KHÔNG hiện với học sinh. Chọn chương cho từng câu rồi lưu, hoặc gắn theo gợi ý từ tag "Chủ đề lớn".')),
          h('div', { className: 'sm-actions' },
            h('button', { type: 'button', className: 'btn btn-secondary', disabled: bulkBusy || !filteredUntagged.length, onClick: applySuggestions }, '✨ Gắn theo gợi ý'),
            h('button', { type: 'button', className: 'btn btn-primary', disabled: bulkBusy || !pickedCount, onClick: saveAllPicked }, '💾 Lưu ' + pickedCount + ' câu đã chọn')
          )
        ),
        bankInfo.untagged.length ? h('div', { className: 'sm-field', style: { marginTop: '12px', maxWidth: '360px' } },
          h('input', { type: 'text', placeholder: 'Lọc theo tên đề / chủ đề / nội dung…', value: search, onChange: function(e){ setSearch(e.target.value); } })) : null,
        bankInfo.untagged.length ? h('div', { className: 'sm-table-wrap' },
          h('table', { className: 'sm-table' },
            h('thead', null, h('tr', null,
              h('th', null, 'Đề / Câu'), h('th', null, 'Chủ đề (tag)'), h('th', null, 'Nội dung'), h('th', null, 'Gắn chương'), h('th', null, '')
            )),
            h('tbody', null, visibleUntagged.map(function(it){
              var val = picks[it.key] || '';
              var stem = String(it.q.stem || '').replace(/\s+/g, ' ');
              return h('tr', { key: it.key },
                h('td', null, h('div', { style: { fontWeight: 700, fontSize: '0.82rem' } }, it.examTitle),
                  h('div', { style: { fontSize: '0.75rem', color: 'var(--muted)' } }, 'Câu ' + (it.q.index || it.idx + 1) + ' · Phần ' + (it.q.part || 'I') + ' · ' + (it.q.level || ''))),

        m4: questions.filter(function(q){ return q.level === 'M4'; }).length,
        grouped: questions.filter(function(q){ return !!q.groupPassage; }).length,
        topics: Array.from(new Set(questions.map(function(q){ return q.chuDeLon; }).filter(Boolean))),
        subTopics: Array.from(new Set(questions.map(function(q){ return q.dangBai; }).filter(Boolean)))
      };
    }

    // Loại 1 câu khỏi danh sách đang soát — dùng khi Xoá hẳn, hoặc sau khi
    // đã Nạp riêng câu đó rồi (để tránh nạp trùng lúc nạp cả file). nanoRows/
    // aiSuggesting/importingRows đang lưu theo CHỈ SỐ MẢNG (idx): xoá 1 phần
    // tử ở giữa mảng câu hỏi làm lệch chỉ số của mọi câu phía sau nếu không
    // dồn lại các object này theo đúng vị trí mới.
    function removeQuestionAt(idx){
      setParsedAnalysis(function(prev){
        if(!prev) return prev;
        var newQuestions = prev.questions.filter(function(_, i){ return i !== idx; });
        return Object.assign({}, prev, { questions: newQuestions, stats: computeStatsFromQuestions(newQuestions) });
      });
      function shiftKeys(prevObj){
        var next = {};
        Object.keys(prevObj).forEach(function(k){
          var ki = Number(k);
          if(ki === idx) return;
          next[ki > idx ? ki - 1 : ki] = prevObj[k];
        });
        return next;
      }
      setNanoRows(shiftKeys);
      setAiSuggesting(shiftKeys);
      setImportingRows(shiftKeys);
      if(preEditIdx === idx){
        setPreEditIdx(null);
        setPreEditDraft(null);
      } else if(preEditIdx != null && preEditIdx > idx){
        setPreEditIdx(preEditIdx - 1);
      }

      removeQuestionAt(idx);
    }

    function startPreEdit(idx, q){
      setPreEditIdx(idx);

        stem: q.stem || '',

    }
    function cancelPreEdit(){ setPreEditIdx(null); setPreEditDraft(null); }
    function updatePreEditField(key, val){

    }

      });

    function setPreEditCorrectChoice(oIdx){
      setPreEditDraft(function(prev){

      });
    }
    function togglePreEditTF(oIdx){
      setPreEditDraft(function(prev){
        if(!prev) return prev;
        return Object.assign({}, prev, { options: prev.options.map(function(o, i){ return i === oIdx ? Object.assign({}, o, { isTrue: !o.isTrue }) : o; }) });
      });
    }
    function savePreEdit(idx){
      if(!preEditDraft || !parsedAnalysis) return;
      var q0 = parsedAnalysis.questions[idx];
      if(!q0) return;
      if(!String(preEditDraft.stem || '').trim()){
        props.fireToast('Nội dung câu hỏi không được để trống.', true);
        return;
      }
      if(q0.type !== 'shortans' && !preEditDraft.options.some(function(o){ return o.isTrue; })){
        props.fireToast('Cần chọn ít nhất 1 đáp án đúng trước khi lưu.', true);
        return;
      }

        props.fireToast('Đáp án không được để trống.', true);
        return;
      }
      setParsedAnalysis(function(prev){
        if(!prev) return prev;
        var newQuestions = prev.questions.map(function(q, i){
          if(i !== idx) return q;
          var updated = Object.assign({}, q, {
            stem: preEditDraft.stem.trim(),
            loigiai: preEditDraft.loigiai,
            level: preEditDraft.level,
            chuDeLon: preEditDraft.chuDeLon.trim(),
            dangBai: preEditDraft.dangBai.trim()
          });
          if(q.type === 'shortans'){ updated.shortans = preEditDraft.shortans.trim(); }
          else { updated.options = preEditDraft.options; }
          return updated;
        });
        return Object.assign({}, prev, { questions: newQuestions, stats: computeStatsFromQuestions(newQuestions) });
      });
      setPreEditIdx(null);
      setPreEditDraft(null);
      props.fireToast('Đã sửa câu ' + (idx + 1) + ' — nhớ bấm "Nạp đề vào ngân hàng" ở cuối để lưu thật.');
    }

    // Nạp NGAY 1 câu vào ngân hàng, tách riêng khỏi phần còn lại của file —
    // dùng khi chỉ cần bổ sung gấp 1-2 câu, không muốn đợi soát/nạp cả đề.
    // Dùng lại đúng danh sách ảnh đã chọn ở mục "Hình ảnh kèm theo" bên dưới
    // (nếu câu này có \includegraphics khớp tên 1 trong các ảnh đó) — cùng
    // cơ chế khớp tên file với lúc nạp cả đề, không cần logic ảnh riêng.
    async function importSingleQuestion(idx, q){
      if(!form.title.trim()){ props.fireToast('Vui lòng nhập tiêu đề đề thi trước khi nạp riêng 1 câu.', true); return; }
      setImportingRows(function(prev){ return Object.assign({}, prev, { [idx]: true }); });
      try{

        }
        var row = nanoRows[idx] || { baiKey:'', nanoIds:[] };
        var singleQ = Object.assign({}, q, { index: 1, nanoBaiKey: row.baiKey || '', nanoPointIds: row.nanoIds || [] });
        var texContent = texFile ? await texFile.text() : '';
        await bankApi.saveExamDoc(examRef, {
          title: form.title.trim() + ' — Câu ' + (idx + 1),

          tex: texFile ? { name: texFile.name, size: texFile.size, content: texContent } : null,

    // AI đọc nội dung THẬT của câu hỏi + toàn bộ danh mục (gửi kèm ngay
    // trong request, luôn khớp window.OPC_NANO hiện hành) và gợi ý Bài +
    // 1-2 nano-point phù hợp nhất — chính xác hơn khớp chuỗi theo tag,
    // vì tag giáo viên ghi tay không phải lúc nào cũng khớp đúng tên Bài
    // chuẩn trong sách. Thầy vẫn xem/sửa tay lại được sau khi AI gợi ý.
    var aiSuggestingState = React.useState({}); var aiSuggesting = aiSuggestingState[0], setAiSuggesting = aiSuggestingState[1];
    // Gợi ý nano-point AI HÀNG LOẠT cho cả file (kể cả file tổng hợp nhiều
    // chuyên đề trộn lẫn — mỗi câu vẫn được gửi đúng nội dung riêng của nó
    // cho AI, không bị lẫn chuyên đề với câu khác).
    var bulkAiRunningState = React.useState(false); var bulkAiRunning = bulkAiRunningState[0], setBulkAiRunning = bulkAiRunningState[1];
    var bulkAiProgressState = React.useState({ done: 0, total: 0 }); var bulkAiProgress = bulkAiProgressState[0], setBulkAiProgress = bulkAiProgressState[1];
    var bulkAiOverwriteState = React.useState(false); var bulkAiOverwrite = bulkAiOverwriteState[0], setBulkAiOverwrite = bulkAiOverwriteState[1];

    function buildNanoCatalogPayload(){
      if(!window.OPC_NANO) return [];
      return window.OPC_NANO.CHU_DE.map(function(cd){
        return {
          chuDeKey: cd.key,
          chuDeName: cd.name,
          bai: window.OPC_NANO.getBaiByChuDe(cd.key).map(function(b){
            return {
              baiKey: b.key,
              baiName: b.name,
              nano: window.OPC_NANO.getNanoByBai(b.key).map(function(n){ return { id: n.id, name: n.name }; })
            };
          })
        };
      });
    }

    // opts.silent=true: dùng khi gọi hàng loạt (runBulkAiSuggest) — không
    // hiện toast riêng cho từng câu (tránh dội hàng chục thông báo liên
    // tiếp), trả về true/false để hàm gọi hàng loạt tự đếm số câu thành
    // công/lỗi và hiện đúng 1 toast tổng kết ở cuối.
    async function requestAiNanoSuggestion(qIdx, q, opts){
      var silent = opts && opts.silent;
      setAiSuggesting(function(prev){ return Object.assign({}, prev, { [qIdx]: true }); });
      try{
        var resp = await fetch('/api/ai-suggest-nano', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            stem: q.stem || q.raw || '',
            options: (q.options || []).map(function(o){ return o.key + '. ' + o.text; }),
            level: q.level,
            chuDeLon: q.chuDeLon,
            dangBai: q.dangBai,
            // THÊM 27/9/2026: gửi kèm ngữ cảnh chung (câu hỏi chùm) + lời giải
            // — dữ kiện vật lí thật nhiều khi nằm ở groupPassage chứ không ở
            // "stem" riêng của câu (vd stem chỉ ghi "Tính x"), và lời giải nêu
            // thẳng công thức/định luật đã dùng — thiếu 2 thứ này AI dễ đoán
            // sai Bài/nano-point, nhất là với câu hỏi chùm hoặc câu tình huống.
            groupPassage: q.groupPassage || '',
            loigiai: q.loigiai || '',
            // THÊM 5/10/2026 — ứng viên do bộ khớp từ khoá chọn sẵn, làm gợi ý tham khảo cho AI
            candidates: quickNanoSuggest(q).ids,
            catalog: buildNanoCatalogPayload()
          })
        });
        var data = await resp.json().catch(function(){ return {}; });
        if(!resp.ok){
          if(!silent) props.fireToast((data && data.error) || 'AI gợi ý thất bại — thử lại.', true);
          return false;
        }
        setNanoRows(function(prev){
          var next = Object.assign({}, prev);
          var old = next[qIdx] || {};
          // SỬA 5/10/2026 — AI có thể trả nano-point ở NHIỀU Bài và có độ tin cậy; mảng rỗng = AI không thấy nano-point nào khớp
          next[qIdx] = { baiKey: data.baiKey || old.baiKey || '', nanoIds: data.nanoIds || [], unknownIds: old.unknownIds || [],
                         aiReason: data.reason || (data.nanoIds && data.nanoIds.length ? '' : 'AI không thấy nano-point nào khớp — thầy chọn tay hoặc thêm nano-point mới.'),
                         aiConfidence: data.confidence || '' };
          return next;
        });
        if(!silent) props.fireToast('AI đã gợi ý cho câu ' + (qIdx + 1) + (data.confidence ? ' (độ tin cậy ' + data.confidence + ')' : '') + (data.reason ? ' — ' + data.reason : '') + ' — thầy xem lại giúp em.');
        return true;
      }catch(err){
        console.error('Lỗi gọi AI gợi ý nano-point:', err);
        if(!silent) props.fireToast('Không gọi được AI gợi ý — kiểm tra mạng, thử lại.', true);
        return false;
      }finally{
        setAiSuggesting(function(prev){ var next = Object.assign({}, prev); delete next[qIdx]; return next; });
      }
    }

    // Gọi requestAiNanoSuggestion LẦN LƯỢT (không gọi song song — tránh dội
    // API/limit tốc độ) cho MỌI câu trong parsedAnalysis.questions, kể cả
    // khi file .tex là "Tổng hợp nhiều chuyên đề" (mỗi câu vẫn được gửi
    // đúng stem/level/chuDeLon/dangBai riêng của chính nó lên AI — không hề
    // trộn lẫn giữa các chuyên đề). Mặc định BỎ QUA câu đã có sẵn ít nhất 1
    // nano-point (thủ công hoặc từ lần gợi ý trước) để không ghi đè công
    // sức đã chọn tay, trừ khi thầy tick "Ghi đè...". Dừng sớm nếu gặp 3
    // lỗi liên tiếp (nghi ngờ mất mạng / API lỗi) thay vì âm thầm chạy hết
    // cả file rồi mới biết không câu nào thành công.
    // THÊM 5/10/2026 — GỢI Ý NHANH (không AI): áp ngay kết quả bộ khớp từ khoá cho 1 câu. Trả 'ok' | 'weak' | 'none'.
    function applyQuickSuggest(qIdx, q, silent){
      var r = quickNanoSuggest(q);
      if(!r.ids.length){
        if(!silent) props.fireToast('Bộ gợi ý nhanh không tìm thấy nano-point khớp với câu ' + (qIdx + 1) + ' — thử "🪄 AI" hoặc chọn tay.', true);
        return 'none';
      }
      if(r.confidence === 'thấp'){
        if(!silent) props.fireToast('Câu ' + (qIdx + 1) + ': gợi ý nhanh chưa chắc (độ tin cậy thấp) nên chưa chọn sẵn — thầy xem lại hoặc dùng AI.', true);
        return 'weak';
      }
      setNanoRows(function(prev){
        var next = Object.assign({}, prev);
        var old = next[qIdx] || {};
        var first = window.OPC_NANO.getNano(r.ids[0]);
        next[qIdx] = { baiKey: first ? first.baiKey : (old.baiKey || ''), nanoIds: r.ids, unknownIds: old.unknownIds || [],
                       aiReason: 'Khớp từ khoá với: ' + r.ids.map(function(id){ var n = window.OPC_NANO.getNano(id); return id + (n ? ' (' + n.name + ')' : ''); }).join('; '),
                       aiConfidence: r.confidence };
        return next;
      });
      if(!silent) props.fireToast('Gợi ý nhanh cho câu ' + (qIdx + 1) + ' (độ tin cậy ' + r.confidence + ') — thầy xem lại giúp em.');
      return 'ok';
    }
    function runBulkQuickSuggest(){
      if(!parsedAnalysis || !parsedAnalysis.questions.length) return;
      var ok = 0, weak = 0, none = 0, skip = 0;
      parsedAnalysis.questions.forEach(function(q, i){
        var ex = nanoRows[i];
        if(ex && ex.nanoIds && ex.nanoIds.length && !bulkAiOverwrite){ skip++; return; }
        var res = applyQuickSuggest(i, q, true);
        if(res === 'ok') ok++; else if(res === 'weak') weak++; else none++;
      });
      props.fireToast('Gợi ý nhanh: ' + ok + ' câu đã gợi ý' + (skip ? ', ' + skip + ' câu giữ nguyên' : '') + ((weak + none) ? ', ' + (weak + none) + ' câu chưa chắc/không khớp (cần chọn tay hoặc dùng AI)' : '') + '.', !ok);
    }

    async function runBulkAiSuggest(){
      if(!parsedAnalysis || !parsedAnalysis.questions.length || bulkAiRunning) return;
      var questions = parsedAnalysis.questions;
      var initialRows = nanoRows;
      var overwrite = bulkAiOverwrite;
      setBulkAiRunning(true);
      setBulkAiProgress({ done: 0, total: questions.length });
      var okCount = 0, failCount = 0, skipCount = 0, consecutiveFails = 0, aborted = false;
      for(var i = 0; i < questions.length; i++){
        var existing = initialRows[i];
        var hasExisting = existing && existing.nanoIds && existing.nanoIds.length;
        if(hasExisting && !overwrite){
          skipCount++;
        } else {
          var ok = await requestAiNanoSuggestion(i, questions[i], { silent: true });
          if(ok){ okCount++; consecutiveFails = 0; }
          else {
            failCount++; consecutiveFails++;
            if(consecutiveFails >= 3){
              aborted = true;
              setBulkAiProgress({ done: i + 1, total: questions.length });
              break;
            }
          }
        }
        setBulkAiProgress({ done: i + 1, total: questions.length });
      }
      setBulkAiRunning(false);
      if(aborted){
        props.fireToast('Dừng gợi ý hàng loạt sau 3 lỗi liên tiếp (có thể mất mạng hoặc AI đang lỗi) — đã gợi ý xong ' + okCount + ' câu trước đó, thử lại cho các câu còn lại sau.', true);
      } else {
        props.fireToast('Gợi ý AI hàng loạt xong: ' + okCount + ' câu thành công' + (skipCount ? ', ' + skipCount + ' câu bỏ qua vì đã có sẵn' : '') + (failCount ? ', ' + failCount + ' câu lỗi' : '') + '.', !!failCount && !okCount);
      }
    }

    React.useEffect(function(){
      var unsub = bankApi.subscribe(function(snap){
        var rows = snap.docs.map(function(d){ var data = d.data() || {}; return Object.assign({}, data, {id: d.id}); });
        setExams(rows); setLoading(false);
      }, function(err){ setLoadErr(err); setLoading(false); });

    }, []);

    // Tải ảnh từ subcollection nếu đề lưu dưới dạng phân mảnh subdoc
    React.useEffect(function(){
      if(selected && selected.images && selected.images.length && !selected.images[0].url && selected.images[0].subdocId){

    }, [selected && selected.id]);

    // Thoát chế độ sửa đáp án mỗi khi đổi sang đề khác (hoặc đóng modal)
    React.useEffect(function(){

      window.addEventListener('keydown', onKey);

    }, [selected, addOpen, uploading]);

    function setField(key, val){ setForm(function(prev){ var next = Object.assign({}, prev); next[key] = val; return next; }); }

    var q = search.trim().toLowerCase();
    var filtered = exams.filter(function(x){
      if(filterChuDe !== 'Tất cả' && x.chuDe !== filterChuDe) return false;
      if(filterMucDo !== 'Tất cả' && String(x.mucDo) !== String(filterMucDo)) return false;
      if(q){
        var inTitle = (x.title||'').toLowerCase().indexOf(q) > -1;
        var inBai = (x.bai||'').toLowerCase().indexOf(q) > -1;

    function resetForm(){

    async function onPickTex(e){
      var f = e.target.files && e.target.files[0];
      setPreEditIdx(null); setPreEditDraft(null); setImportingRows({});
      setBulkAiProgress({ done: 0, total: 0 });
      if(!f){ setTexFile(null); setParsedAnalysis(null); setNanoRows({}); return; }
      // Nhận .tex, và cả .txt (trên iPad có thể đổi đuôi .tex -> .txt nếu app Tệp vẫn không cho chọn)
      if(!/\.(tex|txt)$/i.test(f.name)){ setFormErr('File đề phải có đuôi .tex (hoặc .txt).'); e.target.value=''; return; }
      if(f.size > MAX_TEX_BYTES){ setFormErr('File .tex vượt quá ' + fmtBytes(MAX_TEX_BYTES) + '.'); e.target.value=''; return; }
      setFormErr(''); setTexFile(f);
      try{
        var txt = await f.text();
        var analysis = parseTexBank(txt, f.name, { allowEssay: !!specialMode });
        setParsedAnalysis(analysis);

        // Gợi ý sẵn "Bài" khớp nhất cho từng câu (dựa trên tag đã ghi trong .tex),
        // chưa tự chọn nano-point cụ thể — giáo viên xác nhận / thu hẹp lại.
        var rows = {};
        (analysis.questions || []).forEach(function(q, idx){
          var sug = (window.OPC_NANO && window.OPC_NANO.suggestForParsedQuestion) ? window.OPC_NANO.suggestForParsedQuestion(q) : { bai:null };
          // THÊM 5/10/2026 — đọc sẵn dòng "% @nano: khi-1.3, khi-2.1" trong .tex: mã đã có trong bản đồ -> gắn luôn
          // (Bài chính = Bài của nano đầu tiên); mã CHƯA có -> unknownIds để thầy thêm nhanh ngay bên dưới.
          var known = [], unknown = [];
          (q.nanoTagIds || []).forEach(function(id){
            if(window.OPC_NANO && window.OPC_NANO.getNano(id)) known.push(id); else unknown.push(id);
          });
          var firstNano = known.length ? window.OPC_NANO.getNano(known[0]) : null;
          rows[idx] = { baiKey: firstNano ? firstNano.baiKey : (sug.bai ? sug.bai.key : ''), nanoIds: known, unknownIds: unknown };
        });
        setNanoRows(rows);

        if(!form.title.trim() && analysis.title){
          setField('title', analysis.title);
        }
        if(analysis.suggestedChuDe && form.chuDe === CHU_DE_LIST[0]){
          setField('chuDe', analysis.suggestedChuDe);
        }
        if(analysis.suggestedMucDo != null && Number(form.mucDo) === 2){
          setField('mucDo', analysis.suggestedMucDo);
        }
      }catch(err){
        console.warn('Lỗi đọc và phân tích file .tex:', err);
      }
    }

    function onPickImages(e){
      var files = Array.prototype.slice.call(e.target.files || []);
      if(!files.length) return;
      if(files.length > MAX_IMAGES){ setFormErr('Chỉ được chọn tối đa ' + MAX_IMAGES + ' hình mỗi lần.'); e.target.value=''; return; }
      for(var i=0;i<files.length;i++){
        if(!/^image\//.test(files[i].type)){ setFormErr('"' + files[i].name + '" không phải file hình ảnh.'); e.target.value=''; return; }
        if(files[i].size > MAX_IMAGE_BYTES){ setFormErr('"' + files[i].name + '" vượt quá ' + fmtBytes(MAX_IMAGE_BYTES) + '.'); e.target.value=''; return; }
      }
      setFormErr(''); setImgFiles(files);

    async function handleUpload(e){
      e.preventDefault();
      setFormErr('');
      if(!form.title.trim()){ setFormErr('Vui lòng nhập tiêu đề đề thi.'); return; }
      if(!texFile){ setFormErr('Vui lòng chọn file .tex.'); return; }

      setUploading(true); setProgress(8); setUploadMsg('Đang đọc và phân tích cấu trúc .tex...');
      try{
        var examRef = bankApi.newRef();
        var texContent = await texFile.text();
        var analysis = parsedAnalysis || parseTexBank(texContent, texFile.name, { allowEssay: !!specialMode });

        setProgress(25);
        setUploadMsg('Đang nén và tối ưu hóa ' + (imgFiles.length ? imgFiles.length + ' hình ảnh minh họa...' : 'dữ liệu...'));

        var images = [];
        for(var i = 0; i < imgFiles.length; i++){
          var pct = 25 + Math.round(((i + 1) / Math.max(1, imgFiles.length)) * 45);
          setProgress(pct);
          setUploadMsg('Đang tối ưu hình ' + (i + 1) + '/' + imgFiles.length + ': ' + imgFiles[i].name);
          var comp = await compressImage(imgFiles[i], 1200, 0.82);
          images.push(comp);
        }

        setProgress(75);
        setUploadMsg('Đang lưu vào ngân hàng đề Firebase Firestore...');

        // Gộp nano-point đã gắn (thủ công/gợi ý khớp chuỗi) vào từng câu hỏi trước khi lưu.
        var questionsWithNano = (analysis ? analysis.questions : []).map(function(q, idx){
          var row = nanoRows[idx] || { baiKey:'', nanoIds:[] };
          return Object.assign({}, q, {
            nanoBaiKey: row.baiKey || '',
            nanoPointIds: row.nanoIds || []
          });
        });

        await bankApi.saveExamDoc(examRef, {
          title: form.title.trim(),
          chuDe: form.chuDe,
          bai: form.bai.trim(),
          mucDo: Number(form.mucDo),
          examKind: form.examKind || 'nganHang',
          tex: {
            name: texFile.name,
            size: texFile.size,
            content: texContent
          },
          images: images,
          stats: analysis ? analysis.stats : null,
          questions: questionsWithNano,
          createdByEmail: (window.OPC_currentUser && window.OPC_currentUser.email) || ''
        });

        setProgress(100);
        setUploadMsg('Hoàn tất!');
        props.fireToast('Đã nạp đề "' + form.title.trim() + '" vào ngân hàng câu hỏi thành công.');
        resetForm(); setAddOpen(false);
      }catch(err){
        console.error('Lỗi khi nạp đề:', err);
        setFormErr('Nạp đề thất bại: ' + (err && err.message ? err.message : 'lỗi không rõ') + '.');
      }finally{
        setUploading(false);
      }
    }

  function normalizeImgNameLocal(name){
    return String(name || '').trim().toLowerCase().replace(/^.*[\\/]/, '').replace(/\.[a-z0-9]+$/i, '');
  }
  function resolveQuestionImagesLocal(q, examImages){
    var refs = q.images || [];
    if(!refs.length || !examImages || !examImages.length) return [];
    var out = [];
    refs.forEach(function(ref){
      var key = normalizeImgNameLocal(ref);
      var found = examImages.filter(function(im){ return normalizeImgNameLocal(im.name) === key; })[0];
      var url = found ? (found.url || found.dataUrl) : '';
      if(url) out.push({ name: ref, url: url });
    });
    return out;
  }
  function toStudentQuestionShape(q, examId, examTitle, resolvedImages){
    var NANO = window.OPC_NANO;

    var bai = null;
    if(NANO){
      bai = (q.nanoBaiKey && NANO.getBai(q.nanoBaiKey)) || NANO.findBaiByText(q.dangBai, chuDe ? chuDe.key : null);
    }
    var topicKey = chuDe ? chuDe.key : (bai ? bai.chuDeKey : null);
    var out = {
      id: examId + '_q' + q.index,
      topicKey: topicKey,
      topicName: chuDe ? chuDe.name : (q.chuDeLon || 'Khác'),
      subtopic: bai ? bai.name : (q.dangBai || ''),
      part: q.part || 'I',

      examTitle: examTitle,

      chuong: window.OPC_CURRICULUM ? window.OPC_CURRICULUM.inferChuong(q) : null // THÊM 28/9/2026
    };
    if(q.type === 'choiceTF'){
      out.statements = (q.options || []).map(function(o){ return { key: o.key, text: o.text, isTrue: !!o.isTrue }; });
    } else if(q.type === 'shortans'){
      // SỬA 4/10/2026 — hiểu "1{,}73" (xem parseShortAnswer trong opc-live-data.js)
      var pa = parseShortAnswer(q.shortans);
      out.correctAnswer = pa ? pa.value : null;
      out.tolerance = pa ? (0.5 * Math.pow(10, -pa.decimals) * Math.pow(10, pa.exp) + 1e-9) : 0.5;

      out.options = (q.options || []).map(function(o){ return { key: o.key, text: o.text }; });
      var correct = (q.options || []).filter(function(o){ return o.isTrue; })[0];
      out.correctKey = correct ? correct.key : null;
    }
    return out;
  }

      }

      // "Chỉ lấy câu chưa từng làm" — THÊM 25/9/2026: loại hẳn mọi câu đã có
      // trong lịch sử làm bài THẬT của học sinh (đúng lẫn sai, mọi lượt —
      // everAttemptedIds), khớp bằng đúng công thức id "<examId>_q<index>"
      // mà wrongQuestions/rightQuestions đã lưu.
      var excludedAttemptedCount = 0;
      if(onlyNew){
        var beforeOnlyNewCount = pool.length;
        pool = pool.filter(function(q){ return !everAttemptedIds[q.examId + '_q' + q.index]; });
        excludedAttemptedCount = beforeOnlyNewCount - pool.length;
      }

      if(!pool.length){
        props.fireToast(onlyNew
          ? 'Học sinh đã làm hết câu hỏi phù hợp trong ngân hàng đề — tắt "Chỉ lấy câu chưa từng làm" hoặc nạp thêm đề mới.'
          : 'Chưa có câu hỏi nào trong ngân hàng đề phù hợp với bộ lọc.', true);
        return;
      }

      // Desired question counts by Part
      var targetP1 = examStructure === 'quick15' ? 10 : 18;
      var targetP2 = examStructure === 'quick15' ? 2 : 4;
      var targetP3 = examStructure === 'quick15' ? 3 : 6;

      // Group pool by Part and Level
      function filterPool(part, levelArray){
        return pool.filter(function(q){
          return q.part === part && (!levelArray || levelArray.indexOf(q.level) > -1);
        });
      }

      // Shuffle array
      function shuffle(arr){
        var a = arr.slice();
        for(var i = a.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var temp = a[i]; a[i] = a[j]; a[j] = temp;
        }
        return a;
      }

      var chosenP1 = [];
      var chosenP2 = [];
      var chosenP3 = [];

      // "Ưu tiên câu từng làm sai (Lặp giãn cách)" — THÊM 25/9/2026, SỬA
      // 25/9/2026 (fix lỗi "dueNow" no-op — daysOverdue bị Math.max(0, ...)
      // kẹp về 0 nên điều kiện cũ "daysOverdue >= 0" luôn đúng, tức là mọi
      // câu sai đều bị coi là "đến hạn" kể cả khi còn 13 ngày nữa mới tới
      // hạn; nay dùng cờ dueNow tính đúng ở computeStudentStatsFromAttempts):
      // dành tối thiểu 40% tổng số câu cho các câu THẬT SỰ ĐANG ĐẾN/QUÁ HẠN
      // ôn lại (dueNow === true) trong Sổ tay câu sai THẬT của học sinh
      // (studentStats.mistakeLog — đã tính đúng chu kỳ 1-3-7-14 ngày, xem
      // computeStudentStatsFromAttempts trong prepscholar.js), câu trễ hạn
      // NHIỀU NHẤT được ưu tiên trước (mistakeLog đã sắp sẵn theo đúng thứ
      // tự đó). Chỉ dùng được câu nào Sổ tay câu sai trỏ tới MÀ vẫn còn thật
      // trong ngân hàng đề hiện tại (pool) — khớp đúng id "<examId>_q<index>".
      var reviewChosen = [];
      if(prioritizeWrong && studentStats && studentStats.mistakeLog && studentStats.mistakeLog.length){
        var poolById = {};
        pool.forEach(function(q){ poolById[q.examId + '_q' + q.index] = q; });
        var dueReview = studentStats.mistakeLog
          .filter(function(m){ return m.dueNow && poolById[m.qId]; })
          .sort(function(a, b){ return b.daysOverdue - a.daysOverdue; });
        var totalTarget = targetP1 + targetP2 + targetP3;
        var reviewTarget = Math.min(dueReview.length, Math.ceil(totalTarget * 0.4));
        for(var ri = 0; ri < dueReview.length && reviewChosen.length < reviewTarget; ri++){
          var rq = poolById[dueReview[ri].qId];
          var partTarget = rq.part === 'I' ? targetP1 : (rq.part === 'II' ? targetP2 : targetP3);
          var partChosen = rq.part === 'I' ? chosenP1 : (rq.part === 'II' ? chosenP2 : chosenP3);
          if(partChosen.length >= partTarget) continue; // Phần đó đã đủ chỗ, bỏ qua câu này
          if(rq.part === 'I') chosenP1.push(rq); else if(rq.part === 'II') chosenP2.push(rq); else chosenP3.push(rq);
          reviewChosen.push(rq);
        }
      }

      // Định nghĩa tỉ lệ theo goalProfile — áp dụng cho SỐ CÂU CÒN THIẾU của
      // mỗi Phần (đã trừ đi các câu ôn-lại-giãn-cách vừa dành chỗ ở trên):
      // foundation: 70% M1-M2, 30% M3
      // breakthrough: 25% M2, 55% M3, 20% M4
      // advanced: 30% M3, 70% M4
      // moet_standard: 45% M1-M2, 40% M3, 15% M4
      var remP1 = Math.max(0, targetP1 - chosenP1.length);
      var remP2 = Math.max(0, targetP2 - chosenP2.length);
      var remP3 = Math.max(0, targetP3 - chosenP3.length);
      var alreadyChosen = chosenP1.concat(chosenP2, chosenP3);
      function filterPoolExclChosen(part, levelArray){
        return filterPool(part, levelArray).filter(function(q){ return alreadyChosen.indexOf(q) === -1; });
      }
      if(goalProfile === 'foundation'){
        var m12Pool = shuffle(filterPoolExclChosen('I', ['M1', 'M2']));
        var m3Pool = shuffle(filterPoolExclChosen('I', ['M3']));
        chosenP1 = chosenP1.concat(m12Pool.slice(0, Math.round(remP1 * 0.7)), m3Pool.slice(0, Math.round(remP1 * 0.3)));
        chosenP2 = chosenP2.concat(shuffle(filterPoolExclChosen('II', ['M1', 'M2', 'M3'])).slice(0, remP2));
        chosenP3 = chosenP3.concat(shuffle(filterPoolExclChosen('III', ['M2', 'M3'])).slice(0, remP3));
      } else if(goalProfile === 'advanced'){
        var m3PoolA = shuffle(filterPoolExclChosen('I', ['M3']));
        var m4PoolA = shuffle(filterPoolExclChosen('I', ['M4']));
        chosenP1 = chosenP1.concat(m3PoolA.slice(0, Math.round(remP1 * 0.35)), m4PoolA.slice(0, Math.round(remP1 * 0.65)));
        chosenP2 = chosenP2.concat(shuffle(filterPoolExclChosen('II', ['M3', 'M4'])).slice(0, remP2));
        chosenP3 = chosenP3.concat(shuffle(filterPoolExclChosen('III', ['M3', 'M4'])).slice(0, remP3));
      } else if(goalProfile === 'breakthrough'){
        var m2PoolB = shuffle(filterPoolExclChosen('I', ['M2']));
        var m3PoolB = shuffle(filterPoolExclChosen('I', ['M3']));
        var m4PoolB = shuffle(filterPoolExclChosen('I', ['M4']));
        chosenP1 = chosenP1.concat(
          m2PoolB.slice(0, Math.round(remP1 * 0.25)),
          m3PoolB.slice(0, Math.round(remP1 * 0.55)),
          m4PoolB.slice(0, Math.round(remP1 * 0.20))
        );
        chosenP2 = chosenP2.concat(shuffle(filterPoolExclChosen('II', ['M2', 'M3', 'M4'])).slice(0, remP2));
        chosenP3 = chosenP3.concat(shuffle(filterPoolExclChosen('III', ['M2', 'M3', 'M4'])).slice(0, remP3));
      } else {
        // moet_standard or others
        chosenP1 = chosenP1.concat(shuffle(filterPoolExclChosen('I')).slice(0, remP1));
        chosenP2 = chosenP2.concat(shuffle(filterPoolExclChosen('II')).slice(0, remP2));
        chosenP3 = chosenP3.concat(shuffle(filterPoolExclChosen('III')).slice(0, remP3));
      }

      // If any part was underfilled, backfill from remaining of that part
      function backfill(chosen, part, targetCount){
        if(chosen.length < targetCount){
          var remaining = shuffle(pool.filter(function(q){
            return q.part === part && chosen.indexOf(q) === -1;
          }));
          chosen = chosen.concat(remaining.slice(0, targetCount - chosen.length));
        }
        return chosen;
      }

      chosenP1 = backfill(chosenP1, 'I', targetP1);
      chosenP2 = backfill(chosenP2, 'II', targetP2);
      chosenP3 = backfill(chosenP3, 'III', targetP3);

      var allSelected = chosenP1.concat(chosenP2).concat(chosenP3);

      var stats = {
        total: allSelected.length,
        p1: chosenP1.length,
        p2: chosenP2.length,
        p3: chosenP3.length,
        m1: allSelected.filter(function(q){ return q.level === 'M1'; }).length,
        m2: allSelected.filter(function(q){ return q.level === 'M2'; }).length,
        m3: allSelected.filter(function(q){ return q.level === 'M3'; }).length,
        m4: allSelected.filter(function(q){ return q.level === 'M4'; }).length,
        reviewCount: reviewChosen.length,
        excludedAttemptedCount: excludedAttemptedCount
      };

      setGenerated({
        student: student,
        examCode: examCode,
        title: 'Đề Luyện Thi Cá Nhân Hóa - ' + (student ? student.name : 'Học Sinh'),
        createdAt: new Date(),
        p1: chosenP1,
        p2: chosenP2,
        p3: chosenP3,
        stats: stats
      });

      props.fireToast('Đã tạo xong đề theo lộ trình gồm ' + allSelected.length + ' câu hỏi!');
    }

    // Nạp NGUYÊN VẸN 1 đề Sở/Trường đã đánh dấu examKind==='soTruong' — THÊM
    // 26/9/2026. Khác hẳn handleGenerate(): KHÔNG xáo trộn, KHÔNG lọc theo
    // Level/goalProfile — giữ đúng thứ tự câu hỏi gốc trong file .tex đã nạp,
    // chỉ tách theo Phần I/II/III để tương thích với hình dạng "generated"
    // chung mà handleExportTeX()/handleAssignToStudent() đều dùng lại được.
    function handleGenerateFromSoTruong(){
      var exam = soTruongExams.filter(function(e){ return e.id === selectedSoTruongExamId; })[0];
      if(!exam){
        props.fireToast('Hãy chọn 1 đề Sở/Trường đã nạp (mục "Ngân hàng đề" → tick "Đây là đề Sở/Trường" khi nạp).', true);
        return;
      }
      if(!student){
        props.fireToast('Hãy chọn học sinh nhận đề.', true);
        return;
      }
      var qs = (exam.questions || []).map(function(q){
        return Object.assign({}, q, {examTitle: exam.title, chuDe: exam.chuDe, examId: exam.id, examImages: exam.images});
      });
      var chosenP1 = qs.filter(function(q){ return q.part === 'I'; });
      var chosenP2 = qs.filter(function(q){ return q.part === 'II'; });
      var chosenP3 = qs.filter(function(q){ return q.part === 'III'; });
      var allSelected = chosenP1.concat(chosenP2, chosenP3);
      if(!allSelected.length){
        props.fireToast('Đề Sở/Trường này chưa có câu hỏi nào — kiểm tra lại file đã nạp ở "Ngân hàng đề".', true);
        return;
      }
      var stats = {
        total: allSelected.length,
        p1: chosenP1.length,
        p2: chosenP2.length,
        p3: chosenP3.length,
        m1: allSelected.filter(function(q){ return q.level === 'M1'; }).length,
        m2: allSelected.filter(function(q){ return q.level === 'M2'; }).length,
        m3: allSelected.filter(function(q){ return q.level === 'M3'; }).length,
        m4: allSelected.filter(function(q){ return q.level === 'M4'; }).length,
        reviewCount: 0,
        excludedAttemptedCount: 0
      };
      setGenerated({
        student: student,
        examCode: examCode,
        title: exam.title,
        createdAt: new Date(),
        p1: chosenP1,
        p2: chosenP2,
        p3: chosenP3,
        stats: stats,
        isSoTruong: true,
        sourceExamId: exam.id
      });
      props.fireToast('Đã nạp nguyên đề "' + exam.title + '" (' + allSelected.length + ' câu, giữ nguyên thứ tự) — sẵn sàng giao cho học sinh!');
    }

    // Export .tex file adhering strictly to the official MOET physics exam template
    function handleExportTeX(){
      if(!generated) return;

      var s = generated.student || {};
      var code = generated.examCode || '101';
      var lines = [];

      lines.push('\\documentclass[12pt,a4paper]{article}');
      lines.push('\\usepackage[utf8]{inputenc}');
      lines.push('\\usepackage[vietnamese]{babel}');
      lines.push('\\usepackage{amsmath,amssymb,amsfonts}');
      lines.push('\\usepackage{graphicx}');
      lines.push('\\usepackage{geometry}');
      lines.push('\\geometry{top=1.8cm,bottom=1.8cm,left=1.8cm,right=1.8cm}');
      lines.push('\\usepackage{tikz}');
      lines.push('\\usepackage{answers}');
      lines.push('');
      lines.push('% ==========================================');
      lines.push('% ĐỀ LUYỆN THI VẬT LÍ CÁ NHÂN HÓA - HỆ THỐNG FARADAYAI');
      lines.push('% Học sinh: ' + (s.name || 'Học sinh'));
      lines.push('% Mục tiêu điểm: ' + (s.targetScore || 8) + '+ | Mã đề: ' + code);
      lines.push('% Ma trận: M1(' + generated.stats.m1 + ') - M2(' + generated.stats.m2 + ') - M3(' + generated.stats.m3 + ') - M4(' + generated.stats.m4 + ')');
      lines.push('% ==========================================');
      lines.push('');
      lines.push('\\Newassociation{sol}{Solution}{ans}');
      lines.push('\\Opensolutionfile{ans}[ans/ansbook-' + code + ']');
      lines.push('');
      lines.push('\\begin{document}');
      lines.push('');
      lines.push('\\noindent\\begin{minipage}{0.48\\textwidth}');
      lines.push('  \\textbf{HỆ THỐNG LUYỆN THI VẬT LÍ FARADAYAI}\\\\');
      lines.push('  \\textbf{LỘ TRÌNH CÁ NHÂN HÓA 2025 - 2026}');
      lines.push('\\end{minipage}');
      lines.push('\\hfill');
      lines.push('\\begin{minipage}{0.48\\textwidth}');
      lines.push('  \\raggedleft');
      lines.push('  \\textbf{KÌ THI TỐT NGHIỆP THPT}\\\\');
      lines.push('  \\textbf{BÀI THI: VẬT LÍ}\\\\');
      lines.push('  \\textit{Thời gian làm bài: 50 phút}');
      lines.push('\\end{minipage}');
      lines.push('');
      lines.push('\\vspace{0.4cm}');
      lines.push('\\noindent Họ, tên học sinh: \\textbf{' + (s.name || '......................................................') + '} \\hfill Mã đề thi \\textbf{' + code + '}');
      lines.push('\\vspace{0.3cm}');
      lines.push('\\hrule');
      lines.push('\\vspace{0.4cm}');
      lines.push('');

      // PHẦN I
      if(generated.p1.length){
        lines.push('\\tieuephan{\\textbf{I}}{\\noindent\\textit{\\textbf{Câu trắc nghiệm nhiều phương án lựa chọn.} Thí sinh trả lời từ câu 1 đến câu ' + generated.p1.length + '. Mỗi câu hỏi thí sinh chỉ chọn một phương án.}}');
        lines.push('');
        generated.p1.forEach(function(q, idx){
          lines.push('%Câu ' + (idx + 1));
          lines.push('% [' + q.level + '][' + (q.chuDeLon || q.chuDe || 'Vật lí') + '][' + (q.dangBai || '') + ']');
          lines.push(q.raw || ('\\begin{ex}\n' + q.stem + '\n\\end{ex}'));
          lines.push('');
        });
      }

      // PHẦN II
      if(generated.p2.length){
        lines.push('\\tieuephan{\\textbf{II}}{\\noindent\\textit{\\textbf{Câu trắc nghiệm đúng sai.} Thí sinh trả lời từ câu 1 đến câu ' + generated.p2.length + '. Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chọn đúng hoặc sai.}}');
        lines.push('');
        generated.p2.forEach(function(q, idx){
          lines.push('%Câu ' + (idx + 1));
          lines.push('% [' + q.level + '][' + (q.chuDeLon || q.chuDe || 'Vật lí') + '][' + (q.dangBai || '') + ']');
          lines.push(q.raw || ('\\begin{ex}\n' + q.stem + '\n\\end{ex}'));
          lines.push('');
        });
      }

      // PHẦN III
      if(generated.p3.length){
        lines.push('\\tieuephan{\\textbf{III}}{\\noindent\\textit{\\textbf{Câu trắc nghiệm trả lời ngắn.} Thí sinh trả lời từ câu 1 đến câu ' + generated.p3.length + '.}}');
        lines.push('');
        generated.p3.forEach(function(q, idx){
          lines.push('%Câu ' + (idx + 1));
          lines.push('% [' + q.level + '][' + (q.chuDeLon || q.chuDe || 'Vật lí') + '][' + (q.dangBai || '') + ']');
          lines.push(q.raw || ('\\begin{ex}\n' + q.stem + '\n\\end{ex}'));
          lines.push('');
        });
      }

      lines.push('\\Closesolutionfile{ans}');
      lines.push('\\end{document}');

      var content = lines.join('\n');
      var filename = 'De_CaNhanHoa_' + (s.name ? s.name.replace(/\s+/g, '_') : 'FaradayAI') + '_MaDe' + code + '.tex';
      var blob = new Blob([content], {type: 'application/x-tex;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      props.fireToast('Đã tải xuống file .tex: ' + filename);
    }

    // ============ Giao đề cá nhân hóa cho học sinh (lên web OPC) ============
    // Chuyển 1 câu hỏi từ định dạng "thô" (parseTexBank, như trong questionPool)
    // sang ĐÚNG định dạng mà trang luyện tập học sinh (prepscholar-ui.js /
    // QUESTION_BANK) hiểu — LẶP LẠI logic của transformQuestion/
    // resolveQuestionImages trong opc-live-data.js (không import được vì đó là
    // ES module riêng cho học sinh, admin.html không dùng type=module).
    // Quan trọng: dùng ĐÚNG công thức id "<examId>_q<index>" như bên đó, để
    // sau này nếu câu hỏi này cũng trùng với câu trong QUESTION_BANK (vì cùng
    // nguồn de_thi), việc tra cứu theo id (vd trong "Sổ tay câu sai") vẫn khớp.
    // Giao đề vừa tạo (generated) vào students/{id}/assignedExams để học sinh
    // làm trực tiếp trên trang cá nhân của mình, không cần tải file nào cả.
    async function handleAssignToStudent(){
      if(!generated || !generated.student){
        props.fireToast('Chưa tạo đề hoặc chưa chọn học sinh.', true);
        return;
      }
      setAssigning(true);
      try{
        var allQ = generated.p1.concat(generated.p2).concat(generated.p3);
        // Gom câu hỏi theo examId nguồn — vì đề cá nhân hóa có thể trộn câu
        // từ NHIỀU đề khác nhau, mỗi đề cần tải riêng danh sách ảnh của nó.
        var byExam = {};
        allQ.forEach(function(q){
          var key = q.examId || 'unknown';
          if(!byExam[key]) byExam[key] = { examId: q.examId, examTitle: q.examTitle, examImages: q.examImages, questions: [] };
          byExam[key].questions.push(q);
        });
        var examIds = Object.keys(byExam);
        var resolvedByExam = {};
        for(var i = 0; i < examIds.length; i++){
          var grp = byExam[examIds[i]];
          resolvedByExam[examIds[i]] = grp.examId
            ? await OPCref.examBank.loadExamImages(grp.examId, grp.examImages)
            : [];
        }
        // Giữ đúng thứ tự câu hỏi gốc (p1 rồi p2 rồi p3), không theo thứ tự gộp examId
        var transformed = allQ.map(function(q){
          var resolvedImages = resolvedByExam[q.examId || 'unknown'] || [];
          return toStudentQuestionShape(q, q.examId || 'unknown', q.examTitle || '', resolvedImages);
        });

        // Đánh số thứ tự "Đề số N" — THÊM 26/9/2026: đếm số đề đã giao TRƯỚC
        // ĐÓ cho đúng học sinh này rồi +1, để phân biệt đề số mấy trong danh
        // sách "Đề cá nhân hóa đã giao" (StudentsPanel) và khi xuất PDF.
        var seq = 1;
        try{
          seq = (await OPCref.assignedExams.countForStudent(generated.student.id)) + 1;
        }catch(seqErr){
          console.error('Lỗi đếm số đề đã giao (Đề số N):', seqErr);
        }

        var examData = {
          seq: seq,
          title: generated.title,
          goalProfile: goalProfile,
          examCode: generated.examCode,
          chuDeFilter: selectedTopic,
          createdAt: generated.createdAt,
          sourceType: generated.isSoTruong ? 'soTruong' : 'personalized',
          sourceExamId: generated.sourceExamId || null,
          totalQuestions: transformed.length,
          partCounts: { p1: generated.stats.p1, p2: generated.stats.p2, p3: generated.stats.p3 },
          levelCounts: { m1: generated.stats.m1, m2: generated.stats.m2, m3: generated.stats.m3, m4: generated.stats.m4 },
          questions: transformed
        };

        await OPCref.assignedExams.save(generated.student.id, examData);
        setLastAssigned(Object.assign({}, examData, { student: generated.student }));
        props.fireToast('Đã giao "Đề số ' + seq + '" cho học sinh ' + generated.student.name + ' — bạn ấy có thể làm ngay trên trang cá nhân!');
      }catch(err){
        console.error('Lỗi giao đề cho học sinh:', err);
        props.fireToast('Có lỗi khi giao đề: ' + (err && err.message ? err.message : err), true);
      }finally{
        setAssigning(false);
      }
    }

    if(loading){
      return h('div',{className:'card'}, h('p',{style:{color:'var(--ink-2)'}}, 'Đang tải dữ liệu ngân hàng đề…'));
    }
    if(loadErr){
      return h('div',{className:'card'},
        h('div',{className:'banner warn'}, h('span',null,'⚠️'), h('div',null, 'Không tải được dữ liệu: ', loadErr.message || loadErr.code)));
    }
