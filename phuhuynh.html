<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>/* áp giao diện sáng/tối đã chọn (xem theme-toggle.js) */(function(){try{var t=localStorage.getItem("opc-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tiến độ học Vật lí — FaradayAI</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Literata:wght@600;700&display=swap">
<!--
  THÊM 20/10/2026 — TRANG TIẾN ĐỘ CHO PHỤ HUYNH (mỗi em 1 link /phuhuynh?t=<mã>, thầy tạo trong admin → Hồ sơ học sinh).
  Đọc ảnh chụp số liệu parent_views/{mã} (chỉ đọc được đúng mã trong link). Không cần đăng nhập. Dùng cho buổi tư vấn/chốt
  và gửi phụ huynh hằng tuần. Có nút In (lưu PDF).
-->
<style>
  :root{
    --bg:#f5f6f1; --surface:#ffffff; --surface-2:#eceee5; --ink:#12161c; --ink-2:#4a5262; --muted:#868d7c; --line:#dde1d5;
    --accent:#a86a1c; --accent-strong:#8f5714; --accent-ink:#fffaf1; --good:#0f8a3c; --warning:#b8790a; --critical:#d03b3b;
    --red-bg:#fdecec; --yellow-bg:#fdf3dc; --green-bg:#e3f5e9; --shadow:0 1px 2px rgba(16,21,29,.05),0 10px 30px -14px rgba(16,21,29,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171a; --surface:#1c2024; --surface-2:#23272c; --ink:#f1f0ea; --ink-2:#c4c8c2; --muted:#8b9088; --line:#2d312e;
      --accent:#dba24f; --accent-strong:#eab868; --accent-ink:#1b1204; --good:#3ccf6e; --warning:#e0a838; --critical:#ee6b69;
      --red-bg:#3a2020; --yellow-bg:#3a3020; --green-bg:#1d3326; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --surface:#1c2024; --surface-2:#23272c; --ink:#f1f0ea; --ink-2:#c4c8c2; --muted:#8b9088; --line:#2d312e;
    --accent:#dba24f; --accent-strong:#eab868; --accent-ink:#1b1204; --good:#3ccf6e; --warning:#e0a838; --critical:#ee6b69;
    --red-bg:#3a2020; --yellow-bg:#3a3020; --green-bg:#1d3326; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px;}
  header.top{border-bottom:1px solid var(--line);background:var(--surface);}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;}
  .logo{height:30px;display:block;} .logo.dark{display:none;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo.light{display:none;} :root:not([data-theme="light"]) .logo.dark{display:block;} }
  :root[data-theme="dark"] .logo.light{display:none;} :root[data-theme="dark"] .logo.dark{display:block;}
  .top-tag{font-size:.78rem;color:var(--muted);font-weight:600;text-align:right;}
  .hero{padding:26px 0 8px;}
  .kicker{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong);}
  h1{font-family:Literata,Georgia,serif;font-size:clamp(1.6rem,4.5vw,2.3rem);margin:4px 0 2px;line-height:1.2;}
  .sub{color:var(--ink-2);font-size:.92rem;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
  .kpi .lbl{font-size:.74rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;}
  .kpi .val{font-size:2rem;font-weight:800;line-height:1.1;margin-top:6px;}
  .kpi .val small{font-size:.9rem;color:var(--muted);font-weight:600;}
  .kpi .note{font-size:.82rem;color:var(--ink-2);margin-top:4px;}
  .kpi.main{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--line));}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);}
  .pill.cao{background:var(--green-bg);color:var(--good);} .pill.tb{background:var(--yellow-bg);color:var(--warning);} .pill.thap{background:var(--red-bg);color:var(--critical);}
  section{margin:14px 0;}
  h2{font-size:1.08rem;margin:0 0 10px;}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;}
  .bar{display:grid;grid-template-columns:minmax(110px,1fr) 2.2fr 46px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem;}
  .bar .tr{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .bar .tr i{display:block;height:100%;border-radius:99px;}
  .bar b{text-align:right;}
  .gaps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .gap-col h3{font-size:.92rem;margin:0 0 6px;display:flex;align-items:center;gap:6px;}
  .gap-item{padding:7px 10px;border-radius:10px;margin:6px 0;font-size:.86rem;line-height:1.4;}
  .gap-item small{display:block;color:var(--ink-2);font-size:.76rem;}
  .gap-item.red{background:var(--red-bg);} .gap-item.yellow{background:var(--yellow-bg);} .gap-item.green{background:var(--green-bg);}
  .big-num{font-size:2.4rem;font-weight:800;color:var(--good);line-height:1;}
  .note-card{border-left:4px solid var(--accent);}
  .note-card p{margin:0;white-space:pre-wrap;}
  ul.clean{margin:6px 0 0;padding-left:20px;} ul.clean li{margin:4px 0;}
  .chart svg{display:block;width:100%;height:auto;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2);margin-top:6px;}
  .legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;font:700 .92rem "Be Vietnam Pro",sans-serif;cursor:pointer;text-decoration:none;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);} .btn.zalo{background:#0068ff;color:#fff;} .btn.ghost{background:var(--surface-2);color:var(--ink);}
  footer{color:var(--muted);font-size:.78rem;padding:18px 0 40px;line-height:1.6;}
  .empty{padding:60px 0;text-align:center;color:var(--ink-2);}
  @media (max-width:820px){ .grid{grid-template-columns:repeat(2,1fr);} .two{grid-template-columns:1fr;} .gaps{grid-template-columns:1fr;} }
  @media (max-width:420px){ .kpi .val{font-size:1.65rem;} .bar{grid-template-columns:96px 1fr 40px;} }
  @media print{ body{background:#fff;font-size:12px;} .actions,header.top .top-tag{display:none !important;} .card{box-shadow:none;break-inside:avoid;} @page{size:A4;margin:12mm;} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="FaradayAI"><img class="logo light" src="/logo-horizontal.svg" alt="FaradayAI" width="140" height="33"><img class="logo dark" src="/logo-horizontal-dark.svg" alt="FaradayAI" width="140" height="33"></a>
  <div class="top-tag">Báo cáo tiến độ<br>dành cho phụ huynh</div>
</div></header>
<main class="wrap" id="app"><div class="empty">Đang tải báo cáo…</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyDurMtOnC6ghLYFIRBteHL348i-D983oRk", authDomain: "opcluyenthivatli.firebaseapp.com", projectId: "opcluyenthivatli",
  storageBucket: "opcluyenthivatli.firebasestorage.app", messagingSenderId: "90488773349", appId: "1:90488773349:web:4bd83994c72afe12dc920c"
}, 'opc-parent');
const db = getFirestore(app);
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = x => (x == null || isNaN(x)) ? '—' : Number(x).toFixed(1).replace('.', ',');
const vnDate = s => { const d = new Date(s); return isNaN(d) ? '' : String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const barColor = p => p >= 80 ? 'var(--good)' : (p >= 50 ? 'var(--warning)' : 'var(--critical)');

function chart(scores, target){
  if(!scores || scores.length < 2) return '<p class="sub">Biểu đồ sẽ hiện khi con có từ 2 bài làm được chấm điểm.</p>';
  const W = 640, H = 230, L = 34, R = 12, T = 14, B = 30;
  const xs = i => L + (W - L - R) * (scores.length === 1 ? 0.5 : i / (scores.length - 1));
  const ys = v => T + (H - T - B) * (1 - Math.max(0, Math.min(10, v)) / 10);
  let g = '';
  for(let v = 0; v <= 10; v += 2) g += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${ys(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`;
  if(target) g += `<line x1="${L}" x2="${W - R}" y1="${ys(target)}" y2="${ys(target)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R}" y="${ys(target) - 5}" font-size="11" text-anchor="end" fill="var(--good)" font-weight="700">Mục tiêu ${f1(target)}</text>`;
  const pts = scores.map((s, i) => `${xs(i).toFixed(1)},${ys(s.s).toFixed(1)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>`;
  // đường xu hướng các bài đủ cấu trúc (thi thử)
  const full = scores.map((s, i) => ({ s, i })).filter(x => x.s.full);
  if(full.length >= 2) g += `<polyline points="${full.map(x => `${xs(x.i).toFixed(1)},${ys(x.s.s).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.4"/>`;
  scores.forEach((s, i) => {
    g += s.full
      ? `<circle cx="${xs(i)}" cy="${ys(s.s)}" r="6" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>${esc(vnDate(s.d))} · ${esc(s.t)} · ${f1(s.s)} điểm</title></circle>`
      : `<circle cx="${xs(i)}" cy="${ys(s.s)}" r="3.6" fill="var(--accent)"><title>${esc(vnDate(s.d))} · ${esc(s.t)} · ${f1(s.s)} điểm</title></circle>`;
  });
  const first = scores[0], last = scores[scores.length - 1];
  g += `<text x="${L}" y="${H - 8}" font-size="11" fill="var(--muted)">${esc(vnDate(first.d))}</text><text x="${W - R}" y="${H - 8}" font-size="11" text-anchor="end" fill="var(--muted)">${esc(vnDate(last.d))}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ điểm các bài làm">${g}</svg>
    <div class="legend"><span style="--c:var(--ink)">Bài thi thử đủ cấu trúc 28 câu</span><span style="--c:var(--accent)">Bài luyện tập</span>${target ? '<span style="--c:var(--good)">Mục tiêu</span>' : ''}</div>`;
}

function render(v){
  const p = v.predicted, target = v.target, g = v.gaps || {};
  const confCls = p ? ({ 'cao': 'cao', 'trung bình': 'tb', 'thấp': 'thap' }[p.conf] || '') : '';
  const fulls = (v.scores || []).filter(s => s.full);
  const firstFull = fulls[0], lastFull = fulls[fulls.length - 1];
  const topics = Object.keys(v.topics || {}).map(k => v.topics[k]);
  const partNames = { I: 'Phần I · Trắc nghiệm 4 lựa chọn', II: 'Phần II · Đúng/Sai', III: 'Phần III · Trả lời ngắn' };
  document.title = 'Tiến độ học Vật lí — ' + v.name;
  $app.innerHTML = `
  <div class="hero">
    <div class="kicker">Báo cáo tiến độ · cập nhật ${esc(vnDate(v.updatedAt))}</div>
    <h1>${esc(v.name)}</h1>
    <div class="sub">${[v.school, v.lop ? 'Lớp ' + v.lop : ''].filter(Boolean).map(esc).join(' · ') || 'Luyện thi tốt nghiệp THPT môn Vật lí'}</div>
  </div>
  <div class="grid">
    <div class="card kpi main"><div class="lbl">Điểm thi dự đoán</div>
      <div class="val">${p ? f1(p.p) : '—'}<small> /10</small></div>
      <div class="note">${p ? 'Khoảng ' + f1(p.low) + ' – ' + f1(p.high) + ' <span class="pill ' + confCls + '">tin cậy ' + esc(p.conf) + '</span>' : esc(v.reason || 'Chưa đủ dữ liệu — con cần làm thêm bài')}</div></div>
    <div class="card kpi"><div class="lbl">Mục tiêu</div>
      <div class="val">${target ? f1(target) : '—'}<small>${target ? '+' : ''}</small></div>
      <div class="note">${p && target ? (p.p >= target ? '✅ Đang ở mức mục tiêu' : 'Còn cách ' + f1(target - p.p) + ' điểm') : ''}</div></div>
    <div class="card kpi"><div class="lbl">Lỗ hổng đã vá · 30 ngày</div>
      <div class="val" style="color:var(--good)">${g.fixed30Count || 0}</div>
      <div class="note">${(g.red || []).length ? 'Còn ' + (g.red || []).length + (g.red.length >= 10 ? '+' : '') + ' phần cần vá' : 'Không còn phần nào ở mức yếu'}</div></div>
    <div class="card kpi"><div class="lbl">7 ngày qua</div>
      <div class="val">${v.week ? v.week.questions : 0}<small> câu</small></div>
      <div class="note">${v.week ? v.week.attempts + ' lượt luyện' + (v.week.avg != null ? ' · TB ' + f1(v.week.avg) + ' điểm' : '') : ''}</div></div>
  </div>
  ${v.note ? `<section class="card note-card"><h2>💬 Nhận xét của thầy</h2><p>${esc(v.note)}</p></section>` : ''}
  <section class="card chart"><h2>📈 Điểm các bài làm</h2>
    ${firstFull && lastFull && fulls.length >= 2 ? `<p class="sub" style="margin:-4px 0 8px">Bài thi thử đầu tiên ${f1(firstFull.s)} → gần nhất ${f1(lastFull.s)} điểm (${fulls.length} bài thi thử)</p>` : ''}
    ${chart(v.scores, target)}
  </section>
  <section class="card"><h2>🗺️ Bản đồ lỗ hổng kiến thức</h2>
    <p class="sub" style="margin-top:-4px">FaradayAI chia chương trình thành các "điểm kiến thức" nhỏ và theo dõi từng điểm qua mọi bài con làm. Đã kiểm tra ${g.tested || 0}${g.total ? '/' + g.total : ''} điểm kiến thức.</p>
    ${topics.length ? topics.map(t => `<div class="bar"><span>${esc(t.name)}</span><span class="tr"><i style="width:${Math.max(3, t.pct)}%;background:${barColor(t.pct)}"></i></span><b>${t.pct}%</b></div>`).join('') : ''}
    <div class="gaps" style="margin-top:14px">
      <div class="gap-col"><h3>🔴 Cần vá ngay</h3>${(g.red || []).length ? g.red.slice(0, 6).map(x => `<div class="gap-item red">${esc(x.name)}<small>${esc(x.bai)}</small></div>`).join('') : '<p class="sub">Không có 🎉</p>'}</div>
      <div class="gap-col"><h3>🟡 Đang tiến bộ</h3>${(g.yellow || []).length ? g.yellow.slice(0, 6).map(x => `<div class="gap-item yellow">${esc(x.name)}<small>${esc(x.bai)}</small></div>`).join('') : '<p class="sub">—</p>'}</div>
      <div class="gap-col"><h3>🟢 Đã vững</h3><div class="big-num">${g.green || 0}</div><p class="sub" style="margin:4px 0 8px">điểm kiến thức</p>
        ${(g.fixed30 || []).length ? '<div class="sub" style="font-weight:700;margin-bottom:4px">Mới vá được (30 ngày):</div>' + g.fixed30.slice(0, 5).map(n => `<div class="gap-item green">✓ ${esc(n)}</div>`).join('') : ''}</div>
    </div>
  </section>
  <div class="two">
    ${p && p.parts ? `<section class="card"><h2>🎯 Điểm dự đoán theo phần đề</h2>
      ${['I', 'II', 'III'].map(k => p.parts[k] ? `<div class="bar"><span>${partNames[k]}</span><span class="tr"><i style="width:${Math.max(3, p.parts[k].exp / p.parts[k].max * 100)}%;background:${barColor(p.parts[k].exp / p.parts[k].max * 100)}"></i></span><b>${f1(p.parts[k].exp)}/${f1(p.parts[k].max)}</b></div>` : '').join('')}
      ${(p.tips || []).length ? '<ul class="clean">' + p.tips.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>' : ''}
      <p class="sub" style="font-size:.78rem;margin-top:8px">Dự đoán dựa trên ${p.n || 0} câu con đã làm, áp vào cấu trúc đề thi tốt nghiệp. Đây là ước lượng, không phải cam kết.</p></section>` : ''}
    <section class="card"><h2>🧭 Tuần tới tập trung</h2>
      ${(v.focus || []).length ? '<ul class="clean">' + v.focus.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>' : '<p class="sub">Duy trì luyện đề đều đặn, ôn lại Sổ tay câu sai.</p>'}
      ${v.mistakes ? `<p class="sub" style="margin-top:10px">Sổ tay câu sai: ${v.mistakes} câu đang chờ con ôn lại theo lịch giãn cách.</p>` : ''}
    </section>
  </div>
  <div class="actions">
    ${v.zalo ? `<a class="btn zalo" href="${esc(v.zalo)}" target="_blank" rel="noopener">💬 Nhắn Zalo thầy</a>` : ''}
    <button class="btn ghost" type="button" onclick="window.print()">🖨️ In / lưu PDF</button>
    <a class="btn primary" href="/" target="_blank" rel="noopener">Về FaradayAI.vn</a>
  </div>
  <footer>Số liệu được FaradayAI tự tổng hợp từ các bài con làm trên hệ thống (luyện tập, đề thầy giao, bài làm trên giấy, kiểm tra trên lớp). Trang này chỉ dành cho phụ huynh của em ${esc(v.name)} — vui lòng không chia sẻ công khai.</footer>`;
}

(async () => {
  const t = new URLSearchParams(location.search).get('t') || location.hash.replace(/^#/, '');
  if(!t || !/^[a-z0-9]{16,40}$/.test(t)){ $app.innerHTML = '<div class="empty">Link chưa đúng. Phụ huynh vui lòng mở lại đúng link thầy gửi qua Zalo.</div>'; return; }
  try{
    const snap = await getDoc(doc(db, 'parent_views', t));
    if(!snap.exists()){ $app.innerHTML = '<div class="empty">Link này đã hết hiệu lực hoặc đã được thầy đổi. Phụ huynh vui lòng xin thầy link mới.</div>'; return; }
    render(snap.data());
  }catch(e){
    console.error(e);
    $app.innerHTML = '<div class="empty">Chưa tải được báo cáo (' + esc(e && (e.code || e.message)) + '). Phụ huynh thử tải lại trang sau ít phút.</div>';
  }
})();
</script>
</body>
</html>
